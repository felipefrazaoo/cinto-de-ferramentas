<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cinto de Ferramentas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0F2F5;--card:#FFF;--sb:#FFF;--border:#E4E7EC;
  --tx:#1A1D23;--mu:#9CA3AF;--sub:#5A6170;--hv:#F7F8FA;
  --ac:#2D6BE4;--pr:#374151;--pn:#F7F9FD;--amber:#F59E0B;
}
.dark{
  --bg:#0F1117;--card:#16181F;--sb:#16181F;--border:#252830;
  --tx:#E8E9EB;--mu:#6B7280;--sub:#9CA3AF;--hv:#1E2130;
  --ac:#2D6BE4;--pr:#B8BEC8;--pn:#1A1D26;--amber:#F59E0B;
}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);height:100vh;overflow:hidden;transition:background .2s,color .2s}
.app{display:flex;height:100vh}
/* SIDEBAR */
.sb{width:215px;min-width:215px;background:var(--sb);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sb-top{padding:14px 12px 8px}
.logo{font-size:13px;font-weight:600;color:var(--tx);display:flex;align-items:center;gap:6px}
.logo-sub{font-size:10px;color:var(--mu);margin-left:24px;margin-top:1px}
.ctrls{display:flex;gap:4px;margin-top:8px}
.ctrl{flex:1;padding:5px 0;font-size:11px;font-weight:500;border:1px solid var(--border);border-radius:6px;background:var(--hv);color:var(--sub);cursor:pointer}
.ctrl:hover{background:var(--border);color:var(--tx)}
.srch{padding:8px 12px}
.sw{position:relative}
.sw input{width:100%;padding:6px 10px 6px 28px;font-size:12px;border:1px solid var(--border);border-radius:7px;background:var(--hv);color:var(--tx);outline:none}
.sw input:focus{border-color:var(--ac)}
.si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--mu);font-size:12px}
.nav{flex:1;overflow-y:auto;padding:4px 0}
.nl{font-size:10px;font-weight:600;color:var(--mu);padding:8px 12px 3px;letter-spacing:.5px;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:7px;padding:6px 12px;font-size:12px;color:var(--sub);cursor:pointer;border-left:2px solid transparent;transition:all .15s;user-select:none}
.ni:hover{background:var(--hv);color:var(--tx)}
.ni.on{background:rgba(45,107,228,.1);color:var(--ac);border-left-color:var(--ac);font-weight:500}
.nb{margin-left:auto;font-size:10px;background:var(--hv);color:var(--mu);border-radius:8px;padding:1px 5px}
.nd{height:1px;background:var(--border);margin:4px 0}
.add-btn{margin:10px 12px;padding:8px;font-size:11px;font-weight:500;border:1px dashed var(--border);border-radius:7px;background:transparent;color:var(--mu);cursor:pointer;width:calc(100% - 24px)}
.add-btn:hover{border-color:var(--ac);color:var(--ac)}
/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--sb);display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0}
.tt{font-size:13px;font-weight:600}
.tc{font-size:12px;color:var(--mu)}
.fts{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.fc{padding:3px 9px;font-size:11px;font-weight:500;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--mu);cursor:pointer;transition:all .15s}
.content{flex:1;display:flex;overflow:hidden}
/* LIST */
.list{flex:1;overflow-y:auto;padding:12px}
.ch{font-size:10px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 7px;display:flex;align-items:center;gap:5px}
.ch:first-child{margin-top:0}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:10px 12px;cursor:pointer;transition:all .15s;position:relative}
.card:hover{border-color:var(--ac);transform:translateY(-1px)}
.card.sel{border-color:var(--ac);border-width:2px}
.cn{font-size:12px;font-weight:600;margin-bottom:2px;line-height:1.3;color:var(--tx)}
.co2{font-size:10px;color:var(--mu);margin-bottom:5px}
.tag{display:inline-block;font-size:10px;font-weight:500;padding:2px 7px;border-radius:8px}
.fd{position:absolute;top:7px;right:8px;font-size:12px}
.emp{display:flex;flex-direction:column;align-items:center;justify-content:center;height:180px;color:var(--mu);gap:6px;font-size:13px}
/* DETAIL */
.det{background:var(--sb);border-left:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;position:relative;flex-shrink:0}
.det-rz{position:absolute;left:0;top:0;width:5px;height:100%;cursor:col-resize;z-index:10;background:transparent}
.det-rz:hover,.det-rz.drag{background:var(--ac)}
.de{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center}
.dei{font-size:32px;opacity:.3}
.det2{font-size:12px;color:var(--mu)}
.db{padding:16px;flex:1}
.dtag{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:3px 8px;border-radius:8px;margin-bottom:10px}
.dn{font-size:16px;font-weight:700;color:var(--tx);margin-bottom:4px;line-height:1.3}
.dor{font-size:11px;color:var(--mu);margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.dds{font-family:Georgia,serif;font-size:12.5px;color:var(--pr);line-height:1.7;margin-bottom:14px;padding:10px;background:var(--pn);border-radius:8px;border-left:3px solid var(--ac)}
.dsec{margin-bottom:14px}
.dst{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);margin-bottom:7px}
.step{display:flex;gap:7px;margin-bottom:6px;align-items:flex-start}
.sn{width:18px;height:18px;border-radius:50%;background:var(--ac);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.st{font-size:11px;color:var(--pr);line-height:1.5}
.exi{background:var(--pn);border:1px solid var(--border);border-radius:7px;padding:9px 11px;margin-bottom:5px}
.exn{font-size:10px;font-weight:600;color:var(--ac);margin-bottom:3px}
.ext{font-size:11px;color:var(--pr);line-height:1.5}
.exm{font-size:11px;color:var(--ac);cursor:pointer;margin-top:4px;display:inline-block;font-weight:500}
.exm:hover{text-decoration:underline}
.aet{width:100%;padding:6px;font-size:11px;border:1px dashed var(--border);border-radius:7px;background:transparent;color:var(--mu);cursor:pointer;margin-top:4px}
.aet:hover{border-color:var(--ac);color:var(--ac)}
.aef{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.aef textarea{width:100%;padding:7px;font-size:11px;font-family:inherit;border:1px solid var(--border);border-radius:7px;background:var(--hv);color:var(--tx);resize:vertical;min-height:65px;outline:none}
.aef textarea:focus{border-color:var(--ac)}
.ebr{display:flex;gap:5px}
.wl{display:flex;flex-wrap:wrap;gap:4px}
.wc{font-size:10px;padding:2px 7px;border-radius:6px;background:var(--hv);color:var(--sub);border:1px solid var(--border)}
.da{display:flex;flex-direction:column;gap:5px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.btn{padding:7px 12px;font-size:11px;font-weight:500;border-radius:7px;cursor:pointer;border:none;transition:all .15s;text-align:center;width:100%}
.bp{background:var(--ac);color:#fff}
.bp:hover{background:#2360CC}
.bg2{background:var(--hv);color:var(--sub);border:1px solid var(--border)}
.bg2:hover{background:var(--border)}
.ba{background:rgba(45,107,228,.1);color:var(--ac);border:1px solid rgba(45,107,228,.3)}
.ba:hover{background:var(--ac);color:#fff}
.bf{background:transparent;color:var(--mu);border:1px solid var(--border)}
.bf:hover{border-color:var(--amber);color:var(--amber)}
.bf.on{color:var(--amber);border-color:var(--amber)}
.bl{background:rgba(5,150,105,.1);color:#059669;border:1px solid rgba(5,150,105,.3)}
.bl:hover{background:#059669;color:#fff}
/* DEEP VIEW */
.dv{position:absolute;inset:0;background:var(--bg);overflow-y:auto;z-index:100;display:flex;flex-direction:column}
.dh{background:var(--sb);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;flex-shrink:0;flex-wrap:wrap}
.dbk{font-size:12px;font-weight:500;color:var(--ac);cursor:pointer;padding:5px 10px;border:1px solid rgba(45,107,228,.3);border-radius:6px;background:rgba(45,107,228,.08)}
.dbk:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.dtg{font-size:11px;font-weight:600;padding:3px 9px;border-radius:8px}
.dti{font-size:14px;font-weight:700;color:var(--tx)}
.dbody{padding:24px;max-width:720px;margin:0 auto;width:100%}
.di{font-family:Georgia,serif;font-size:14px;color:var(--pr);line-height:1.8;margin-bottom:24px;padding:16px;background:var(--pn);border-radius:10px;border-left:4px solid var(--ac);white-space:pre-line}
.dsec2{margin-bottom:22px}
.dstl{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.dsb{font-family:Georgia,serif;font-size:13px;color:var(--pr);line-height:1.85;white-space:pre-line}
/* NOTES */
.notes-section{margin-top:32px;border-top:2px solid var(--border);padding-top:24px}
.notes-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.notes-title{font-size:15px;font-weight:700;color:var(--tx)}
.notes-count{font-size:11px;color:var(--mu);background:var(--hv);padding:3px 8px;border-radius:10px;border:1px solid var(--border)}
.note-card{background:var(--pn);border:1px solid var(--border);border-left:4px solid var(--amber);border-radius:10px;padding:14px;margin-bottom:10px;position:relative}
.note-card-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.note-title{font-size:13px;font-weight:700;color:var(--tx);flex:1}
.note-date{font-size:10px;color:var(--mu);white-space:nowrap;margin-top:2px}
.note-del{background:transparent;border:none;cursor:pointer;font-size:14px;opacity:.4;padding:0 2px}
.note-del:hover{opacity:1}
.note-text{font-family:Georgia,serif;font-size:13px;color:var(--pr);line-height:1.7;white-space:pre-wrap}
.note-img{max-width:100%;border-radius:8px;border:1px solid var(--border);display:block;margin-top:10px}
.note-img-name{font-size:10px;color:var(--mu);margin-top:4px}
.note-add-btn{width:100%;padding:10px;font-size:12px;font-weight:500;border:2px dashed var(--border);border-radius:10px;background:transparent;color:var(--mu);cursor:pointer;margin-top:4px}
.note-add-btn:hover{border-color:var(--amber);color:var(--amber)}
.note-form{background:var(--pn);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;margin-top:8px}
.note-input{padding:8px 10px;font-size:13px;font-weight:600;border:1px solid var(--border);border-radius:8px;background:var(--hv);color:var(--tx);outline:none;font-family:inherit}
.note-input:focus{border-color:var(--amber)}
.note-textarea{padding:10px;font-size:13px;font-family:Georgia,serif;border:1px solid var(--border);border-radius:8px;background:var(--hv);color:var(--tx);resize:vertical;min-height:100px;outline:none;line-height:1.6}
.note-textarea:focus{border-color:var(--amber)}
.note-img-upload{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.note-img-label{font-size:12px;font-weight:500;color:var(--sub);cursor:pointer;padding:7px 12px;border:1px dashed var(--border);border-radius:8px}
.note-img-label:hover{border-color:var(--amber);color:var(--amber)}
.note-img-preview{max-width:100%;max-height:200px;border-radius:8px;border:1px solid var(--border);object-fit:cover}
.note-btns{display:flex;gap:8px}
.note-save{flex:1;padding:9px;font-size:12px;font-weight:600;background:var(--amber);color:#fff;border:none;border-radius:8px;cursor:pointer}
.note-save:hover{background:#D97706}
.note-cancel{flex:1;padding:9px;font-size:12px;background:var(--hv);color:var(--sub);border:1px solid var(--border);border-radius:8px;cursor:pointer}
/* EXAMPLE DEEP */
.exdb{padding:24px;max-width:720px;margin:0 auto;width:100%}
.exds{font-family:Georgia,serif;font-size:14px;color:var(--pr);line-height:1.7;margin-bottom:22px;padding:14px 16px;background:var(--pn);border-radius:10px;border-left:4px solid var(--ac);font-style:italic}
.exb{margin-bottom:20px}
.exbt{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ac);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.exbb{font-family:Georgia,serif;font-size:13px;color:var(--pr);line-height:1.85;white-space:pre-line;background:var(--pn);padding:12px 14px;border-radius:8px}
.exlrn{background:rgba(5,150,105,.08);border:1px solid rgba(5,150,105,.3);border-radius:10px;padding:14px 16px}
.exlrn .exbt{color:#059669}
.exlrn .exbb{background:transparent;padding:0}
/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;display:none}
.ov.show{display:flex}
.modal{background:var(--card);border-radius:12px;padding:22px;width:440px;max-width:95vw;max-height:90vh;overflow-y:auto}
.mt{font-size:15px;font-weight:700;color:var(--tx);margin-bottom:16px}
.f{margin-bottom:10px}
.f label{display:block;font-size:10px;font-weight:600;color:var(--mu);margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px}
.f input,.f select,.f textarea{width:100%;padding:7px 9px;font-size:11px;font-family:inherit;border:1px solid var(--border);border-radius:7px;background:var(--hv);color:var(--tx);outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ac)}
.f textarea{min-height:70px;resize:vertical}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ma{display:flex;gap:7px;margin-top:16px}

/* ── MOBILE RESPONSIVE ─────────────────────────────── */
:root { --mob-header: 52px; }

/* Hamburger button — hidden on desktop */
.mob-menu-btn {
  display:none; background:none; border:none; cursor:pointer;
  font-size:22px; padding:6px 10px; color:var(--tx);
  position:fixed; top:8px; left:8px; z-index:300;
  background:var(--sb); border-radius:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.15);
}
/* Mobile top bar */
.mob-topbar {
  display:none; position:fixed; top:0; left:0; right:0;
  height:var(--mob-header); background:var(--sb);
  border-bottom:1px solid var(--border); z-index:200;
  align-items:center; padding:0 12px 0 52px; gap:8px;
}
.mob-topbar .tt { font-size:14px; font-weight:600; flex:1; }
.mob-topbar .ctrls { display:flex; gap:6px; margin:0; }
.mob-topbar .ctrl { padding:5px 10px; font-size:11px; }

/* Sidebar overlay on mobile */
.sb-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.45); z-index:250;
}
.sb-overlay.show { display:block; }

@media (max-width: 768px) {
  /* Show mobile elements */
  .mob-menu-btn { display:flex; align-items:center; }
  .mob-topbar { display:flex; }

  /* App layout — single column */
  .app { flex-direction:column; padding-top:var(--mob-header); }

  /* Sidebar — slide in from left */
  .sb {
    position:fixed; left:-240px; top:0; bottom:0;
    width:240px; z-index:260; transition:left .25s ease;
    overflow-y:auto;
  }
  .sb.open { left:0; }
  .sb .sb-top { padding-top:60px; }

  /* Main fills full width */
  .main { width:100%; overflow:hidden; }

  /* Hide desktop topbar filters on mobile — shown in mob-topbar */
  .topbar { display:none; }

  /* Content area — single column */
  .content { flex-direction:column; }

  /* List panel — full width */
  .list { width:100% !important; padding:10px; }

  /* Cards — single column on narrow, 2 col on wider mobile */
  .cards { grid-template-columns:1fr 1fr; gap:8px; width:100%; }
  @media (max-width:480px) {
    .cards { grid-template-columns:1fr; }
  }

  /* Detail panel — hidden by default, shown as overlay when tool selected */
  .det {
    position:fixed !important;
    inset:0 !important;
    width:100% !important;
    top:var(--mob-header) !important;
    transform:translateX(100%);
    transition:transform .25s ease;
    z-index:150;
    border-left:none !important;
    overflow-y:auto;
  }
  .det.mob-open {
    transform:translateX(0);
  }

  /* Hide resize handle on mobile */
  .det-rz { display:none !important; }

  /* Deep views — z-index only, position already absolute from base CSS */
  .dv { z-index:190 !important; }

  /* Back button on detail panel */
  .mob-det-back {
    display:flex; align-items:center; gap:6px;
    padding:10px 14px 6px;
    font-size:13px; font-weight:500; color:var(--ac);
    cursor:pointer; border-bottom:1px solid var(--border);
    background:var(--sb);
    position:sticky; top:0; z-index:10;
  }
  .mob-det-back-hide { display:none; }

  /* Search in mob topbar */
  .mob-search {
    flex:1; padding:6px 10px 6px 28px; font-size:12px;
    border:1px solid var(--border); border-radius:20px;
    background:var(--hv); color:var(--tx); outline:none;
    max-width:200px;
  }
  .mob-search-wrap { position:relative; flex:1; max-width:200px; }
  .mob-search-icon { position:absolute; left:9px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--mu); }
}

@media (min-width:769px) {
  /* Desktop — hide mobile elements */
  .mob-menu-btn { display:none !important; }
  .mob-topbar { display:none !important; }
  .mob-det-back { display:none !important; }
}

/* ── MODELS SECTION ──────────────────────────────────────── */
.models-view{display:none;overflow-y:auto;padding:16px;background:var(--bg);position:absolute;inset:0;z-index:50}
.models-search-wrap{position:relative;margin-bottom:16px}
.models-search{width:100%;padding:9px 12px 9px 34px;font-size:13px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--tx);outline:none}
.models-search:focus{border-color:var(--ac)}
.models-search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--mu)}
.models-count{font-size:11px;color:var(--mu);margin-bottom:16px}
.cat-accordion{margin-bottom:8px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--card)}
.cat-accordion-hd{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;user-select:none;transition:background .15s}
.cat-accordion-hd:hover{background:var(--hv)}
.cat-accordion-icon{font-size:16px}
.cat-accordion-label{font-size:13px;font-weight:600;color:var(--tx);flex:1}
.cat-accordion-count{font-size:11px;color:var(--mu);background:var(--hv);padding:2px 7px;border-radius:8px;border:1px solid var(--border)}
.cat-accordion-arrow{font-size:11px;color:var(--mu);transition:transform .2s}
.cat-accordion-arrow.open{transform:rotate(90deg)}
.cat-accordion-body{display:none;padding:10px 12px 12px;border-top:1px solid var(--border);background:var(--bg)}
.cat-accordion-body.open{display:block}
.form-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:600px){.form-cards{grid-template-columns:1fr}}
.form-card{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.form-card:hover{border-color:var(--ac)}
.form-card-num{font-size:10px;font-weight:700;color:var(--mu);letter-spacing:.5px}
.form-card-title{font-size:12px;font-weight:600;color:var(--tx);line-height:1.35}
.form-card-desc{font-size:11px;color:var(--sub);line-height:1.45;flex:1}
.form-card-meta{font-size:10px;color:var(--mu)}
.form-card-btn{display:block;width:100%;padding:7px;font-size:11px;font-weight:600;background:var(--ac);color:#fff;border:none;border-radius:7px;cursor:pointer;text-align:center;text-decoration:none;transition:background .15s}
.form-card-btn:hover{background:#2360CC}
.models-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;color:var(--mu);gap:8px;font-size:13px}

/* ── MODELS ACCORDION (inside deep view) ─────────────────── */
.ma-wrap{margin-top:8px}
.ma-cat{margin-bottom:6px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.ma-cat-hd{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;background:var(--card);user-select:none;transition:background .15s}
.ma-cat-hd:hover{background:var(--hv)}
.ma-cat-label{font-size:13px;font-weight:600;color:var(--tx);flex:1}

<script>
const DEEP_CONTENT = {
  "blueprint": {
    intro: `O Blueprint de Serviço é a ferramenta mais completa do Design de Serviço — é a "planta arquitetônica" de um serviço. Assim como a planta de um prédio mostra não só a fachada mas toda a fiação elétrica, hidráulica e estrutura que sustenta o que você vê, o blueprint mostra tudo que existe por trás de uma experiência de serviço.

A origem do nome vem das plantas técnicas azuis (blueprints) usadas na engenharia e arquitetura. A diferença é que, em vez de mapear espaços físicos, o Blueprint de Serviço mapeia interações humanas, processos e sistemas — tanto os visíveis para o cliente quanto os invisíveis que sustentam a operação.

Ela responde a uma pergunta que nenhuma outra ferramenta responde completamente: "O que precisa acontecer, em que ordem, por quem e com qual suporte de sistema, para que o cliente viva essa experiência?"`,
    sections: [
      { title: "Por que o Blueprint é diferente do Mapa de Jornada?",
        body: `O Mapa de Jornada mostra a experiência do cliente — o que ele faz, pensa e sente. É poderoso para identificar pontos de atrito emocionais.

O Blueprint vai além: ele mostra o que precisa acontecer POR BAIXO para que a jornada do cliente aconteça. É a diferença entre assistir a uma peça de teatro (jornada) e ver o roteiro + os bastidores + a estrutura do teatro inteira (blueprint).

Quando um cliente reclama, o gestor que só tem o mapa de jornada sabe ONDE o problema aconteceu. O gestor que tem o blueprint sabe POR QUÊ — e quase sempre a resposta está nos bastidores ou nos sistemas de suporte, não na linha de frente que o cliente vê.` },
      { title: "As camadas em detalhe",
        body: `1 · EVIDÊNCIAS FÍSICAS
Todos os elementos tangíveis que o cliente percebe — o que ele toca, vê, cheira, ouve. Incluem o ambiente físico, materiais impressos, interfaces digitais, uniformes, embalagens, recibos. São a "prova material" de que o serviço existe e aconteceu.

2 · AÇÕES DO CLIENTE
A sequência exata de ações que o cliente realiza — passo a passo, sem pular etapas. Não é o que o cliente DEVERIA fazer, mas o que ele REALMENTE faz. Isso vem de pesquisa com usuários reais, não de suposições internas.

3 · LINHA DE VISIBILIDADE
Esta não é uma camada — é uma fronteira. Uma linha horizontal que separa o que o cliente VÊ do que ele NÃO VÊ. É o conceito mais poderoso do blueprint. Muitos problemas acontecem porque a organização não percebe o que está (ou não está) cruzando essa linha.

4 · AÇÕES DA LINHA DE FRENTE
O que os funcionários visíveis fazem — aqueles com quem o cliente interage diretamente. O recepcionista, o atendente, o garçom, o médico. Estas ações são coordenadas com as ações do cliente.

5 · AÇÕES DOS BASTIDORES
O que acontece por trás — funcionários que o cliente não vê. O cozinheiro, o técnico de TI, o analista. O cliente não vê, mas sente imediatamente quando falham.

6 · PROCESSOS DE SUPORTE / SISTEMAS
A infraestrutura que sustenta tudo: sistemas de TI, bancos de dados, fornecedores externos, políticas, regulamentações. Os mais invisíveis — e os mais difíceis de mudar. Quando falham, toda a cadeia acima falha junto.` },
      { title: "Como ler um Blueprint: o sentido vertical",
        body: `O Blueprint é lido em dois sentidos:

HORIZONTAL (o tempo): da esquerda para a direita, seguindo a sequência temporal. Cada coluna é um momento — uma etapa da jornada.

VERTICAL (a profundidade): de cima para baixo, seguindo as camadas. Em cada momento, você vê o que está acontecendo em TODAS as camadas simultaneamente.

Este sentido vertical é o que torna o blueprint único. Em uma única coluna, você vê: o que o cliente experiencia, o que o funcionário visível faz, o que o bastidor processa e qual sistema é acionado — tudo no mesmo momento.

É aqui que você descobre por que um problema acontece. Se o cliente está tendo uma experiência ruim, você olha verticalmente para aquela coluna: o que está falhando? Na linha de frente? Nos bastidores? No sistema de suporte?` },
      { title: "Quando usar o Blueprint",
        body: `→ Quando um problema persiste mesmo após treinamentos — a causa raiz quase sempre está nos bastidores.

→ Para redesenhar um serviço de forma sistêmica — não só "melhorar o app" ou "treinar o atendente".

→ Para lançar um serviço novo — mapear com antecedência o que precisa existir em cada camada.

→ Para alinhar equipes multidisciplinares — o blueprint é uma linguagem comum entre TI, operações, RH, atendimento e design.

→ Para identificar pontos únicos de falha — lugares onde uma única pessoa ou sistema concentra responsabilidade crítica.

→ Para calcular o custo real de uma experiência — cada camada tem custos. Tornando-os visíveis, é possível encontrar onde reduzir sem prejudicar a experiência.` },
      { title: "Quando NÃO usar o Blueprint",
        body: `→ Quando você ainda está descobrindo o problema — use pesquisa, entrevistas e mapa de empatia antes. O blueprint vem depois.

→ Quando você precisa entender as emoções do cliente — use o Mapa de Jornada. O blueprint é operacional, não emocional.

→ Quando o serviço é muito simples — para processos de 2 ou 3 etapas, um fluxograma resolve.

→ Quando você não tem acesso aos bastidores — o blueprint feito só com informações da linha de frente é incompleto e pode gerar conclusões erradas.` },
      { title: "Erros mais comuns",
        body: `ERRO 1 — Fazer em sala de reunião sem pesquisa de campo
O blueprint "imaginado" descreve como o serviço DEVERIA funcionar, não como REALMENTE funciona. As gambiarras e soluções informais não aparecem. Solução: realize shadowing e entrevistas antes.

ERRO 2 — Confundir com o Mapa de Jornada
Colocar emoções e sentimentos no blueprint é erro comum. O blueprint é operacional — foca em AÇÕES, não em sentimentos.

ERRO 3 — Ser genérico demais
Um blueprint que cobre "todos os clientes" não serve para nada. Sempre defina: qual persona? Qual cenário? Qual jornada específica?

ERRO 4 — Não incluir as evidências físicas
Muitas equipes pulam a primeira camada. As evidências físicas são onde oportunidades de design muitas vezes se escondem.

ERRO 5 — Tratar como documento final
O blueprint é um documento vivo. O serviço muda, os sistemas mudam. Um blueprint de 2 anos pode ser mais prejudicial que nenhum — cria falsa sensação de que o serviço foi mapeado.` },
      { title: "Variações do Blueprint",
        body: `BLUEPRINT AS-IS (situação atual)
Mapeia como o serviço funciona HOJE — com todos os problemas e ineficiências. Ponto de partida para qualquer redesenho. Seja honesto: não mapeie como deveria ser.

BLUEPRINT TO-BE (situação futura)
Mapeia como o serviço DEVERIA funcionar após o redesenho. Norte do projeto. Deve ser validado com usuários antes de implementar.

BLUEPRINT DE FALHA
Foca em pontos onde o serviço pode falhar e como deve se comportar quando falha. Inclui cenários de exceção e planos de contingência.

BLUEPRINT SIMPLIFICADO
Versão reduzida para stakeholders não técnicos. Geralmente 3 camadas: Cliente, Linha de Frente, Sistemas. Usado para comunicar — não para operar.

BLUEPRINT DIGITAL
Para produtos e serviços digitais, onde a "linha de frente" é uma interface e os "bastidores" são APIs e microsserviços.` }
    ]
  }  ,"design-thinking": {
    intro: `O Design Thinking é uma abordagem de inovação que coloca o ser humano no centro de todo o processo criativo. Não é uma metodologia rígida — é uma forma de pensar e resolver problemas que combina empatia, criatividade e racionalidade.

Desenvolvida na d.school de Stanford e popularizada pela consultoria IDEO, a abordagem partiu de uma observação simples: os melhores designers não apenas resolvem problemas técnicos — eles entendem profundamente as pessoas para as quais estão projetando.

O nome pode ser enganoso. "Design Thinking" não é sobre design no sentido estético — é sobre o modo de pensar dos designers aplicado a qualquer tipo de problema: organizacional, social, tecnológico ou de serviço.`,
    sections: [
      { title: "As 5 fases e como elas realmente funcionam",
        body: `EMPATIZAR
A fase mais subestimada. Não se trata de "imaginar como o usuário se sente" — trata-se de ir a campo, observar, entrevistar e vivenciar a realidade de quem você está projetando. A empatia no Design Thinking é ativa, não passiva. Você não pergunta o que as pessoas querem — você observa o que elas fazem, escuta o que elas dizem e sente o que elas sentem.

Ferramentas desta fase: entrevistas em profundidade, shadowing, diário do usuário, observação participante.

DEFINIR
Com os dados de campo em mãos, você sintetiza os aprendizados em um "ponto de vista" — uma declaração clara do problema real a ser resolvido. Esta é uma das fases mais difíceis porque exige escolher: entre todos os problemas identificados, qual é o mais importante, o mais urgente, o que — se resolvido — geraria maior impacto?

A declaração de ponto de vista tem o formato: "[Persona] precisa de [necessidade] porque [insight]."

IDEAR
A fase que a maioria das pessoas conhece — e a que é mais mal executada. Ideação não é uma reunião onde o chefe fala e os outros concordam. É um processo estruturado para gerar MUITAS ideias em pouco tempo, sem julgamento, sem hierarquia, sem "mas isso não vai funcionar...".

A regra central: quantidade antes de qualidade. O Crazy 8's, o brainstorming e o "Como nós poderíamos..." são ferramentas desta fase.

PROTOTIPAR
Tornar as ideias físicas e testáveis antes de investir em desenvolvimento completo. Um protótipo no Design Thinking pode ser um papel dobrado, uma encenação, uma maquete de papelão, um wireframe em 10 minutos. O objetivo não é impressionar — é aprender.

"Um protótipo que não falha não está sendo testado — está sendo exibido."

TESTAR
Levar o protótipo para usuários reais e observar. Não perguntar "você gostou?" — observar onde confundem, onde hesitam, onde sorriem. O teste gera aprendizados que alimentam a próxima iteração. O processo raramente é linear — você testou, aprendeu, voltou para a fase de definição ou ideação com novos dados.` },
      { title: "Design Thinking vs. Outros processos",
        body: `O Design Thinking se diferencia de processos tradicionais em pontos fundamentais:

PROCESSO TRADICIONAL (Waterfall)
→ Linear: levantamento de requisitos → design → desenvolvimento → lançamento
→ O usuário é consultado no início e vê o resultado no final
→ Descobrir que a solução está errada no lançamento é catastrófico
→ Mudanças tardias são caras

DESIGN THINKING
→ Iterativo: cada ciclo gera aprendizado que alimenta o próximo
→ O usuário participa em todas as fases
→ Descobrir que a solução está errada num protótipo de papel é barato
→ Mudanças cedo são o objetivo — não um problema

A diferença central: processos tradicionais otimizam para NÃO errar. Design Thinking otimiza para errar RÁPIDO e BARATO.` },
      { title: "Erros mais comuns",
        body: `ERRO 1 — Pular a fase de empatia
A pressa leva equipes direto para a ideação. "Já sabemos qual é o problema." Quase sempre estão errados. O problema que você imagina raramente é o problema real.

ERRO 2 — Tratar a ideação como reunião normal
Com hierarquia, com julgamento, com "mas o orçamento não permite...". Ideação funciona apenas quando há psicological safety — qualquer ideia pode ser dita sem medo de julgamento.

ERRO 3 — Protótipo de alta fidelidade cedo demais
Investir semanas em um protótipo elaborado antes de validar o conceito. Protótipos iniciais devem ser descartáveis — se você está com dó de jogar fora, está polido demais.

ERRO 4 — Testar com as pessoas erradas
Testar o protótipo com colegas de trabalho, amigos ou gestores. O teste deve ser com usuários reais que representam o público-alvo.

ERRO 5 — Não iterar
Fazer um ciclo, considerar o processo concluído, seguir para implementação. Design Thinking é iterativo por natureza — cada teste gera aprendizados para o próximo ciclo.` },
      { title: "Quando usar e quando não usar",
        body: `QUANDO USAR
→ Quando o problema não está bem definido
→ Quando soluções óbvias já foram tentadas e falharam
→ Quando o usuário final é diferente de quem toma as decisões
→ Para inovação de produto, serviço ou processo
→ Para resolver problemas complexos que envolvem comportamento humano

QUANDO NÃO USAR
→ Para problemas técnicos com solução conhecida (use engenharia)
→ Quando o prazo não permite pelo menos 2 ciclos de pesquisa + teste
→ Quando a decisão já foi tomada e o processo seria decorativo
→ Para problemas com apenas uma solução possível (regulatórios, por exemplo)` }
    ,{ title: "📌 EXEMPLO 1 — IDEO: Carrinho de supermercado",
        body: `A ABC News desafiou a IDEO a redesenhar o carrinho de supermercado em uma semana ao vivo para TV.

CONTEXTO
Em 1999, a IDEO recebeu o desafio público de redesenhar o carrinho de supermercado em 5 dias. O objetivo não era só criar um carrinho melhor — era demonstrar o processo de Design Thinking em ação, ao vivo, para milhões de espectadores.

PROBLEMA IDENTIFICADO
O carrinho acumulava décadas sem mudanças significativas. Crianças se machucavam nas estruturas metálicas. Funcionários sofriam com ergonomia ruim ao empurrar dezenas de unidades. Produtos eram danificados. Furtos eram facilitados pelo design do cesto único.

PROCESSO
Dia 1 — Empatia: A equipe saiu para campo. Visitaram supermercados, observaram compradores com filhos, entrevistaram funcionários, estudaram o comportamento real de uso — não o comportamento declarado.

Descobertas-chave: pais tentavam manter filhos por perto o tempo todo; funcionários empurravam 20 a 30 carrinhos ao mesmo tempo nos corredores; compradores perdiam itens no fundo do cesto; o design atual tornava o furto fácil.

Dias 2 e 3 — Definição e Ideação: Com os insights, geraram centenas de ideias sem julgamento. Organizaram em grupos temáticos. Construíram protótipos com sucata, papelão e fita adesiva em horas.

Dia 4 — Prototipagem e Teste: Testaram os protótipos dentro de supermercados reais, com usuários reais, observando o comportamento ao usar.

Dia 5 — Entrega: Apresentaram o conceito final ao vivo na TV.

SOLUÇÃO DESENVOLVIDA
Cestas modulares removíveis que o comprador carrega até o caixa, sem precisar descarregar no fim. Área frontal segura para crianças sentarem. Rodas independentes para maior manobrabilidade. Suporte para bolsa da mãe. Scanner acoplado para registrar itens na hora de colocar no cesto.

RESULTADO
O produto final não foi tão importante quanto o processo demonstrado. A IDEO mostrou que Design Thinking é replicável: Empatia, Definição, Ideação, Prototipagem, Teste. O caso tornou-se estudo obrigatório em Stanford, Harvard e escolas de design do mundo inteiro.

APLICAÇÃO PARA A CTIC/UEMA
Quando a equipe for redesenhar um processo da universidade — abertura de chamado, solicitação de documentos, matrícula — a primeira pergunta não é qual sistema usar. É: o que os usuários realmente fazem, sentem e precisam? Sair para campo antes de propor qualquer solução.` },
      { title: "📌 EXEMPLO 2 — Bank of America: Keep the Change",
        body: `Uma observação simples de comportamento cotidiano virou um produto bancário que atraiu 12 milhões de clientes em 2 anos.

CONTEXTO
O Bank of America precisava atrair novos correntistas e aumentar o uso de contas poupança. Contratou a IDEO para entender como as pessoas realmente lidam com dinheiro no dia a dia — não como elas dizem que lidam.

PROBLEMA IDENTIFICADO
A maioria dos americanos não poupava regularmente. Os produtos de poupança existentes exigiam disciplina e planejamento consciente. As pessoas diziam que queriam poupar, mas na prática não poupavam.

PROCESSO
A equipe de pesquisa observou um comportamento que ninguém havia formalizado: muitas pessoas — especialmente mães de família — arredondavam mentalmente o valor das compras para facilitar o controle do orçamento. Gastavam R$27,43 e registravam mentalmente como "uns 30 reais".

Esse comportamento revelou uma verdade: as pessoas já criavam uma folga financeira mental, mas esse dinheiro não ia para lugar nenhum.

A pergunta de Design Thinking que transformou tudo: "E se o banco fizesse esse arredondamento automaticamente e guardasse o troco na poupança?"

SOLUÇÃO DESENVOLVIDA
Keep the Change: a cada compra feita com cartão de débito, o valor é arredondado para o dólar seguinte e a diferença vai automaticamente para a poupança. Sem disciplina. Sem planejamento. Sem ação do usuário.

RESULTADO
Em dois anos: 2,5 milhões de novas contas correntes abertas, 700 mil novas contas poupança criadas, 12 milhões de clientes participando do programa. O produto não surgiu de uma reunião de estratégia — surgiu de observar pessoas reais no dia a dia.

APLICAÇÃO PARA A CTIC/UEMA
Em vez de criar um novo sistema de lembretes de matrícula que os alunos precisam aprender a usar, vale observar: quando e como os alunos naturalmente buscam essa informação hoje? O que eles já fazem que a universidade poderia amplificar? A solução mais eficiente frequentemente está no comportamento que já existe.` },
      { title: "📌 EXEMPLO 3 — Kaiser Permanente: Handoff de enfermagem",
        body: `O Design Thinking revelou que o problema crítico de segurança não era tecnológico — era humano e contextual.

CONTEXTO
A Kaiser Permanente, uma das maiores redes de saúde dos EUA, identificou que a troca de turno dos enfermeiros — o handoff — era um momento crítico de risco para os pacientes. Informações se perdiam, contexto sumia, erros aconteciam.

PROBLEMA IDENTIFICADO
O processo oficial de handoff era realizado em uma sala separada, com enfermeiros lendo anotações enquanto os pacientes ficavam sem supervisão por 30 a 45 minutos. A solução óbvia seria "melhorar o sistema de registro eletrônico". Mas era isso o problema real?

PROCESSO
A equipe de Design Thinking passou dias em campo observando enfermeiros antes de propor qualquer solução. A descoberta foi contraintuitiva: o verdadeiro problema não era a quantidade de informação registrada, nem a tecnologia usada.

Era a ausência de contexto humano: o tom de voz que indica preocupação, a expressão do paciente ao reclamar de dor, o detalhe pequeno que não está em nenhum formulário mas que o enfermeiro que esteve ali sabe. Essas informações se perdiam completamente no handoff em sala separada.

Com esse insight, o processo foi redesenhado em colaboração com os próprios enfermeiros — que conheciam os problemas em detalhes mas nunca tinham sido perguntados.

SOLUÇÃO DESENVOLVIDA
Handoff à beira do leito: a troca de informações passou a acontecer ao lado do paciente, com o paciente presente e participando quando possível. O enfermeiro que termina o turno apresenta o colega ao paciente, revisam o estado juntos, o paciente pode corrigir ou complementar informações.

RESULTADO
Redução significativa de erros de medicação e informação entre turnos. Aumento da satisfação dos pacientes, que passaram a se sentir mais seguros e informados. O caso tornou-se referência internacional de como DT redesenha processos operacionais em ambientes altamente regulados.

APLICAÇÃO PARA A CTIC/UEMA
Quando um chamado técnico "não se resolve" e fica circulando entre equipes, provavelmente existe um problema de handoff: informação que se perde na transição, contexto que nunca foi capturado, responsabilidade que ninguém assumiu. Observar o processo inteiro — não apenas o ticket aberto — revela onde está a real falha.` },
      { title: "📌 EXEMPLO 4 — Apple: iPod",
        body: `O iPod não foi inventado a partir da tecnologia disponível. Foi inventado a partir da experiência que o usuário desejava ter.

CONTEXTO
Em 2001, tocadores de MP3 já existiam no mercado. Vários fabricantes ofereciam produtos com grandes capacidades de armazenamento e especificações técnicas impressionantes. Nenhum deles dominava o mercado ou havia criado uma relação emocional com os usuários.

PROBLEMA IDENTIFICADO
Os tocadores existentes eram projetados por engenheiros para engenheiros: menus hierárquicos complicados, interfaces que exigiam consultar o manual, nenhuma integração com a forma como as pessoas realmente descobriam, compravam e organizavam música.

A pergunta não respondida pelo mercado: o que o usuário quer de verdade quando ouve música?

PROCESSO
Steve Jobs e a equipe da Apple partiram da experiência desejada, não da especificação técnica. A resposta identificada era simples e poderosa: "1000 músicas no bolso", acessadas de forma imediata, sem fricção, sem pensar.

Tudo que não contribuía para essa experiência foi eliminado. Tudo que criava fricção foi removido. O design foi construído de trás para frente — da experiência para a tecnologia, não da tecnologia para a experiência.

SOLUÇÃO DESENVOLVIDA
iPod + iTunes + loja online integrados em um ecossistema completo. O scroll wheel tornou a navegação em centenas de músicas intuitiva sem nenhum menu complexo. A integração com iTunes eliminou a fricção de organizar e transferir músicas. A loja online integrada eliminou a fricção de encontrar e comprar.

RESULTADO
O iPod não apenas dominou o mercado de tocadores — redefiniu a indústria da música. Foi o produto que demonstrou o modelo de negócio que depois se tornaria o iPhone e a App Store. A vantagem competitiva não estava na tecnologia — estava na compreensão profunda da experiência desejada.

APLICAÇÃO PARA A CTIC/UEMA
Antes de especificar qualquer sistema novo, a pergunta certa é: qual é a experiência que o usuário quer ter? Um sistema de chamados ideal não é aquele com mais funcionalidades — é aquele que resolve o problema do servidor sem que ele precise entender como o sistema funciona.`}
    ]

  "service-design": {
    intro: `O Design de Serviço é uma abordagem metodológica para projetar e melhorar serviços colocando as pessoas — clientes E funcionários — no centro do processo. Diferente do design tradicional que foca em produtos físicos ou interfaces visuais, o Design de Serviço projeta experiências completas: tudo que acontece antes, durante e depois de uma interação de serviço.

O campo nasceu formalmente em 1982, quando G. Lynn Shostack publicou no Harvard Business Review um artigo revolucionário chamado "How to Design a Service". Shostack, que trabalhava no setor financeiro, percebeu que os serviços não podiam ser projetados da mesma forma que os produtos — eles eram intangíveis, heterogêneos e inseparáveis de quem os produzia.

Hoje o Design de Serviço é praticado por organizações de todos os tamanhos em todos os setores — de bancos digitais a hospitais públicos, de aeroportos a aplicativos de entrega.`,
    sections: [
      { title: "O que torna o DS diferente do UX Design?",
        body: `UX Design (User Experience Design) foca primariamente na interface digital — como o usuário interage com um app, site ou sistema. É uma disciplina essencial, mas tem um escopo limitado: começa e termina na tela.

Design de Serviço tem escopo muito mais amplo. Ele projeta a experiência completa — incluindo:
→ O que acontece ANTES do usuário abrir o app (como ele descobriu o serviço? como chegou até ele?)
→ O que acontece DENTRO do app (onde o UX design atua)
→ O que acontece FORA do app (atendimento humano, entrega física, comunicação posterior)
→ O que acontece NOS BASTIDORES (processos, sistemas, funcionários que nunca aparecem na tela)

Uma analogia útil: UX Design projeta o cardápio e a mesa do restaurante. Design de Serviço projeta o restaurante inteiro — incluindo a cozinha, o sistema de abastecimento, o treinamento dos garçons e a política de reservas.` },
      { title: "Os 6 princípios do Design de Serviço",
        body: `1. CENTRADO NO SER HUMANO
Não apenas no "usuário" — em todos os humanos afetados pelo serviço. Isso inclui os funcionários que entregam o serviço. Um serviço bem projetado para o cliente mas que esgota os funcionários não é sustentável.

2. COLABORATIVO
Stakeholders de diferentes origens, habilidades e perspectivas devem ser ativamente envolvidos no processo. Não é criar para o usuário — é criar com o usuário.

3. ITERATIVO
O design de serviço é exploratório, experimental e evolucionário. Prototipe antes de implementar. Falhe pequeno para não falhar grande.

4. SEQUENCIAL
O serviço deve ser visualizado como uma sequência de episódios interligados — com arco dramático intencional. Cada momento influencia o próximo.

5. REAL
Pesquise necessidades reais. Prototipe no mundo real. Meça valor real. Este é o antídoto para o "design de serviço de fachada" — aquele que produz mapas bonitos sem mudar nada no mundo.

6. HOLÍSTICO
Considere o serviço em sua totalidade — contexto social, ambiental, cultural e político incluído. Um serviço bem projetado para a maioria mas que exclui ou prejudica uma minoria não está bem projetado.` },
      { title: "A diferença entre recuperação de serviço e DS",
        body: `RECUPERAÇÃO DE SERVIÇO
É o conjunto de ações tomadas quando algo deu errado — reembolso, compensação, pedido de desculpas. É importante ter políticas de recuperação. Mas é reativo: pressupõe que a falha já ocorreu.

DESIGN DE SERVIÇO
Projeta para que a falha seja evitada. Em vez de treinar atendentes para lidar com reclamações de cancelamento, o DS pergunta: por que os clientes querem cancelar? O que no serviço está gerando essa necessidade?

A analogia perfeita: recuperação de serviço é o bombeiro que apaga o incêndio. Design de Serviço é o engenheiro que projeta o prédio para não pegar fogo.

Ambos são necessários. Mas confundir os dois leva organizações a investirem indefinidamente em apagar incêndios — sem nunca parar para perguntar por que o prédio continua pegando fogo.` },
      { title: "Erros mais comuns",
        body: `ERRO 1 — Confundir DS com estética
Redesenhar o visual do app ou a fachada da loja não é DS. Se o processo for confuso e o sistema travar, a estética bonita não resolve o sofrimento do cliente.

ERRO 2 — Confundir DS com atendimento ao cliente
Atendimento é reativo. DS é proativo. Treinar atendentes para lidar com reclamações não resolve a causa das reclamações.

ERRO 3 — Tratar o artefato como entrega
Um mapa de jornada, um blueprint, um relatório de pesquisa não são entregas. A entrega real é a mudança no mundo — o processo redesenhado, o sistema integrado, a experiência que melhorou.

ERRO 4 — DS sem viabilidade
Uma solução que o cliente ama mas que a empresa não consegue sustentar não é uma boa solução de DS. Criatividade + viabilidade financeira precisam caminhar juntas.

ERRO 5 — Pesquisar sem sair da sala
Pesquisa feita internamente, em reuniões ou por questionários online captura opiniões — não comportamentos. DS real exige ir a campo.` }
    ,{ title: "📌 EXEMPLO 1 — Mayo Clinic: Experiência do paciente",
        body: `A Mayo Clinic, referência mundial em medicina, redesenhou a experiência do paciente como um sistema completo — não como uma sequência de consultas isoladas.

CONTEXTO
Mesmo com excelência clínica reconhecida globalmente, a Mayo Clinic identificou falhas graves na experiência ao redor do atendimento: esperas mal comunicadas, ambientes confusos, informações fragmentadas entre departamentos.

PROBLEMA IDENTIFICADO
O problema não era a qualidade médica — era tudo que acontecia ao redor dela. O paciente chegava com medo, esperava sem nenhuma informação, navegava por corredores confusos e saía sem entender completamente o que havia acontecido com sua saúde.

PROCESSO
Usando o método SPARC (See, Plan, Act, Refine, Communicate), equipes multidisciplinares — médicos, enfermeiros, designers, arquitetos — observaram pacientes e acompanhantes em toda a jornada. Da chegada no estacionamento até a saída do hospital. Mapearam todos os pontos de contato, todos os momentos de ansiedade, todas as oportunidades de melhoria invisíveis para quem trabalha ali todos os dias.

SOLUÇÃO DESENVOLVIDA
Redesenho de ambientes físicos (sinalização clara, salas de espera humanizadas), scripts de comunicação padronizados para as equipes, novos rituais de atendimento como apresentação formal do próximo profissional que vai atender o paciente.

RESULTADO
Aumento significativo nos índices de satisfação do paciente, medidos sistematicamente pela primeira vez. A Mayo Clinic tornou-se referência global não apenas em medicina, mas em design de experiência de saúde.

APLICAÇÃO PARA A CTIC/UEMA
A experiência do estudante na UEMA não começa na sala de aula. Começa no primeiro e-mail que recebe ao ser aprovado, na fila da secretaria, no site da instituição, no atendimento do suporte. Tratar cada ponto de contato como parte de um serviço integrado — e não como responsabilidade de setores separados — é o que transforma uma universidade funcional em uma universidade centrada no estudante.` },
      { title: "📌 EXEMPLO 2 — Nubank: Cancelamento que fideliza",
        body: `Tornar o cancelamento simples foi um ato de design de serviço que reforçou a confiança no Nubank mais do que qualquer campanha de retenção ou benefício financeiro.

CONTEXTO
No setor bancário tradicional, cancelar uma conta é propositalmente difícil: ligações longas, esperas de 20 a 40 minutos, transferências entre atendentes, tentativas de retenção agressivas, ofertas de última hora. O modelo dominante assume que dificultar a saída mantém clientes.

PROBLEMA IDENTIFICADO
O Nubank questionou essa lógica: e se a facilidade de sair fosse, paradoxalmente, um argumento poderoso para ficar?

PROCESSO
A equipe de design mapeou toda a jornada de cancelamento nos bancos tradicionais — cada atrito, cada momento de frustração, cada ponto onde o usuário se sentia preso e manipulado. Depois fez a pergunta de design de serviço fundamental: o que acontece se removermos todos esses atritos?

SOLUÇÃO DESENVOLVIDA
Cancelamento em 3 toques dentro do aplicativo. Sem ligações. Sem espera. Sem argumentação forçada. Sem tentativas de retenção. O usuário pode cancelar em segundos e reativar quando quiser, com a mesma facilidade.

RESULTADO
Paradoxalmente, facilitar a saída reduziu o churn. Usuários que sabem que podem sair com facilidade se sentem menos pressionados e desenvolvem mais confiança na instituição — e tendem a ficar. O Nubank tornou-se referência de transparência e confiança no setor financeiro.

APLICAÇÃO PARA A CTIC/UEMA
Processos de trancamento de matrícula, cancelamento de bolsas, solicitação de transferência e jubilamento são momentos onde a instituição frequentemente cria atrito desnecessário — seja por burocracia ou por tentativa de "reter" o estudante. Simplificar esses momentos não significa perder controle: significa respeitar o estudante e construir confiança institucional.` },
      { title: "📌 EXEMPLO 3 — KLM: WhatsApp como canal de serviço",
        body: `A KLM não criou um novo canal para os passageiros aprenderem. Foi onde os passageiros já estavam.

CONTEXTO
A KLM Royal Dutch Airlines buscava reduzir a pressão sobre os call centers e melhorar a experiência do passageiro nos momentos mais críticos da viagem: check-in, alterações de voo, perda de bagagem, informações de embarque.

PROBLEMA IDENTIFICADO
Os passageiros precisavam alternar entre o app da companhia, o site, o telefone e o balcão para resolver problemas diferentes. Cada canal tinha uma interface diferente, um histórico separado e uma experiência completamente fragmentada.

PROCESSO
A equipe mapeou os momentos da jornada em que o passageiro mais precisava de informação e mais se sentia ansioso. Identificaram que o WhatsApp já era o canal principal de comunicação da maioria dos passageiros europeus — usado para tudo, o tempo todo. A lógica de design de serviço foi simples e poderosa: ir onde o usuário está, não criar um novo lugar para ele ir.

SOLUÇÃO DESENVOLVIDA
Integração completa do WhatsApp para: envio automático da confirmação de reserva, cartão de embarque digital, notificações proativas de voo, respostas a perguntas frequentes e resolução de problemas — tudo no mesmo canal, com histórico completo.

RESULTADO
Redução significativa de volume nos call centers. Aumento de satisfação do passageiro. O diferencial: o passageiro recebe informações proativamente, sem precisar buscar.

APLICAÇÃO PARA A CTIC/UEMA
Em vez de criar um portal de atendimento novo que os estudantes precisarão aprender a usar, a pergunta de design de serviço é: qual canal eles já usam? Integrar comunicações de matrícula, documentos e suporte ao WhatsApp institucional ou ao e-mail que os estudantes já abrem pode ter impacto imediato — sem curva de aprendizado.`}
    ]

  "duplo-diamante": {
    intro: `O Duplo Diamante é um framework visual desenvolvido pelo Design Council do Reino Unido em 2005 para descrever o processo de design de forma clara e comunicável. Ele ficou famoso porque resolve um problema antigo: como explicar para não-designers por que o processo criativo parece "confuso" e "demorado".

A resposta do Duplo Diamante é elegante: o processo não é confuso — ele tem uma lógica precisa de expansão e contração. Você expande para explorar possibilidades (diverge), depois contrai para focar no que importa (converge). E faz isso duas vezes: uma para encontrar o problema certo, outra para encontrar a solução certa.

O nome vem da forma visual: dois losangos (diamantes) lado a lado, cada um representando um ciclo de expansão e contração.`,
    sections: [
      { title: "Os 4 momentos em detalhe",
        body: `DESCOBRIR (primeiro diamante — expansão)
Explore o problema amplamente. Não assuma que você já sabe qual é o problema. Saia a campo. Converse com usuários, observe comportamentos, leia pesquisas, visite concorrentes. O objetivo é coletar o máximo de informação possível sobre o contexto — sem filtrar nem julgar ainda.

Ferramentas: entrevistas, shadowing, desk research, mapa de stakeholders, benchmarking.

DEFINIR (primeiro diamante — contração)
Com tudo que você descobriu, agora é hora de focar. Sintetize os dados, identifique padrões, priorize. Qual é o problema REAL? Qual insight dos dados de campo mudou sua perspectiva inicial? A definição correta do problema é a decisão mais importante do processo.

Ferramentas: personas, mapas de empatia, "Como nós poderíamos?", declaração de ponto de vista.

DESENVOLVER (segundo diamante — expansão)
Agora que você tem o problema certo definido, explore soluções. Gere muitas ideias — boas, ruins, selvagens, óbvias. Prototipe as mais promissoras. Teste. Aprenda. Descarte o que não funciona.

Ferramentas: brainstorming, Crazy 8's, protótipos em papel, desktop walkthrough, role play.

ENTREGAR (segundo diamante — contração)
Refine as soluções que sobreviveram ao teste. Implemente em escala. Meça os resultados. Itere com base nos dados reais de uso.

Ferramentas: protótipo de alta fidelidade, piloto, MVP, métricas de impacto.` },
      { title: "Por que dois diamantes e não um?",
        body: `Esta é a pergunta mais frequente — e a resposta revela o insight central do framework.

Muitas organizações "pulam" o primeiro diamante. Chegam com um problema já definido (muitas vezes definido pela liderança sem pesquisa) e vão direto para o segundo diamante — desenvolver e entregar soluções.

O resultado: soluções brilhantes para o problema errado.

O primeiro diamante existe para questionar o problema apresentado. É comum que, após a fase de Descoberta, o problema que a equipe vai resolver seja completamente diferente do problema inicial que foi apresentado.

Exemplo clássico: uma organização pede "melhore a interface do nosso sistema de tickets". Após o primeiro diamante (descoberta + definição), a equipe descobre que o problema real é que os usuários não sabem que o sistema existe — não que a interface seja ruim. A solução certa é comunicação e onboarding, não redesenho de interface.` },
      { title: "Versões atualizadas do Duplo Diamante",
        body: `O Design Council atualizou o framework em 2019, adicionando três novos elementos:

PRINCÍPIOS DE DESIGN
Valores que guiam todas as decisões do processo (ex: "simplicidade acima de tudo", "acessível para todos", "transparência radical").

MÉTODOS
Reconhecimento explícito de que cada fase usa métodos específicos — não é só "fazer pesquisa" ou "ter ideias".

MENTALIDADE
Destaque para as disposições necessárias em cada fase: curiosidade na Descoberta, julgamento na Definição, criatividade no Desenvolvimento, praticidade na Entrega.

O framework atualizado também reconhece que o processo raramente é linear — você pode voltar ao primeiro diamante depois de prototipar se descobrir que estava resolvendo o problema errado.` },
      { title: "Quando usar e limitações",
        body: `QUANDO É MAIS ÚTIL
→ Para apresentar o processo de design para stakeholders não-designers
→ Para estruturar projetos de inovação com equipes multidisciplinares
→ Como guia de planejamento de sprint e alocação de recursos
→ Para diagnosticar onde um projeto travou (em qual fase?)

LIMITAÇÕES
→ É uma simplificação — o processo real é mais recursivo e menos linear
→ Não especifica como executar cada fase — é um mapa, não um manual
→ Pode criar falsa sensação de que seguir as fases garante boa solução
→ Não captura a dimensão política e organizacional do processo de design (quem decide o que é o "problema certo"?)` }
    ,{ title: "📌 EXEMPLO 1 — NHS: Comunicação médico-paciente",
        body: `O NHS descobriu que o problema de comunicação não era falta de tecnologia. Era linguagem, tempo e contexto humano.

CONTEXTO
O National Health Service britânico identificou reclamações recorrentes sobre comunicação entre médicos e pacientes. A solução imediata proposta internamente seria "criar um app de mensagens" ou "melhorar o prontuário eletrônico".

PROBLEMA IDENTIFICADO
Pacientes relatavam não entender as instruções médicas após as consultas, não lembrar do que foi dito e sentir que o médico não tinha tempo para explicar. A pergunta inicial parecia clara: como melhoramos a comunicação?

PROCESSO — OS DOIS DIAMANTES
Diamante 1 — Descobrir e Definir o problema real:
A equipe passou pela fase de Discover sem assumir qual era o problema real. Entrevistas profundas com pacientes revelaram algo contraintuitivo: o problema não era tecnológico. Médicos usavam linguagem técnica, tinham em média 8 minutos por consulta e pacientes chegavam com ansiedade alta — uma combinação que tornava qualquer informação difícil de absorver e reter.

A fase Define revelou o problema correto: o paciente precisa de informação no momento certo, no formato certo, com a linguagem certa. Não de mais tecnologia.

Diamante 2 — Desenvolver e Entregar a solução:
Com o problema corretamente definido, o foco saiu de "qual sistema construir" para "como mudar o processo de comunicação". Foram desenvolvidos e testados vários formatos de resumo e follow-up com pacientes reais.

SOLUÇÃO DESENVOLVIDA
Redesenho do processo de consulta: resumos escritos em linguagem simples entregues ao paciente no final de cada consulta; vocabulário padronizado para condições comuns; follow-up por telefone para pacientes de alto risco nas 48 horas após a consulta.

RESULTADO
Redução de reinternações evitáveis e aumento de adesão ao tratamento. O caso demonstrou o princípio fundamental do Duplo Diamante: digitalizar ou tecnologizar um processo mal definido não o melhora — é preciso entender o problema correto antes de propor qualquer solução.

APLICAÇÃO PARA A CTIC/UEMA
Quando um sistema de matrícula ou de chamados recebe muitas reclamações, a solução não é necessariamente trocar o sistema. Pode ser que o processo por trás do sistema seja complexo demais, que a comunicação com o usuário aconteça no momento errado, ou que a linguagem usada seja incompreensível. O Duplo Diamante força a organização a definir o problema correto antes de gastar recursos construindo a solução.` },
      { title: "📌 EXEMPLO 2 — Governo do Reino Unido: Renovação de passaporte",
        body: `O Government Digital Service simplificou um processo burocrático complexo antes de digitalizá-lo — e criou uma referência mundial de serviço público digital.

CONTEXTO
O GDS (Government Digital Service) do Reino Unido recebeu a missão de digitalizar serviços públicos. A renovação de passaporte era um dos processos mais complexos: formulários longos, documentação confusa, múltiplos departamentos envolvidos, alto índice de erros.

PROBLEMA IDENTIFICADO
A tentação natural — e o caminho que a maioria dos governos escolhe — era digitalizar o formulário existente: colocar o mesmo processo burocrático em um site. O Duplo Diamante levou a equipe a questionar o processo antes de qualquer decisão técnica.

PROCESSO — OS DOIS DIAMANTES
Diamante 1:
Discover: a equipe mapeou toda a jornada do cidadão — desde o momento em que descobria que o passaporte estava vencendo até receber o novo documento. Foram identificados 37 pontos de fricção distintos.

Define: 60% dos problemas não vinham do formulário em si — vinham de documentação incorreta ou incompleta enviada pelos cidadãos. O problema real era a falta de validação antecipada e orientação clara.

Diamante 2:
Develop: gerou múltiplos protótipos de fluxos alternativos, testados com cidadãos reais em estágios iniciais.
Deliver: implementação iterativa com melhorias contínuas baseadas em dados reais de uso.

SOLUÇÃO DESENVOLVIDA
Processo reduzido de 37 para 9 etapas. Validação de documentos antecipada no fluxo. Linguagem simples em todo o processo. Design responsivo para celular. Sem necessidade de criar conta para realizar a renovação.

RESULTADO
90% dos usuários conseguem completar o processo sem nenhuma ajuda. Tempo médio de 25 minutos para um processo que antes levava horas e múltiplas visitas presenciais. Tornou-se referência global de serviço público digital.

APLICAÇÃO PARA A CTIC/UEMA
Antes de desenvolver ou contratar qualquer sistema para digitalizar um processo universitário — solicitação de documentos, abertura de chamados, matrícula — vale aplicar o primeiro diamante: mapear a jornada atual, identificar todos os pontos de fricção e definir o problema correto. Simplificar o processo antes de digitalizá-lo pode reduzir o custo de desenvolvimento pela metade e triplicar a taxa de adoção.` },
      { title: "📌 EXEMPLO 3 — Mobilidade urbana: O problema do app era físico",
        body: `O que parecia ser um problema de interface digital era na verdade um problema físico e emocional. O Duplo Diamante revelou onde estava o problema real.

CONTEXTO
Uma empresa de mobilidade urbana recebia reclamações consistentes sobre o aplicativo de transporte. Usuários diziam que "o app era ruim", "não funcionava direito", "era difícil de usar". A equipe de produto começou a planejar um redesign completo da interface.

PROBLEMA IDENTIFICADO
Antes de redesenhar o app, uma equipe de UX Research decidiu investigar: quando as pessoas dizem que "o app é ruim", o que está realmente acontecendo?

PROCESSO — OS DOIS DIAMANTES
Diamante 1:
Discover: pesquisa de campo acompanhou usuários nos momentos reais de uso do aplicativo — não em laboratório, não por questionário, mas na rua, com o usuário usando o app no contexto real.

A descoberta foi contraintuitiva: a maioria das frustrações não acontecia na tela. Acontecia enquanto o usuário esperava no ponto de parada. O app era o único "aliado" disponível naquele momento — e quando falhava ou demorava para atualizar, toda a experiência de espera em local potencialmente inseguro entrava em colapso emocional.

Define: o problema real não era a interface do app. Era o medo e a insegurança durante a espera, especialmente à noite, em pontos de parada mal iluminados e sem informação física.

Diamante 2:
Develop e Deliver: soluções foram desenvolvidas tanto para o app quanto para o ambiente físico.

SOLUÇÃO DESENVOLVIDA
Além de melhorias de performance no app, a empresa investiu em: pontos de parada com iluminação melhorada, totens informativos com previsão de chegada, parcerias com estabelecimentos próximos para criar "pontos seguros" de espera, e uma funcionalidade de "modo noturno" no app com informações específicas de segurança.

RESULTADO
A satisfação com o serviço aumentou significativamente — não porque a interface do app melhorou, mas porque a experiência física foi redesenhada em conjunto com o digital.

APLICAÇÃO PARA A CTIC/UEMA
Na CTIC/UEMA, quando um sistema recebe reclamações, a raiz do problema nem sempre está no sistema. Pode estar no processo antes do sistema, no ambiente físico onde é usado, ou na falta de suporte humano quando o sistema falha. O Duplo Diamante força a investigação antes da solução.`}

  "agile-scrum": {
    intro: `O Agile e o Scrum são mais do que metodologias de gestão de projetos de software. São uma filosofia de trabalho baseada em três princípios fundamentais que contradizem a maioria dos processos tradicionais de desenvolvimento: entregar valor cedo e com frequência, aprender com feedback real em vez de planejar tudo com antecedência, e adaptar continuamente com base no que foi aprendido.

O Scrum organiza o trabalho em Sprints — ciclos curtos de 1 a 4 semanas onde a equipe seleciona itens do backlog, executa, revisa com stakeholders e adapta o planejamento. No final de cada Sprint existe algo funcionando e entregue — não uma promessa de entrega futura.

Para designers e pesquisadores de UX, o Agile é o ambiente de trabalho mais comum em times de tecnologia. Entender seus rituais, papéis e artefatos é indispensável para atuar com eficiência.`,
    sections: [
      { title: "Os papéis do Scrum",
        body: `PRODUCT OWNER (PO)
Responsável por maximizar o valor do produto. Define e prioriza o backlog — a lista de tudo que precisa ser feito. Representa os interesses dos stakeholders e dos usuários. Não é gerente de projeto: é guardião da visão do produto e das prioridades.

SCRUM MASTER
Facilita o processo Scrum, remove impedimentos que bloqueiam a equipe e protege o time de interrupções externas. Não é um chefe — é um servo-líder que garante que o processo funcione.

EQUIPE DE DESENVOLVIMENTO
Time multidisciplinar e autogerenciado responsável por entregar o incremento de produto a cada Sprint. Em times modernos, inclui designers e pesquisadores de UX além de engenheiros.

O PAPEL DO DESIGNER NO SCRUM
O maior desafio do designer em times Scrum é o tempo de pesquisa: pesquisar leva tempo, Sprints são curtos. A solução mais comum é o "dual-track Agile": enquanto a equipe de desenvolvimento implementa o que foi definido, o designer pesquisa e define o que virá nas próximas Sprints — mantendo um backlog de descobertas sempre à frente do backlog de desenvolvimento.` },
      { title: "Os rituais do Scrum",
        body: `SPRINT PLANNING
No início de cada Sprint, o time seleciona os itens do backlog que serão trabalhados e define como serão executados. O resultado é o Sprint Backlog — o compromisso do time para aquele ciclo.

DAILY SCRUM (DAILY)
Reunião diária de 15 minutos. Cada membro responde: o que fiz ontem, o que farei hoje, e o que está me impedindo. O objetivo não é status report para o gestor — é sincronização entre os membros do time.

SPRINT REVIEW
No final do Sprint, o time apresenta o que foi construído para os stakeholders. É o momento de feedback real com quem importa — não uma aprovação formal, mas uma conversa sobre o que foi aprendido e o que vem a seguir.

SPRINT RETROSPECTIVE
Também no final do Sprint, o time reflete sobre o processo: o que funcionou bem, o que precisa melhorar, e quais ações concretas farão o próximo Sprint melhor. É o mecanismo de melhoria contínua do próprio time.` },
      { title: "📌 EXEMPLO 1 — Detran-SP: Digitalização incremental",
        body: `Em vez de substituir tudo de uma vez em um projeto de 2 anos, o Detran-SP usou ciclos curtos para reduzir risco, aprender continuamente e entregar valor real a cada Sprint.

CONTEXTO
O Detran-SP tinha dezenas de serviços presenciais que precisavam ser digitalizados. A abordagem tradicional seria contratar um grande projeto de transformação digital, esperar 18 a 24 meses e lançar tudo de uma vez. O risco óbvio: 2 anos de desenvolvimento para descobrir que os cidadãos não usam ou não conseguem usar.

PROBLEMA IDENTIFICADO
Como digitalizar décadas de processos burocráticos sem paralisar o atendimento presencial, sem desperdiçar recursos em soluções que ninguém usa, e sem criar sistemas que replicam a burocracia existente em formato digital?

PROCESSO ÁGIL
A equipe identificou o serviço com maior volume de atendimento presencial e maior insatisfação dos cidadãos: agendamento para serviços de CNH. Criou um backlog priorizado por impacto ao usuário e viabilidade técnica.

Sprint 1 (2 semanas): agendamento online básico, sem login, fluxo mínimo.
Sprint 2: confirmação por SMS e e-mail.
Sprint 3: cancelamento e reagendamento online.
Sprint 4: integração com sistemas internos para reduzir retrabalho dos atendentes.

Cada Sprint terminava com testes com cidadãos reais antes de avançar para o próximo.

RESULTADO
Redução de 40% no volume de atendimento presencial para os serviços digitalizados em apenas 6 meses. Cada Sprint entregou valor real ao cidadão — nenhum foi "preparação interna para entregar no futuro".

APLICAÇÃO PARA A CTIC/UEMA
A digitalização de serviços universitários não precisa ser um projeto de 3 anos. Identifique o serviço com mais demanda e mais fricção, construa a versão mínima em 2 semanas, teste com usuários reais, meça, aprenda e avance. Pequenas entregas reais são mais valiosas que grandes promessas futuras.` },
      { title: "📌 EXEMPLO 2 — Spotify: Squads, Tribes, Chapters e Guilds",
        body: `O Spotify criou um modelo organizacional que permite que centenas de pessoas trabalhem em paralelo sem perder alinhamento — inspirado no Agile, mas radicalmente adaptado à sua escala.

CONTEXTO
À medida que o Spotify crescia de dezenas para centenas de engenheiros, designers e product managers, o Scrum convencional começou a criar gargalos: equipes dependiam de outras equipes para avançar, reuniões de coordenação multiplicavam, e a velocidade de entrega caía progressivamente.

PROBLEMA IDENTIFICADO
Como manter a agilidade e autonomia de uma startup quando você tem centenas de profissionais trabalhando em dezenas de features simultaneamente?

O MODELO SPOTIFY
Squads: equipes pequenas (6 a 12 pessoas) e completamente autônomas, com missão própria, backlog próprio e liberdade para decidir o que construir e como — dentro de uma missão clara definida pela empresa.

Tribes: grupos de Squads relacionados que trabalham na mesma área do produto. A Tribe cria alinhamento entre Squads sem impor dependências.

Chapters: comunidades de prática por especialidade que atravessam os Squads. Todos os designers da empresa, por exemplo, fazem parte do mesmo Chapter — que define padrões, compartilha aprendizados e promove crescimento técnico.

Guilds: grupos de interesse voluntários que atravessam toda a empresa, sem estrutura formal.

RESULTADO
O modelo permitiu que o Spotify escalasse de dezenas para centenas de equipes sem perder a velocidade de entrega. Importante: o próprio Spotify afirma publicamente que o modelo evoluiu constantemente e nunca funcionou exatamente como descrito nos artigos que viralizaram. A lição é o princípio, não o modelo exato.

APLICAÇÃO PARA A CTIC/UEMA
O princípio central — times autônomos com missão clara, sem dependências constantes entre equipes — pode guiar como a CTIC organiza projetos paralelos. Em vez de coordenação central constante, definir missões claras para cada equipe e criar rituais leves de alinhamento.` },
      { title: "📌 EXEMPLO 3 — Amazon: Working Backwards",
        body: `A Amazon começa todo produto pelo press release do lançamento — e só então planeja como construir. Começar pelo "para quem?" e "qual o valor?" antes do "como?".

CONTEXTO
A Amazon desenvolveu internamente uma prática chamada Working Backwards para garantir que produtos e funcionalidades sejam desenvolvidos a partir da necessidade real do cliente — não da capacidade técnica disponível ou dos interesses internos das equipes.

PROBLEMA IDENTIFICADO
Em empresas de tecnologia, é fácil cair na armadilha de construir o que é tecnicamente possível ou o que a equipe já sabe fazer, em vez do que o cliente realmente precisa. Como garantir que todo projeto começa pelo problema correto?

O PROCESSO WORKING BACKWARDS
Antes de qualquer linha de código, qualquer wireframe ou qualquer especificação técnica, a equipe escreve um PR/FAQ completo:

PR (Press Release): um comunicado de imprensa fictício do lançamento do produto, escrito no presente como se o produto já existisse. Descreve claramente: quem é o cliente, qual problema resolve, qual é o benefício principal e por que é melhor que as alternativas existentes.

FAQ: perguntas e respostas frequentes — tanto as perguntas dos clientes quanto as perguntas internas difíceis que a equipe preferiria não responder.

Se a equipe não consegue escrever um press release convincente que explique claramente o valor para o cliente, o produto não deveria ser construído ainda — porque o problema não foi entendido o suficiente.

RESULTADO
Kindle, Alexa, AWS e Amazon Prime foram desenvolvidos usando Working Backwards. A prática garantiu que a pergunta "o cliente vai querer isso e por quê?" seja respondida antes de "como vamos construir?".

APLICAÇÃO PARA A CTIC/UEMA
Antes de especificar um novo sistema ou contratar uma plataforma, tente escrever o anúncio de lançamento: "Apresentamos o novo sistema de chamados da UEMA: agora você resolve seu problema de TI em menos de 4 horas, sem precisar ligar para o suporte ou ir presencialmente até a CTIC." Se você não consegue escrever esse anúncio com clareza e especificidade, o problema ainda não foi definido bem o suficiente para começar a construir.`}
