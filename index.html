      context:`Uma prefeitura havia digitalizado o processo de matrícula escolar. Os pais podiam fazer a pré-matrícula online e recebiam um protocolo de confirmação. O objetivo era modernizar o processo e reduzir filas nas escolas.

Nos primeiros 3 anos do sistema digital, a Secretaria de Educação recebia em média 2.400 reclamações por período de matrícula — sempre a mesma queixa: "Fiz a matrícula online, recebi a confirmação, fui à escola e não tinha vaga."`,
      problem:`Hipótese inicial: o email de confirmação estava confuso — os pais interpretavam "protocolo de pré-matrícula" como "vaga confirmada". Solução proposta: redesenhar o email para deixar mais claro. Esta solução era necessária mas insuficiente.`,
      process:`→ Acompanhamento de 20 famílias durante todo o processo de matrícula (shadowing digital e presencial)
→ Entrevistas com 15 secretárias de escola sobre o fluxo de trabalho diário

→ Análise técnica do fluxo de dados entre o portal online e os sistemas escolares

O Blueprint incluiu explicitamente os sistemas de TI na camada de suporte — algo que a versão anterior (feita internamente pela Secretaria) havia omitido completamente.`,
      solution:`O Blueprint revelou um problema arquitetural: o portal online e o sistema de gestão escolar eram dois sistemas completamente separados, sem integração em tempo real.

O fluxo real (que as famílias não viam):
1. Pai preenche formulário online → sistema gera protocolo IMEDIATAMENTE (sem verificar vagas)
2. Às 23h: arquivo de dados exportado do portal e importado manualmente no sistema escolar
3. No dia seguinte: secretária abre o arquivo, verifica vagas disponíveis, confirma ou não
4. Se não houver vaga: contata a família — às vezes dias depois

No intervalo entre o protocolo (passo 1) e a verificação de vaga (passo 3), outras famílias também recebiam protocolos para a mesma escola. Resultado frequente: 30 famílias com protocolo para 10 vagas disponíveis.

Solução em 2 etapas:
1. Curto prazo (1 semana): email reformulado para dizer explicitamente "Sua PRÉ-matrícula foi recebida. A CONFIRMAÇÃO DE VAGA será enviada em até 48 horas úteis."
2. Médio prazo (6 meses): integração técnica dos sistemas para verificação de vagas em tempo real antes de emitir qualquer protocolo`,
      result:`→ Reclamações apenas com a mudança de comunicação: redução de 89% (de 2.400 para 268)
→ Após a integração técnica: redução de 97%
→ Custo da integração: R$ 85.000
→ Economia estimada em atendimento de reclamações: R$ 280.000/ano`,

    { id:"ex5", title:"CTIC/UEMA — Blueprint Institucional e Carta de Serviços",
      summary:"Blueprint dos serviços de TI da UEMA revelou que 40% das solicitações passavam por processos manuais conhecidos por apenas 1 ou 2 técnicos — pontos únicos de falha institucional.",
      context:`A CTIC (Coordenação de Tecnologia da Informação e Comunicação) da UEMA (Universidade Estadual do Maranhão) é responsável pela infraestrutura tecnológica de uma instituição com múltiplos campi, centenas de sistemas e milhares de usuários entre docentes, técnicos e estudantes.

A coordenação nunca havia documentado formalmente seus serviços — o conhecimento existia "na cabeça" dos técnicos mais antigos. Quando um técnico experiente estava ausente, determinados serviços simplesmente paravam. E os usuários não sabiam como solicitar ajuda ou o que esperar quando solicitavam.`,
      problem:`Não havia um problema único — havia um padrão de problemas: dependência de pessoas específicas, processos informais não documentados, e usuários sem clareza sobre como acessar os serviços de TI da coordenação.`,
      process:`O trabalho durou 3 meses e foi dividido em 2 fases:

FASE 1 — DESCOBERTA (6 semanas):
Shadowing de técnicos por 2 semanas completas — observação do trabalho real, não o descrito nos manuais. Entrevistas com 35 servidores de diferentes departamentos sobre suas necessidades de TI. Análise de 6 meses de tickets de suporte (quando existiam). Mapeamento de "quem faz o quê" — descobrindo conhecimento tácito não documentado.

FASE 2 — BLUEPRINT (6 semanas):
Identificação de 23 serviços principais prestados pela coordenação. Para cada serviço: mapeamento completo das 5 camadas do blueprint. Identificação de pontos únicos de falha. Mapeamento de sistemas de suporte críticos (softwares, licenças, senhas, configurações essenciais).`,
      solution:`O Blueprint revelou 3 categorias de problemas sistêmicos:

1. PROCESSOS MANUAIS NÃO DOCUMENTADOS (40% dos serviços)
Exemplo concreto: a criação de conta institucional de email envolvia 7 etapas, das quais 4 eram executadas manualmente pelo único técnico que sabia a sequência correta. Em suas férias: ninguém conseguia criar contas.
Solução: documentação completa de todos os processos + criação de roteiros operacionais passo a passo + redistribuição formal de responsabilidades.

2. AUSÊNCIA DE LINHA DE VISIBILIDADE PARA O USUÁRIO
O usuário abria uma solicitação e não sabia o que acontecia depois — em que etapa estava, quanto tempo levaria, quem estava responsável. A incerteza gerava ansiedade e retornos desnecessários ao suporte.
Solução: implementação de sistema de tickets com status em tempo real + SLAs (tempos de resposta por categoria) definidos e comunicados publicamente.

3. CARTA DE SERVIÇOS INEXISTENTE
Os usuários não sabiam quais serviços a CTIC oferecia, muito menos como solicitá-los ou o que documentar quando precisavam de ajuda.
Solução: criação da primeira Carta de Serviços da CTIC, baseada diretamente nos blueprints — cada serviço descrito do ponto de vista do usuário, com canais de solicitação, documentos necessários e prazo esperado.`,
      result:`→ Serviços com processo documentado: de 20% para 100%
→ Pontos únicos de falha eliminados: 14 de 17 identificados
→ Tempo médio de resolução de chamados: redução de 43%
→ Satisfação dos servidores com o suporte de TI: aumento de 52%
→ Carta de Serviços: primeiro documento formal de serviços da coordenação em toda a história da instituição`,
      learning:`Este case é único porque o Blueprint foi usado não para redesenhar um serviço existente, mas para DESCOBRIR como os serviços realmente funcionavam — tornando o invisível visível.

Em organizações públicas, existe enorme quantidade de conhecimento tácito que vive exclusivamente na cabeça das pessoas. Quando essas pessoas saem (aposentadoria, transferência, licença), o serviço para. O Blueprint extrai esse conhecimento e o torna patrimônio organizacional — deixando de depender de indivíduos para se tornar um processo institucional.

A Carta de Serviços nasceu diretamente dos blueprints: é a versão do usuário do blueprint — simplificada, orientada ao que ele precisa saber para solicitar o serviço, sem o detalhamento operacional interno.` }

  {id:"design-thinking",type:"metodologia",category:"metodologia",custom:false,name:{pt:"Design Thinking",en:"Design Thinking"},origin:"IDEO / d.school Stanford — 1990s",desc:{pt:"Abordagem de inovação centrada no ser humano com 5 fases iterativas: empatia, definição, ideação, prototipagem e teste com usuários reais.",en:"Human-centered innovation approach with 5 iterative phases: empathy, definition, ideation, prototyping and real-user testing."},steps:{pt:["Empatizar — pesquise com usuários reais no contexto deles","Definir — sintetize o problema real a partir dos achados","Idear — gere muitas ideias sem julgamento","Prototipar — construa versões rápidas e baratas","Testar — valide com usuários, documente e itere"],en:["Empathize — research with real users","Define — synthesize the real problem","Ideate — generate ideas without judgment","Prototype — build fast cheap versions","Test — validate, document and iterate"]},examples:["IDEO redesenhou o carrinho de supermercado em 5 dias — referência mundial de processo criativo.","Bank of America criou 'Keep the Change' após DT revelar que usuários arredondavam valores manualmente.","Kaiser Permanente aplicou DT na troca de turno de enfermeiros, reduzindo erros médicos.","Apple usou DT para criar o iPod — começando pela experiência, não pela tecnologia.","CTIC/UEMA aplicou DT para reorganizar serviços digitais partindo das dores reais."],who:["Designer","Inovador","Gestor de Produto","Qualquer profissional"]},
  {id:"service-design",type:"metodologia",category:"metodologia",custom:false,name:{pt:"Design de Serviço",en:"Service Design"},origin:"Lynn Shostack (1982) — HBR / live|work London (2001)",desc:{pt:"Metodologia para projetar serviços de ponta a ponta, considerando camadas visíveis e invisíveis — bastidores, sistemas e todos os stakeholders envolvidos.",en:"Methodology for designing end-to-end services considering all visible and invisible layers — backstage, systems and all stakeholders."},steps:{pt:["Pesquise com usuários, funcionários e stakeholders","Mapeie a jornada atual (como é hoje)","Crie o blueprint de serviço (visível + bastidores)","Identifique pontos de atrito e oportunidades","Prototipe o novo serviço e teste no contexto real","Implemente com plano de mudança organizacional"],en:["Research with users, employees and stakeholders","Map the current journey (as-is)","Create the service blueprint","Identify friction points and opportunities","Prototype and test in real context","Implement with organizational change plan"]},examples:["Mayo Clinic redesenhou o comportamento de atendimento — satisfação >90% vs média do setor de 70%.","Nubank projetou cancelamento em 1 minuto — facilidade de sair virou argumento para ficar.","KLM criou status de reembolso em tempo real via WhatsApp — transparência valeu mais que velocidade.","Cleveland Clinic redesenhou admissão a partir das emoções do paciente — satisfação +40%.","CTIC/UEMA construiu a primeira carta de serviços, tornando o invisible visible."],who:["Service Designer","UX Designer","Gestor de Operações","Consultor de Inovação"]},
  {id:"duplo-diamante",type:"metodologia",category:"metodologia",custom:false,name:{pt:"Duplo Diamante",en:"Double Diamond"},origin:"Design Council UK — 2005",desc:{pt:"Framework com 4 fases: Descobrir e Definir (o problema certo) → Desenvolver e Entregar (a solução certa). Alterna fases divergentes e convergentes.",en:"Framework with 4 phases: Discover and Define (right problem) → Develop and Deliver (right solution). Alternates divergent and convergent phases."},steps:{pt:["Descobrir — explore o problema amplamente com pesquisa aberta","Definir — foque no problema certo com base nos achados","Desenvolver — gere muitas ideias e protótipos diferentes","Entregar — refine, teste e lance a solução"],en:["Discover — broadly explore the problem","Define — focus on the right problem","Develop — generate ideas and prototypes","Deliver — refine, test and launch"]},examples:["NHS: problema não era tecnologia — era comunicação entre médicos e pacientes.","Governo UK redesenhou renovação de passaporte: de 6 semanas para 3 dias.","Empresa de mobilidade: o problema não era o app — era a percepção de segurança nas paradas.","Banco descobriu que o problema real era a exigência de documentos, não a interface.","Universidade: o maior problema da matrícula era o sistema não reservar a vaga em tempo real."],who:["Designer","Inovador","Gestor","Qualquer equipe"]},
  {id:"agile-scrum",type:"metodologia",category:"metodologia",custom:false,name:{pt:"Agile / Scrum",en:"Agile / Scrum"},origin:"Ken Schwaber & Jeff Sutherland — 1995 / Manifesto Ágil — 2001",desc:{pt:"Framework iterativo em sprints com entregas incrementais. Define papéis (PO, Scrum Master, Dev Team), cerimônias e artefatos para organizar o trabalho em ciclos de 1–4 semanas.",en:"Iterative framework in sprints with incremental deliveries. Defines roles, ceremonies and artifacts to organize work in 1–4 week cycles."},steps:{pt:["Crie o Product Backlog com histórias de usuário priorizadas","Sprint Planning — defina o que entra no sprint","Daily Standup de 15 min: fiz, farei, impedimentos","Sprint Review — demonstre o incremento entregue","Retrospectiva — reflita e defina melhorias","Repita incorporando os aprendizados"],en:["Create Product Backlog with prioritized user stories","Sprint Planning","Daily Standup 15 min","Sprint Review","Retrospective","Repeat with learnings"]},examples:["Detran-SP: abandono online de 67% para 19% após 4 sprints iterativos.","Spotify criou o modelo de Squads e Tribes baseado em Agile.","iFood usa sprints de 2 semanas para iterar continuamente no app.","UEMA usou Kanban para redesenhar sistemas sem paralisar os serviços.","Amazon usa 'Working Backwards' + sprints para priorizar o backlog."],who:["Product Owner","Scrum Master","Dev Team","UX Designer"]},
  {id:"entrevista-profundidade",type:"metodo",category:"pesquisa",custom:false,name:{pt:"Entrevista em profundidade",en:"In-depth interview"},origin:"Pesquisa Qualitativa — Ciências Sociais / Etnografia",desc:{pt:"Conversa individual semiestruturada para entender motivações, comportamentos e emoções. O objetivo não é coletar opiniões — é entender o contexto e a experiência real.",en:"Semi-structured individual conversation to understand motivations, behaviors and emotions. The goal is not to collect opinions — it's to understand the real context."},steps:{pt:["Defina as questões de pesquisa (o que precisa entender)","Crie um roteiro semiestruturado — não um questionário fechado","Recrute 5–8 participantes representativos por grupo","Conduza a entrevista no contexto do usuário quando possível","Grave com permissão, transcreva e codifique os dados","Analise padrões e desenvolva insights"],en:["Define research questions","Create a semi-structured guide","Recruit 5–8 participants","Conduct in user's context","Record, transcribe and code","Analyze patterns and develop insights"]},examples:["One Medical: médico lê histórico 24h antes — adquirida pela Amazon por US$ 3,9 bilhões.","Nubank descobriu que clientes queriam nunca precisar ligar para o banco.","IDEO: em aldeias da Índia revelou que bebês prematuros morriam sem acesso a hospitais.","Airbnb: o maior medo do anfitrião era não saber quem entrava em sua casa.","Recife: vacinação — o problema era acesso e horário, não falta de consciência."],who:["UX Researcher","Service Designer","Pesquisador","Antropólogo"]},
  {id:"shadowing",type:"metodo",category:"pesquisa",custom:false,name:{pt:"Shadowing",en:"Shadowing"},origin:"Etnografia / Pesquisa Participante — Ciências Sociais",desc:{pt:"Pesquisador acompanha o usuário como uma sombra no cotidiano para observar comportamentos reais. Revela gaps entre o que as pessoas dizem e o que realmente fazem.",en:"Researcher follows the user like a shadow to observe real behaviors. Reveals gaps between what people say and what they actually do."},steps:{pt:["Obtenha consentimento e defina o escopo","Defina a duração: 30 min a várias horas","Observe sem interferir — anote, fotografe","Faça perguntas nos momentos críticos ('por que fez isso?')","Registre diferenças entre comportamento e relato","Sintetize achados e identifique momentos de atrito invisíveis"],en:["Get consent and define scope","Define duration: 30 min to hours","Observe without interfering","Ask at critical moments","Note behavior vs report differences","Synthesize findings"]},examples:["IDEO: shadowing revelou que 80% dos bebês prematuros morriam em aldeias — gerando o Embrace Warmer de US$ 25.","Hospital: prontuário travava o médico — shadowing revelou isso, entrevista não.","Supermercado: clientes ignoravam completamente a sinalização de promoções.","Banco: clientes usavam caderninho de papel — app não tinha visão consolidada.","CTIC/UEMA: técnicos tinham processos informais não documentados sustentando serviços críticos."],who:["UX Researcher","Service Designer","Pesquisador","Etnógrafo"]},
  {id:"card-sorting",type:"tecnica",category:"pesquisa",custom:false,name:{pt:"Card Sorting",en:"Card Sorting"},origin:"Jakob Nielsen / Arquitetura de Informação — 1990s",desc:{pt:"Usuários organizam cartões com conteúdos em grupos que fazem sentido para eles. Valida ou cria a taxonomia e arquitetura de informação de sites, apps e sistemas.",en:"Users organize cards with content into groups that make sense to them. Validates or creates taxonomy and information architecture."},steps:{pt:["Identifique o conteúdo a organizar (10–40 itens)","Escreva cada item em um cartão físico ou digital","Recrute 5–15 participantes representativos","Peça para agruparem os cartões como fizer sentido","Peça para nomearem cada grupo criado","Analise padrões e use para estruturar a navegação"],en:["Identify content to organize (10–40 items)","Write each item on a card","Recruit 5–15 participants","Ask them to group cards","Ask them to name each group","Analyze patterns and structure navigation"]},examples:["GOV.UK: 800 sites em 1 portal — de 24 para 7 categorias baseadas no que cidadãos buscavam.","Spotify: usuários agrupavam música por 'momento' (trabalhar, malhar), não por 'gênero'.","CTIC/UEMA: usuários agrupavam serviços por 'o que preciso fazer', não por departamento.","Hospital: médicos buscavam por 'tipo de paciente', não por 'tipo de exame'.","Loja virtual: clientes agrupavam por 'ocasião de uso' em vez de categoria técnica."],who:["UX Researcher","IA Specialist","UX Designer","Product Manager"]},
  {id:"persona",type:"ferramenta",category:"sintese",custom:false,name:{pt:"Persona",en:"Persona"},origin:"Alan Cooper — 'The Inmates Are Running the Asylum' (1999)",desc:{pt:"Arquétipo de usuário baseado em pesquisa real representando um grupo com comportamentos semelhantes. Sempre baseada em dados reais — não em suposições ou estereótipos.",en:"User archetype based on real research representing a group with similar behaviors. Always based on real data — not assumptions or stereotypes."},steps:{pt:["Conduza pesquisa qualitativa com 10–20 usuários reais","Identifique padrões de comportamento, não de demografia","Agrupe usuários por comportamentos semelhantes","Crie 1–3 perfis: nome, contexto, objetivos, frustrações, motivações","Valide com dados de pesquisa — questione cada afirmação","Use para guiar decisões: 'a Maria faria isso?'"],en:["Conduct qualitative research with 10–20 real users","Identify behavioral patterns","Group users by similar behaviors","Create 1–3 profiles","Validate with research data","Use to guide decisions"]},examples:["Airbnb: 'anfitriões ansiosos' vs 'experientes' — duas experiências completamente diferentes no app.","Hospital: persona da 'mãe com filho com febre às 3h' revelou que o problema era incerteza, não espera.","GOV.UK garante que serviços funcionem para o menor denominador de habilidade digital.","Netflix: 'personas de humor' — a mesma pessoa quer experiências diferentes às 7h e às 22h.","CTIC/UEMA: servidores técnicos vs usuários externos tinham necessidades completamente diferentes."],who:["UX Designer","Product Designer","UX Researcher","Service Designer"]},
  {id:"mapa-empatia",type:"ferramenta",category:"sintese",custom:false,name:{pt:"Mapa de Empatia",en:"Empathy Map"},origin:"Dave Gray — XPLANE / Strategyzer — 2010",desc:{pt:"Ferramenta visual para sintetizar o que sabemos sobre um usuário em 4 dimensões: Pensa e Sente, Vê, Ouve, Diz e Faz. Constrói empatia profunda antes de idear soluções.",en:"Visual tool to synthesize what we know about a user in 4 dimensions: Thinks and Feels, Sees, Hears, Says and Does."},steps:{pt:["Defina o usuário e o contexto específico","Preencha 'Pensa e Sente': medos, aspirações, preocupações","Preencha 'Vê': o que observa no ambiente ao redor","Preencha 'Ouve': influências externas — amigos, mídia","Preencha 'Diz e Faz': comportamentos e atitudes visíveis","Identifique Dores e Ganhos a partir das 4 dimensões"],en:["Define user and specific context","Fill 'Thinks and Feels'","Fill 'Sees'","Fill 'Hears'","Fill 'Says and Does'","Identify Pains and Gains"]},examples:["Startup de saúde: usuários buscavam 'não se sentir sozinhos', não 'terapia'.","App de transporte: o medo real não era o preço — era não saber se o motorista era confiável.","EAD: abandono não era falta de tempo — era vergonha de não entender sem poder perguntar.","Banco: 'animado com a possibilidade' vs 'frustrado com a burocracia' ao abrir conta.","CTIC/UEMA: o problema com sistemas não era técnico — era a sensação de não ter suporte."],who:["UX Designer","Service Designer","Product Manager","Facilitador"]},
  {id:"blueprint",type:"artefato",category:"visualizacao",custom:false,name:{pt:"Blueprint de Serviço",en:"Service Blueprint"},origin:"G. Lynn Shostack — Harvard Business Review (1984)",desc:{pt:"Mapa visual que mostra a experiência do cliente + toda a operação interna em camadas: evidências físicas, ações do cliente, linha de frente, bastidores e sistemas de suporte. Revela onde os problemas realmente estão.",en:"Visual map showing customer experience + all internal operations in layers: physical evidence, customer actions, front stage, backstage and support systems. Reveals where problems really are."},steps:{pt:["Defina o serviço, o escopo e o usuário a mapear","Mapeie as evidências físicas (o que o cliente toca/vê)","Mapeie as ações do cliente passo a passo","Trace a Linha de Visibilidade (visível / invisível)","Mapeie ações da linha de frente (funcionários visíveis)","Mapeie bastidores, processos de suporte e sistemas"],en:["Define the service, scope and user to map","Map physical evidence","Map customer actions step by step","Draw the Line of Visibility","Map front stage actions","Map backstage and support systems"]},examples:["UPA: paciente reclama de espera — Blueprint revelou que o prontuário travava a triagem. Solução foi no sistema, não no treinamento.","INSS: 'atendente mal comunicativo' — Blueprint revelou que CNIS e Receita não conversavam em tempo real.","Starbucks: barista precisava de 6 sistemas diferentes para processar 1 pedido personalizado.","Matrícula escolar: o sistema online não reservava a vaga — apenas gerava um protocolo.","CTIC/UEMA: 40% dos serviços dependiam de conhecimento tácito de técnicos específicos."],who:["Service Designer","UX Designer","Gestor de Operações","Product Manager"]},
  {id:"jornada-usuario",type:"artefato",category:"visualizacao",custom:false,name:{pt:"Jornada do Usuário",en:"User Journey Map"},origin:"Experience Design — adaptado de Experiential Marketing / anos 1990–2000",desc:{pt:"Mapa sequencial das experiências, emoções e pontos de contato do usuário ao longo do tempo. Pode mostrar a situação atual (as-is) ou a experiência futura desejada (to-be).",en:"Sequential map of user experiences, emotions and touchpoints over time. Can show current (as-is) or desired future (to-be) experience."},steps:{pt:["Defina a persona e o cenário específico a mapear","Liste cada etapa que o usuário percorre da ponta à ponta","Registre o que ele pensa e sente em cada etapa","Identifique os pontos de contato (canais, interfaces, pessoas)","Marque pontos de atrito 🔴 e momentos de valor 🟢","Identifique oportunidades de melhoria em cada atrito"],en:["Define persona and specific scenario","List each step end-to-end","Record thoughts and feelings at each step","Identify touchpoints","Mark friction 🔴 and value 🟢 moments","Identify improvement opportunities"]},examples:["iFood: sequência intencional do 1º pedido — conversão para 2º pedido +23%.","Disney: arco dramático completo de cada visita — o último momento é sempre memorável.","Banco: o maior abandono era pedir RG e CPF separados — 2 palavras resolveram.","Plano de saúde: paciente fazia 5 ligações para autorizar um exame que deveria ser 1.","CTIC/UEMA: 70% dos chamados resolvidos na ligação inicial, mas registrados como se levassem dias."],who:["UX Designer","Service Designer","Product Designer","Pesquisador"]},
  {id:"mapa-stakeholders",type:"artefato",category:"visualizacao",custom:false,name:{pt:"Mapa de Stakeholders",en:"Stakeholder Map"},origin:"Gestão de Projetos / Service Design — adaptado para UX nos anos 2000",desc:{pt:"Visualização de todos os atores envolvidos em um serviço e seus relacionamentos. Revela quem influencia, quem é impactado e quem precisa estar no processo de design.",en:"Visualization of all actors involved in a service and their relationships. Reveals who influences, who is impacted and who needs to be in the design process."},steps:{pt:["Liste todos os atores: usuários, funcionários, parceiros, reguladores","Identifique nível de influência e impacto de cada um","Posicione no mapa: centro (maior influência) → periferia","Desenhe as conexões e o tipo de relação entre eles","Identifique stakeholders 'esquecidos' que afetam o serviço","Use para decidir quem incluir na pesquisa e codesign"],en:["List all actors","Identify influence and impact levels","Position: center (most influence) to periphery","Draw connections and relationship types","Identify 'forgotten' stakeholders","Use to decide who to include"]},examples:["Hospital: empresa de limpeza (stakeholder esquecido) impactava diretamente a experiência do paciente.","App de entrega: o restaurante (não o entregador) era o principal ponto de fricção.","INSS: problema não era interno — falta de integração com Receita Federal.","Startup B2B: usuário e comprador tinham necessidades opostas — o mapa tornou isso visual.","CTIC/UEMA: 3 departamentos com dados duplicados gerando inconsistências."],who:["Service Designer","UX Designer","Gestor de Projeto","Consultor"]},
  {id:"hmw",type:"tecnica",category:"ideacao",custom:false,name:{pt:"Como nós poderíamos? (HMW)",en:"How Might We? (HMW)"},origin:"Procter & Gamble (1970s) — popularizado pelo IDEO e d.school Stanford",desc:{pt:"Reformulação de problemas em perguntas de oportunidade abertas. 'Como' sugere possibilidade. 'Nós' convida à colaboração. 'Poderíamos' abre alternativas sem limitar a solução.",en:"Reformulation of problems into open opportunity questions. 'How' suggests possibility. 'We' invites collaboration. 'Might' opens alternatives."},steps:{pt:["Parta de um insight de pesquisa ou ponto de atrito","Reformule como 'Como nós poderíamos...' — sem solução embutida","Crie versões em 3 escalas: muito ampla, certa, muito estreita","Selecione a HMW mais equilibrada para iniciar a ideação","Poste as HMWs no mural como prompts para brainstorming","Conecte cada ideia gerada à HMW que a inspirou"],en:["Start from insight or friction point","Reformulate as 'How might we...'","Create 3 scale versions","Select most balanced HMW","Post on board as prompts","Connect each idea to the HMW"]},examples:["'Check-in lento' → 'Como tornar o check-in uma experiência de boas-vindas?' — soluções além de acelerar.","Google usa HMW nos Design Sprints para transformar cada dor em pergunta.","'Pacientes não tomam remédios' → 'Como fazer o horário fazer parte da rotina?' — além de alarmes.","'Portal difícil' → 'Como qualquer servidor encontra o serviço em menos de 30 segundos?'","Amazon usa HMW internamente antes de decidir qualquer solução técnica."],who:["Facilitador","UX Designer","Service Designer","Qualquer equipe"]},
  {id:"crazy-8",type:"tecnica",category:"ideacao",custom:false,name:{pt:"Crazy 8's",en:"Crazy 8's"},origin:"Google Ventures — Design Sprint (Jake Knapp, 2010)",desc:{pt:"Técnica de ideação rápida: 8 esboços em 8 minutos. Força volume de ideias diferentes antes de convergir. Elimina o bloqueio criativo de 'precisar ter a ideia certa'.",en:"Rapid ideation: 8 sketches in 8 minutes. Forces volume of different ideas before converging. Eliminates the creative block of 'needing the right idea'."},steps:{pt:["Dobre uma folha A4 em 8 partes iguais (3 dobras)","Configure um timer de 8 minutos (1 min por quadrante)","Esboce 8 ideias diferentes — qualidade não importa","Não repita a mesma ideia com pequena variação","Apresente para o grupo em 3 min (todos simultaneamente)","Vote nas ideias mais promissoras com pontos adesivos"],en:["Fold A4 sheet into 8 equal parts","Set 8-minute timer","Sketch 8 different ideas","Don't repeat with small variation","Present to group in 3 min","Vote on most promising ideas"]},examples:["Google usa Crazy 8's nos Design Sprints para evitar que uma ideia domine cedo demais.","Slack: barra lateral de canais gerada em um Crazy 8's — óbvia só depois de desenhada.","iFood explorou formas de comunicar status do pedido — de notificações push a animações de mapa.","CTIC/UEMA: 40+ ideias para a tela inicial do portal em 5 minutos de equipe.","Airbnb usa Crazy 8's para evitar que a primeira ideia (sempre a mais óbvia) seja a única."],who:["UX Designer","Product Designer","Facilitador","Qualquer equipe"]},
  {id:"prototipo-papel",type:"metodo",category:"prototipagem",custom:false,name:{pt:"Prototipagem em papel",en:"Paper prototyping"},origin:"Carolyn Snyder — 'Paper Prototyping' (2003)",desc:{pt:"Criação de protótipos de baixa fidelidade com papel, caneta e tesoura. Permite testar fluxos com usuários reais antes de qualquer código — rápido, barato e descartável.",en:"Low-fidelity prototypes with paper, pen and scissors. Tests flows with real users before any code — fast, cheap and disposable."},steps:{pt:["Esboce as telas principais à mão em folhas separadas","Crie elementos interativos em papel (botões, menus, cards)","Defina um usuário e uma tarefa específica para testar","Simule a interação: usuário aponta, você troca as 'telas'","Observe onde o usuário hesita, erra ou pergunta","Itere o protótipo imediatamente após cada teste"],en:["Sketch main screens by hand","Create interactive elements in paper","Define user and specific task","Simulate: user points, you swap screens","Observe where user hesitates or errs","Iterate immediately after each test"]},examples:["Google criou o primeiro protótipo do Maps em papel antes de qualquer desenvolvimento.","Dropbox testou sincronização — usuários não entendiam 'nuvem', mas entendiam 'cópia automática'.","CTIC/UEMA: protótipos em papel do portal economizaram semanas de retrabalho.","Hospital testou formulário de triagem — 3 campos nunca eram preenchidos, foram eliminados.","Startup testou 5 versões do fluxo de abertura de conta em papel em um único dia."],who:["UX Designer","Product Designer","Service Designer","Qualquer pessoa"]},
  {id:"desktop-walkthrough",type:"metodo",category:"prototipagem",custom:false,name:{pt:"Desktop Walkthrough",en:"Desktop Walkthrough"},origin:"Service Design — 'This is Service Design Doing' (Stickdorn et al.)",desc:{pt:"Simulação física do serviço com objetos em mesa representando cada elemento. Revela falhas que só ficam visíveis quando o processo é VIVIDO, não descrito.",en:"Physical simulation of the service with objects on a table. Reveals flaws that only become visible when the process is LIVED, not described."},steps:{pt:["Defina o serviço e o cenário a simular","Crie representações físicas de cada ator e ponto de contato","Atribua papéis a cada participante (cliente, funcionário, sistema)","Simule o processo em câmera lenta, etapa por etapa","Pause para discutir cada momento crítico","Documente os problemas encontrados e itere"],en:["Define service and scenario","Create physical representations","Assign roles to each participant","Simulate in slow motion","Pause to discuss critical moments","Document and iterate"]},examples:["Hospital: simulação revelou que o problema era a posição física da impressora de laudos.","Banco: CEO entendeu em 15 min o que relatórios descreviam há meses.","Logística: sistema de rastreamento atualizava 4 horas depois do entregador já ter saído.","CTIC/UEMA: 3 etapas redundantes no fluxo de suporte técnico reveladas e eliminadas.","Governo redesenhou fluxo de benefícios antes de atualizar o sistema — meses economizados."],who:["Service Designer","UX Designer","Facilitador","Gestor de Operações"]},
  {id:"teste-usabilidade",type:"metodo",category:"avaliacao",custom:false,name:{pt:"Teste de Usabilidade",en:"Usability Testing"},origin:"Jakob Nielsen & Tom Landauer — Nielsen Norman Group (1990s)",desc:{pt:"Usuários reais realizam tarefas específicas enquanto o pesquisador observa. 5 usuários revelam 85% dos problemas de usabilidade — mais que isso é desperdício.",en:"Real users perform specific tasks while the researcher observes. 5 users reveal 85% of usability problems — more than that is waste."},steps:{pt:["Defina as tarefas críticas a testar","Recrute 5 usuários representativos","Configure o ambiente: moderado ou não moderado","Apresente o protocolo think-aloud: 'pense em voz alta'","Observe sem interferir — não ajude mesmo quando errarem","Analise gravações e priorize problemas por severidade"],en:["Define critical tasks to test","Recruit 5 representative users","Set up moderated or unmoderated environment","Introduce think-aloud protocol","Observe without interfering","Analyze and prioritize by severity"]},examples:["Amazon: botão '1-Click' mal interpretado — ajuste no texto reduziu abandono em 18%.","Detran-SP: 3 pontos de abandono corrigidos em sprints separados — 67% → 19%.","Google Maps: 'Obter rotas' vs 'Calcular rota' — 2 palavras, impacto de milhões de usuários.","Portal CTIC: link de chamado nomeado como 'Central de Serviços' — ninguém encontrava.","Netflix testa todas as mudanças de interface antes de ir para 100% da base."],who:["UX Researcher","UX Designer","Product Manager","Desenvolvedor"]},
  {id:"avaliacao-heuristica",type:"metodo",category:"avaliacao",custom:false,name:{pt:"Avaliação Heurística",en:"Heuristic Evaluation"},origin:"Jakob Nielsen & Rolf Molich — 'Usability Inspection Methods' (1990)",desc:{pt:"Especialistas avaliam uma interface com base nas 10 heurísticas de Nielsen. Identifica problemas sem usuários — rápido, barato e eficaz para ciclos iniciais.",en:"Experts evaluate an interface based on Nielsen's 10 heuristics. Identifies problems without users — fast, cheap and effective for early cycles."},steps:{pt:["Reúna 3–5 avaliadores com conhecimento em usabilidade","Defina o escopo: quais fluxos ou telas serão avaliados","Cada avaliador percorre o sistema individualmente","Lista os problemas com severidade (1–4)","Consolide os problemas em uma lista única","Priorize por severidade para o backlog de melhorias"],en:["Gather 3–5 evaluators with usability knowledge","Define scope","Each evaluator goes through independently","List problems with severity (1–4)","Consolidate into one list","Prioritize by severity"]},examples:["CTIC/UEMA: 47 problemas encontrados sem nenhum usuário presente.","Governo federal: 80% dos portais violavam 'prevenção de erros' em formulários.","Startup: 7 de 10 heurísticas violadas — identificado antes de gastar em teste com usuários.","Hospital: sistema de agendamento não comunicava se a consulta foi confirmada.","Banco: problemas críticos encontrados em 2 dias, economizando semanas de retrabalho."],who:["UX Designer","UX Researcher","Product Designer","Desenvolvedor"]},
  {id:"future-press-release",type:"tecnica",category:"estrategia",custom:false,name:{pt:"Future Press Release",en:"Future Press Release"},origin:"Amazon — método interno 'Working Backwards' (Jeff Bezos)",desc:{pt:"Você escreve a nota de imprensa do produto antes de ele existir — do ponto de vista do usuário no dia do lançamento. Força o time a pensar no valor real antes de qualquer decisão técnica.",en:"You write the product's press release before it exists — from the user's point of view on launch day. Forces the team to think about real value before any technical decision."},steps:{pt:["Escreva o título como se fosse publicado amanhã","Descreva em linguagem do usuário — não técnica","Explique o problema que resolve e por que importa","Inclua uma 'citação' fictícia de um usuário satisfeito","Descreva como funciona em termos simples","Compartilhe com a equipe: isso é o que queremos entregar?"],en:["Write the headline as if published tomorrow","Describe in user language","Explain the problem and why it matters","Include a fictional satisfied user quote","Describe how it works simply","Share with team: is this what we want?"]},examples:["Amazon criou o Kindle escrevendo o press release antes de qualquer protótipo: 'qualquer livro em 60 segundos'.","AWS criado a partir de press release interno 2 anos antes do lançamento.","Banco brasileiro: 'Primeiro banco que você abre em 3 minutos pelo celular'.","Startup de saúde: o press release real era sobre 'não se sentir sozinho', não 'acompanhamento médico'.","CTIC/UEMA: 'Qualquer servidor encontra o serviço em menos de 30 segundos' — norte do redesenho."],who:["Product Manager","UX Designer","Service Designer","Liderança"]},
  {id:"job-story",type:"tecnica",category:"estrategia",custom:false,name:{pt:"Job Story",en:"Job Story"},origin:"Alan Klement — intercom.io (2013) / Jobs-to-be-Done (Clayton Christensen)",desc:{pt:"Alternativa às User Stories focada em contexto e motivação real. Formato: 'Quando [situação], quero [motivação], para [resultado].' Remove o foco na persona, coloca na circunstância.",en:"Alternative to User Stories focused on real context and motivation. Format: 'When [situation], I want [motivation], so that [result].' Removes focus from persona, places it on circumstance."},steps:{pt:["Identifique a situação específica que desencadeia a ação","Descreva a motivação real (o que o usuário quer, não o que faz)","Defina o resultado esperado (o 'trabalho' que precisa ser feito)","Escreva: 'Quando [situação], quero [motivação], para [resultado]'","Valide com pesquisa: essa situação realmente existe?","Use para guiar decisões — não como especificação técnica"],en:["Identify the specific triggering situation","Describe the real motivation","Define the expected outcome","Write: 'When [situation], I want [motivation], so that [result]'","Validate with research","Use to guide decisions"]},examples:["Spotify: 'Quando estou malhando, quero música que mantenha meu ritmo, para não perder motivação.'","iFood: 'Quando chego em casa cansado, quero pedir comida sem pensar, para comer algo bom sem esforço.'","Portal CTIC: 'Quando meu computador trava em reunião, quero abrir chamado rapidamente, para voltar ao trabalho.'","Nubank: 'Quando vejo cobrança estranha, quero entender sem ligar, para resolver sem perder tempo.'","App de saúde: 'Quando esqueço o remédio, quero ser lembrado gentilmente, para manter a rotina sem culpa.'"],who:["Product Manager","UX Designer","Service Designer","Desenvolvedor"]},
  {id:"retrospectiva",type:"tecnica",category:"workshop",custom:false,name:{pt:"Retrospectiva (Scrum)",en:"Sprint Retrospective"},origin:"Scrum Framework — Ken Schwaber & Jeff Sutherland (1995)",desc:{pt:"Cerimônia ao final de cada sprint para refletir sobre o processo (não o produto). Técnicas: Start/Stop/Continue, Sailboat, Mad/Sad/Glad, 4Ls.",en:"Ceremony at the end of each sprint to reflect on process (not product). Techniques: Start/Stop/Continue, Sailboat, Mad/Sad/Glad, 4Ls."},steps:{pt:["Reserve 1–3 horas ao final do sprint","Escolha a técnica: Start/Stop/Continue, Sailboat, Mad/Sad/Glad","Cada membro escreve suas contribuições individualmente","Apresente e discuta em grupo sem julgamento","Priorize 1–3 ações concretas para o próximo sprint","Inicie o próximo sprint verificando as ações combinadas"],en:["Reserve 1–3 hours","Choose technique","Each member writes individually first","Present and discuss without judgment","Prioritize 1–3 concrete actions","Start next sprint checking agreed actions"]},examples:["CTIC/UEMA: retro revelou que reuniões técnicas sem UX geravam mal-entendidos e retrabalho.","Spotify: modelo de Chapter surgiu de uma retrospectiva de equipe.","Startup: o maior problema de velocidade era a aprovação de design, não o código.","iFood usou Sailboat: vento = a/b testing; âncora = aprovações legais lentas.","UEMA: Mad/Sad/Glad revelou que o problema emocional era a falta de visibilidade do progresso."],who:["Scrum Master","Product Owner","Dev Team","UX Designer"]},
  {id:"lightning-talk",type:"tecnica",category:"workshop",custom:false,name:{pt:"Lightning Talk",en:"Lightning Talk"},origin:"Conferências de tecnologia / Perl Mongers (1990s)",desc:{pt:"Apresentação rápida de 5 minutos para compartilhar referências, achados de pesquisa ou insights sem perder tempo da equipe. Foco no conteúdo essencial.",en:"Quick 5-minute presentation to share references, research findings or insights without wasting team time. Focus on essential content."},steps:{pt:["Defina o tema: referência, achado de pesquisa ou ferramenta","Limite ao essencial: 1 problema, 1 solução, 1 aprendizado","Prepare em no máximo 3 slides ou 1 quadro visual","Apresente em 5 minutos — use timer visível","Reserve 2 minutos para perguntas ou reações","Documente os aprendizados relevantes no repositório"],en:["Define theme","Limit to essential: 1 problem, 1 solution, 1 learning","Prepare in at most 3 slides","Present in 5 minutes","Reserve 2 min for questions","Document relevant learnings"]},examples:["Google realiza Lightning Talks semanais — qualquer engenheiro pode compartilhar algo aprendido.","IDEO usa nos design sprints: 5 LTs de 5 min antes de qualquer ideação.","CTIC/UEMA criou série semanal de LTs sobre ferramentas — formando equipe sem afastar das responsabilidades.","Spotify usa entre squads para transferir conhecimento sem criar dependência de consultores.","10 achados de pesquisa processados em 1 hora com 10 lightning talks de 5 min."],who:["Facilitador","Designer","Pesquisador","Qualquer profissional"]},
  {id:"pixar-storytelling",type:"tecnica",category:"workshop",custom:false,name:{pt:"Pixar Storytelling",en:"Pixar Storytelling"},origin:"Pixar Animation Studios / Emma Coats — 22 regras de storytelling (2011)",desc:{pt:"Estrutura narrativa da Pixar para apresentar problemas de design com empatia e clareza. Formato: Era uma vez... Todo dia... Até que um dia... Por causa disso... Até que finalmente...",en:"Pixar's narrative structure for presenting design problems with empathy and clarity. Format: Once upon a time... Every day... Until one day... Because of this... Until finally..."},steps:{pt:["Era uma vez [apresente o usuário e seu contexto]","Todo dia [descreva o comportamento ou rotina normal]","Até que um dia [apresente o problema ou mudança]","Por causa disso [mostre o impacto e as consequências]","Por causa disso [encadeie consequências se necessário]","Até que finalmente [proponha a solução e o resultado desejado]"],en:["Once upon a time [introduce user and context]","Every day [describe normal behavior]","Until one day [introduce the problem]","Because of this [show impact]","Because of this [chain consequences]","Until finally [propose the solution]"]},examples:["Redesenho da UPA: 'Era uma vez Maria. Todo dia trabalhava até tarde. Até que um dia teve dor no peito às 2h. Esperou 4h sem informação. Até que finalmente redesenhamos a experiência.'","Pitch de produto transformou dados técnicos em história que o CEO entendeu em 2 minutos.","CTIC/UEMA: usou para apresentar problema dos sistemas para a reitoria.","Designer criou onboarding com a estrutura — de 10 min para 2 min de compreensão.","Startup alinhou toda a equipe sobre o problema real dos usuários antes de qualquer ideação."],who:["UX Designer","Service Designer","Product Manager","Facilitador"]},
  {id:"golden-path",type:"tecnica",category:"estrategia",custom:false,name:{pt:"Golden Path",en:"Golden Path"},origin:"Product Design / UX Strategy — Google e startups",desc:{pt:"O caminho ideal e mais comum que o usuário percorre para atingir o objetivo principal. Base para priorizar design, desenvolvimento e testes. Tudo que não serve o Golden Path é secundário.",en:"The ideal and most common path users take to achieve the main objective. Basis for prioritizing design, development and testing. Everything that doesn't serve it is secondary."},steps:{pt:["Identifique o objetivo principal do produto (apenas 1)","Mapeie o caminho mais curto para atingir esse objetivo","Elimine qualquer fricção ou etapa desnecessária","Use o Golden Path como critério de priorização do backlog","Teste esse caminho específico com usuários regularmente","Meça a taxa de completude como KPI principal"],en:["Identify the main objective (just 1)","Map the shortest path","Eliminate friction and unnecessary steps","Use as backlog prioritization criterion","Test regularly with users","Measure completion rate as main KPI"]},examples:["Uber: 'pedir corrida em menos de 60 segundos'. Toda decisão: isso protege os 60 segundos?","Instagram: 'postar em menos de 3 taps'. A câmera nunca vai para menu secundário.","iFood: Golden Path do 1º pedido tem 5 etapas. Qualquer adição precisa de aprovação especial.","Portal CTIC: 'abrir chamado em menos de 2 minutos' — guiou toda a arquitetura de informação.","Nubank: cancelamento é 1 tap → confirmação → cancelado. Toda retenção ocorre ANTES."],who:["Product Manager","UX Designer","Service Designer","Tech Lead"]},

  // ── NOVOS MÉTODOS DE IDEAÇÃO (Como Se Cria) ──────────────
  {id:"eliminacao-bloqueio",type:"tecnica",category:"ideacao",custom:false,
    name:{pt:"Eliminação de Bloqueio Mental",en:"Mental Block Elimination"},
    origin:"Metodologia de projeto de produto / Como Se Cria",
    desc:{pt:"Conjunto de técnicas de aquecimento para remover bloqueios perceptivos, culturais e de hábito antes de sessões de ideação. A criatividade não trava por falta de talento — trava por vieses de percepção e medo de julgamento.",en:"Warm-up techniques to remove perceptual, cultural and habit blocks before ideation sessions. Creativity doesn't stall from lack of talent — it stalls from perceptual biases and fear of judgment."},
    steps:{pt:["Diagnostique o bloqueio — pergunte ao grupo: 'o que nos impede de pensar diferente aqui?'","Escolha um exercício de aquecimento — associação livre, desenhos de 30 segundos, perguntas absurdas ('e se custasse zero?')","Estabeleça regra explícita: nenhuma ideia será criticada nesta fase","Registre tudo, mesmo o óbvio — o objetivo é destravar o fluxo, não a qualidade","Só depois entre no método de ideação principal (Biônica, Sinética, SCAMPER, Seis Chapéus)"],en:["Diagnose the block — ask the group: 'what's preventing us from thinking differently?'","Choose a warm-up exercise — free association, 30-second sketches, absurd questions ('what if it cost zero?')","Establish explicit rule: no idea will be criticized at this stage","Record everything, even the obvious — the goal is to unblock the flow, not quality","Only then start the main ideation method (Bionics, Synectics, SCAMPER, Six Hats)"]},
    examples:["Equipe travada no redesign de carrinho de supermercado só conseguia pensar em variações do carrinho. Facilitador aplicou: 'esqueçam que é um carrinho — como uma pessoa carregaria compras se rodas não existissem?' Gerou associações com mochilas, trenós e exoesqueletos.","Grupo de UX incapaz de sair do paradigma de 'tela' para redesenhar um app. Pergunta desbloqueadora: 'e se o usuário fosse cego?' Abriu toda uma linha de ideação sobre feedback não visual.","Time de produto repetindo sempre as mesmas soluções. Exercício: 5 minutos desenhando o produto como se fosse um animal. As metáforas geradas quebraram os padrões habituais.","Equipe de serviço público presa em burocracia. Provocação: 'e se esse serviço fosse oferecido por uma pizzaria?' A analogia revelou insights sobre velocidade e rastreamento.","Workshop da CTIC com técnicos de TI: pergunta 'e se o usuário tivesse apenas 10 segundos para encontrar o que precisa?' destravou toda a sessão de arquitetura de informação."],
    who:["Facilitador","Designer","Qualquer equipe antes de ideação"]},

  {id:"bionica",type:"metodo",category:"ideacao",custom:false,
    name:{pt:"Biônica (Biomimética)",en:"Bionics (Biomimetics)"},
    origin:"Werner Nachtigall (estudo sistemático); aplicação em produto: Ramos (1993)",
    desc:{pt:"Técnica criativa que estuda sistemas naturais — forma, função e materiais — para desenvolver soluções de projeto análogas. Não é copiar a aparência da natureza: é entender o princípio de funcionamento por trás da solução natural e adaptá-lo a um problema de design.",en:"Creative technique that studies natural systems — form, function and materials — to develop analogous design solutions. Not copying nature's appearance: understanding the operating principle behind the natural solution and adapting it to a design problem."},
    steps:{pt:["Defina claramente a função ou problema a resolver (ex: 'dissipar impacto', 'economizar material mantendo resistência')","Pesquise sistemas naturais que resolvem funções equivalentes (animais, plantas, estruturas minerais)","Extraia o princípio de solução — não a forma, o mecanismo por trás dela","Traduza esse princípio para materiais e processos industriais viáveis","Teste se a analogia realmente resolve o problema original — nem toda solução natural é aplicável industrialmente"],en:["Clearly define the function or problem to solve","Research natural systems that solve equivalent functions","Extract the solution principle — not the form, the mechanism behind it","Translate that principle into viable industrial materials and processes","Test if the analogy really solves the original problem"]},
    examples:["Velcro: engenheiro suíço George de Mestral observou carrapichos se prendendo ao pelo do cão usando ganchos microscópicos — o princípio (gancho + laço) foi extraído e reproduzido em tecido sintético.","Trem-bala Shinkansen: bico do trem redesenhado baseado no bico do martim-pescador, que mergulha na água sem respingo. Resultado: 15% mais rápido e 30% menos energia.","Pagaia de natação: modelada nas nadadeiras das tartarugas marinhas para aumentar eficiência de propulsão na água.","Fachada do Eastgate Centre (Zimbábue): sistema de ventilação natural baseado nos cupinzeiros, que mantêm temperatura constante sem ar-condicionado.","Superfície da pele de tubarão aplicada em trajes de natação olímpica para reduzir arrasto — depois banida por ser 'vantagem tecnológica excessiva'."],
    who:["Designer de produto","Engenheiro","Arquiteto"]},

  {id:"sinetica",type:"metodo",category:"ideacao",custom:false,
    name:{pt:"Sinética",en:"Synectics"},
    origin:"William J. J. Gordon — estudos sobre analogia como motor de invenção",
    desc:{pt:"Técnica baseada em analogias para gerar ideias originais, partindo do princípio de 'tornar o estranho familiar, e o familiar estranho'. Usa 4 tipos de analogia para enxergar o problema conhecido sob uma luz nova.",en:"Technique based on analogies to generate original ideas, based on the principle of 'making the strange familiar, and the familiar strange'. Uses 4 types of analogy to see the known problem in a new light."},
    steps:{pt:["Enuncie o problema de forma simples e objetiva","Escolha um tipo de analogia: pessoal, direta, simbólica ou fantástica","Gere associações livres a partir da analogia escolhida, sem julgar","Detecte os 'pontos de tensão' — onde a analogia revela algo que a lógica direta não revelaria","Traga a ideia de volta ao problema real, adaptando o insight simbólico a uma solução viável"],en:["State the problem simply and objectively","Choose an analogy type: personal, direct, symbolic or fantastic","Generate free associations from the chosen analogy, without judgment","Detect 'tension points' — where the analogy reveals something direct logic wouldn't","Bring the idea back to the real problem, adapting the symbolic insight to a viable solution"]},
    examples:["Cadeira ergonômica via analogia pessoal: 'se eu fosse a coluna do usuário, o que pediria?' — resposta ('quero me mover, não travar') gerou o conceito de encosto articulado que acompanha o movimento.","Embalagem sustentável via analogia fantástica: 'e se a embalagem se dissolvesse ao contato com a chuva?' — levou ao desenvolvimento de embalagens solúveis em água para detergente.","Interface de app via analogia simbólica: 'força gentil' como síntese do paradoxo (app poderoso mas não intimidador) gerou o design minimalista com ações poderosas ocultas.","Sistema de logística via analogia direta com formigas: cada 'formiga' (entregador) segue trilhas de feromônio (dados de tráfego) — gerou algoritmo de otimização de rotas.","Produto de acessibilidade via analogia pessoal: 'se eu fosse uma pessoa com Parkinson tentando usar este controle remoto, o que me frustraria?' — revelou que o principal problema era não saber se o botão foi pressionado."],
    who:["Designer de produto","Equipe de ideação","Facilitador"]},

  {id:"matriz-morfologica",type:"ferramenta",category:"ideacao",custom:false,
    name:{pt:"Matriz Morfológica (Caixa de Zwicky)",en:"Morphological Matrix (Zwicky Box)"},
    origin:"Fritz Zwicky — astrônomo do Caltech (1969); adotada pelo design como método combinatório",
    desc:{pt:"Método analítico e combinatório: soluções criativas surgem ao combinar novas variações de componentes, funções, formas e materiais já mapeados. Se você tem 3 variáveis com 4 soluções cada: 4×4×4 = 64 combinações possíveis, muitas nunca cogitadas isoladamente.",en:"Analytical and combinatorial method: creative solutions emerge by combining new variations of already mapped components, functions, forms and materials. With 3 variables with 4 solutions each: 4×4×4 = 64 possible combinations, many never considered individually."},
    steps:{pt:["Defina as variáveis do produto — forma, cor, textura, material, mecanismo, função","Monte uma matriz: variáveis nas linhas, soluções possíveis para cada variável nas colunas","Para cada variável, gere o maior número possível de soluções (gráficas ou descritas)","Combine soluções de variáveis diferentes, uma de cada linha, formando 'novas receitas'","Avalie as combinações mais promissoras — nem todas farão sentido, mas algumas revelam soluções inéditas"],en:["Define product variables — form, color, texture, material, mechanism, function","Build a matrix: variables in rows, possible solutions for each in columns","For each variable, generate as many solutions as possible","Combine solutions from different variables, one from each row","Evaluate the most promising combinations"]},
    examples:["Abridor de garrafas: variável A=mecanismo (alavanca, rosca, pressão), B=material (metal, madeira, plástico), C=empunhadura (redonda, ergonômica, plana). 'Alavanca + madeira + ergonômica' = conceito novo nunca cogitado.","Embalagem de delivery: variável A=material (papel, plástico, biodegradável), B=abertura (rasgar, dobrar, recortar), C=reutilização (descartável, retornável, reaproveitável). Gerou 27 combinações.","Cadeira de escritório: 5 variáveis × 4 soluções cada = 1024 combinações possíveis. Levou à cadeira com base de bambu + assento inflável + encosto articulado.","Design de aplicativo: variável A=navegação, B=paleta de cores, C=tipografia, D=densidade de informação. 3×3×3×3 = 81 conceitos visuais para avaliar.","Projeto de calçado esportivo: cruzamento de 'sola de borracha natural' + 'cabedal de malha respirável' + 'fechamento magnético' revelou um conceito de tênis nunca antes desenvolvido."],
    who:["Designer de produto","Engenheiro de desenvolvimento","Equipe de ideação"]},

  {id:"brainwriting",type:"tecnica",category:"ideacao",custom:false,
    name:{pt:"Brainwriting 635",en:"Brainwriting 635"},
    origin:"Variação do brainstorming de Alex Osborn (1953), criada para reduzir dominância de voz",
    desc:{pt:"Técnica silenciosa de geração de ideias: 6 pessoas, 3 ideias cada, em 5 minutos por rodada. Cada pessoa constrói sobre as ideias do colega anterior. Resolve o problema do brainstorming tradicional onde vozes assertivas dominam e ideias tímidas se perdem.",en:"Silent idea generation technique: 6 people, 3 ideas each, in 5 minutes per round. Each person builds on the previous colleague's ideas. Solves the traditional brainstorming problem where assertive voices dominate and shy ideas get lost."},
    steps:{pt:["Reúna 6 participantes, cada um com folha dividida em 3 colunas","Apresente o problema/desafio de forma clara","Cada pessoa escreve 3 ideias em 5 minutos na sua folha — em silêncio","Ao fim dos 5 min, cada um passa a folha para o vizinho (sempre no mesmo sentido)","A pessoa lê as 3 ideias anteriores e escreve mais 3 — variação, combinação ou ideia nova inspirada nas anteriores","Repete por 6 rodadas. Resultado: até 108 ideias em 30 minutos","No final, leia todas as folhas em voz alta e agrupe/selecione as mais promissoras"],en:["Gather 6 participants, each with a sheet divided into 3 columns","Present the problem/challenge clearly","Each person writes 3 ideas in 5 minutes — in silence","At the end of 5 min, each passes the sheet to the neighbor (always same direction)","Person reads the 3 previous ideas and writes 3 more — variation, combination or new inspired idea","Repeat for 6 rounds. Result: up to 108 ideas in 30 minutes","Finally, read all sheets aloud and group/select the most promising"]},
    examples:["Equipe de 6 gerando conceitos para reduzir desperdício de embalagem em delivery: 100+ ideias em 30 minutos silenciosos, muitas nascidas da combinação de ideias de colegas diferentes.","Time de produto de fintech gerou 108 ideias para onboarding em 30 minutos — mais que em 3 sessões de brainstorming falado anteriores somadas.","Workshop da CTIC com equipe de TI: Brainwriting sobre 'como melhorar o atendimento de chamados' gerou ideias que ninguém havia verbalizado em 6 meses de reuniões.","Grupo de estudantes de design gerando nomes para projeto: 6 rodadas × 3 nomes = 108 candidatos. O nome escolhido veio de uma combinação de duas ideias de colegas diferentes.","Empresa de varejo usando Brainwriting para gerar promoções sazonais: integrantes mais tímidos geraram 60% das ideias selecionadas — algo que nunca acontecia no brainstorming verbal."],
    who:["Facilitador","Equipe de projeto","Grupos com integrantes tímidos"]},

  {id:"scamper",type:"tecnica",category:"ideacao",custom:false,
    name:{pt:"SCAMPER",en:"SCAMPER"},
    origin:"Bob Eberle (anos 1970), baseado em perguntas provocativas de Alex Osborn",
    desc:{pt:"Checklist de 7 gatilhos de pensamento para gerar variações a partir de um produto ou ideia já existente. S=Substituir, C=Combinar, A=Adaptar, M=Modificar, P=Propor outro uso, E=Eliminar, R=Reverter. Excelente para inovação incremental e redesign.",en:"Checklist of 7 thought triggers to generate variations from an existing product or idea. S=Substitute, C=Combine, A=Adapt, M=Modify, P=Put to other use, E=Eliminate, R=Reverse. Excellent for incremental innovation and redesign."},
    steps:{pt:["Escolha um produto, serviço ou processo existente como ponto de partida","S — Substituir: o que pode ser trocado? (material, processo, pessoa, lugar)","C — Combinar: o que pode ser fundido com outra função ou produto?","A — Adaptar: o que posso copiar de outro contexto que resolve algo parecido?","M — Modificar/Magnificar: o que posso aumentar, diminuir, exagerar ou distorcer?","P — Propor outro uso: como isso poderia servir para algo totalmente diferente?","E — Eliminar: o que posso remover, simplificar, tornar menor?","R — Reverter: o que acontece se eu inverter a ordem, a lógica ou o papel dos elementos?"],en:["Choose an existing product, service or process as starting point","S — Substitute: what can be swapped? (material, process, person, place)","C — Combine: what can be merged with another function or product?","A — Adapt: what can I copy from another context that solves something similar?","M — Modify/Magnify: what can I increase, decrease, exaggerate or distort?","P — Put to other use: how could this serve something completely different?","E — Eliminate: what can I remove, simplify, make smaller?","R — Reverse: what happens if I invert the order, logic or role of elements?"]},
    examples:["Garrafa de água redesenhada pelo SCAMPER: S=plástico→biodegradável, C=garrafa+filtro embutido, A=dobra de camping, M=tampa maior para uma mão, P=suporte de celular, E=rótulo→gravação direta, R=tampa na base.","Post-it: surgiu de um SCAMPER informal sobre adesivos — P (propor outro uso) aplicado a um adesivo 'fraco' que não colava direito. Reposicionado como 'marcador removível'.","Airbnb aplicou SCAMPER mentalmente ao hotel: E=eliminar recepção e quarto padronizado, C=combinar casa+hospedagem, R=reverter quem é o anfitrião (morador vira prestador de serviço).","Uber aplicou R (Reverter) ao táxi: em vez de o passageiro procurar o táxi, o táxi encontra o passageiro; em vez de pagar em dinheiro, paga pelo app.","CTIC/UEMA aplicou SCAMPER ao processo de abertura de chamado: E=eliminar 3 campos desnecessários do formulário, M=ampliar o campo de descrição do problema, R=inverter — sistema sugere soluções antes de abrir o chamado."],
    who:["Designer","Equipe de produto","Qualquer equipe de redesign"]},

  {id:"seis-chapeus",type:"tecnica",category:"ideacao",custom:false,
    name:{pt:"Seis Chapéus do Pensamento",en:"Six Thinking Hats"},
    origin:"Edward de Bono — psicólogo maltês, livro 'Six Thinking Hats' (2008)",
    desc:{pt:"Técnica de pensamento paralelo: em vez de cada pessoa defender seu ponto de vista (gerando debate e ego), todo o grupo 'veste o mesmo chapéu' ao mesmo tempo, olhando o problema pela mesma lente. Cada chapéu = um modo de pensar: Branco=dados, Vermelho=emoção, Preto=crítica, Amarelo=otimismo, Verde=criatividade, Azul=processo.",en:"Parallel thinking technique: instead of each person defending their viewpoint (generating debate and ego), the whole group 'wears the same hat' at the same time. Each hat = a way of thinking: White=data, Red=emotion, Black=criticism, Yellow=optimism, Green=creativity, Blue=process."},
    steps:{pt:["Facilitador (chapéu azul) define o problema e a ordem dos chapéus","Chapéu BRANCO ⚪ — grupo levanta só fatos e dados disponíveis, sem opinião","Chapéu VERMELHO 🔴 — cada um expressa reação emocional/intuitiva, sem justificar","Chapéu PRETO ⚫ — grupo lista riscos, problemas e motivos de cautela","Chapéu AMARELO 🟡 — grupo lista benefícios e motivos de otimismo","Chapéu VERDE 🟢 — grupo gera alternativas e ideias novas","Chapéu AZUL 🔵 — resume decisões e define próximos passos"],en:["Facilitator (blue hat) defines the problem and hat order","WHITE hat ⚪ — group raises only available facts and data, no opinion","RED hat 🔴 — each expresses emotional/intuitive reaction, without justifying","BLACK hat ⚫ — group lists risks, problems and reasons for caution","YELLOW hat 🟡 — group lists benefits and reasons for optimism","GREEN hat 🟢 — group generates alternatives and new ideas","BLUE hat 🔵 — summarizes decisions and defines next steps"]},
    examples:["Equipe decidindo lançar nova feature: branco=métricas de uso atual, vermelho=insegurança sobre prazo, preto=riscos técnicos, amarelo=potencial de retenção, verde=beta fechado primeiro, azul=piloto controlado como próximo passo.","Reunião de produto sobre redesenho de checkout: método evitou que o engenheiro (sempre no chapéu preto) travasse a discussão — todos passaram pelo preto juntos e seguiram em frente.","Workshop de planejamento estratégico da CTIC: 6 chapéus aplicados em 90 minutos produziram mais clareza que 3 reuniões anteriores de 2h cada.","Decisão de mudar fornecedor de sistema: amarelo revelou economia de 30%, preto revelou risco de migração de dados — decisão final foi migrar em fases, não de uma vez.","Discussão sobre novo processo de atendimento: chapéu vermelho permitiu que técnicos expressassem frustração sem julgamento — insights que nunca apareceriam num processo decisório formal."],
    who:["Facilitador","Equipes multidisciplinares","Reuniões de decisão com egos em jogo"]}
