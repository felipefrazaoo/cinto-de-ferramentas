  pt:{app:"Cinto de Ferramentas",sub:"Design · Serviço · UX",search:"Buscar ferramenta...",all:"Todas",fav:"Favoritos",rec:"Recentes",click:"Clique em uma ferramenta para ver os detalhes",who:"Quem aplica",steps:"Passo a passo",exs:"Exemplos reais",addEx:"+ Adicionar exemplo",addTool:"+ Nova ferramenta",saveFav:"Salvar nos favoritos",saved:"Salvo! ⭐",claude:"Aprofundar com Claude ↗",learnT:"📖 Saiba mais — aula completa",learnEx:"🔎 Ver case completo",back:"← Voltar",cancel:"Cancelar",save:"Salvar",dark:"Escuro",light:"Claro",lang:"EN",cnt:"ferramentas",ctx:"Contexto",prob:"O problema",proc:"O processo",sol:"A solução",res:"Resultado",lrn:"Aprendizado-chave",TL:{metodologia:"Metodologia",metodo:"Método",ferramenta:"Ferramenta",artefato:"Artefato",tecnica:"Técnica"},CL:{pesquisa:"Pesquisa",ideacao:"Ideação",sintese:"Síntese",prototipagem:"Prototipagem",visualizacao:"Visualização",avaliacao:"Avaliação",workshop:"Workshop",estrategia:"Estratégia",metodologia:"Metodologias"},FL:{name:"Nome *",type:"Tipo",origin:"Origem",desc:"Descrição",cat:"Categoria",who:"Quem aplica (vírgulas)",steps:"Passo a passo (um por linha)",ex:"Primeiro exemplo",ph:"Descreva um exemplo real..."},modal:"Adicionar nova ferramenta",notes:"Minhas anotações",noteAdd:"+ Adicionar anotação",noteSave:"💾 Salvar anotação",noteCancel:"Cancelar",noteImg:"🖼 Adicionar imagem",noteTitle:"Título (opcional)",noteText:"Escreva sua anotação..."},
  en:{app:"Design Toolkit",sub:"Design · Service · UX",search:"Search tool...",all:"All",fav:"Favorites",rec:"Recent",click:"Click a tool to see details",who:"Who applies",steps:"Step by step",exs:"Real examples",addEx:"+ Add example",addTool:"+ New tool",saveFav:"Save to favorites",saved:"Saved! ⭐",claude:"Go deeper with Claude ↗",learnT:"📖 Learn more — full lesson",learnEx:"🔎 See full case",back:"← Back",cancel:"Cancel",save:"Save",dark:"Dark",light:"Light",lang:"PT",cnt:"tools",ctx:"Context",prob:"The problem",proc:"The process",sol:"The solution",res:"Result",lrn:"Key learning",TL:{metodologia:"Methodology",metodo:"Method",ferramenta:"Tool",artefato:"Artifact",tecnica:"Technique"},CL:{pesquisa:"Research",ideacao:"Ideation",sintese:"Synthesis",prototipagem:"Prototyping",visualizacao:"Visualization",avaliacao:"Evaluation",workshop:"Workshop",estrategia:"Strategy",metodologia:"Methodologies"},FL:{name:"Name *",type:"Type",origin:"Origin",desc:"Description",cat:"Category",who:"Who applies (commas)",steps:"Step by step (one per line)",ex:"First example",ph:"Describe a real example..."},modal:"Add new tool",notes:"My notes",noteAdd:"+ Add note",noteSave:"💾 Save note",noteCancel:"Cancel",noteImg:"🖼 Add image",noteTitle:"Title (optional)",noteText:"Write your note..."},
};


// ── STATE ────────────────────────────────────────────────
let lang='pt', dark=false;
let tools=[...TOOLS];
let favs=[], recent=[], notes={};
let activeCat='all', activeTypes=['metodologia','metodo','ferramenta','artefato','tecnica'];
let selId=null, detWidth=310, addingEx=false, addingNote=false;
let noteImg=null, noteImgName='';
let currentExId=null;

// ── STORAGE ──────────────────────────────────────────────
function load(){
  try{
    const custom=JSON.parse(localStorage.getItem('cinto_c')||'[]');
    tools=[...TOOLS,...custom];
    favs=JSON.parse(localStorage.getItem('cinto_f')||'[]');
    recent=JSON.parse(localStorage.getItem('cinto_r')||'[]');
    notes=JSON.parse(localStorage.getItem('cinto_n')||'{}');
    const savedDark=localStorage.getItem('cinto_dark');
    if(savedDark==='true'){dark=true;document.body.classList.add('dark');}
    const savedLang=localStorage.getItem('cinto_lang');
    if(savedLang) lang=savedLang;
  }catch(e){}
}
function saveCustom(){const c=tools.filter(x=>x.custom);localStorage.setItem('cinto_c',JSON.stringify(c));}
function saveFavs(){localStorage.setItem('cinto_f',JSON.stringify(favs));}
function saveRecent(){localStorage.setItem('cinto_r',JSON.stringify(recent));}
function saveNotes(){localStorage.setItem('cinto_n',JSON.stringify(notes));}

// ── HELPERS ──────────────────────────────────────────────
function t(){return TXT[lang];}
function TB(){return dark?TBD:TBL;}
function getFiltered(){
  let list=tools;
  if(activeCat==='fav') list=list.filter(x=>favs.includes(x.id));
  else if(activeCat==='rec') list=list.filter(x=>recent.includes(x.id));
  else if(activeCat!=='all') list=list.filter(x=>x.category===activeCat);
  const q=document.getElementById('search').value.toLowerCase();
  if(q) list=list.filter(x=>(x.name[lang]||'').toLowerCase().includes(q)||(x.desc[lang]||'').toLowerCase().includes(q));
  return list.filter(x=>activeTypes.includes(x.type));
}
function getGrouped(filtered){
  if(activeCat!=='all'&&activeCat!=='fav'&&activeCat!=='rec') return{[activeCat]:filtered};
  const g={};filtered.forEach(x=>{if(!g[x.category])g[x.category]=[];g[x.category].push(x);});return g;
}
function getSelected(){return tools.find(x=>x.id===selId)||null;}
function formatDate(){return new Date().toLocaleDateString('pt-BR');}

// ── TOGGLES ──────────────────────────────────────────────
function toggleDark(){
  dark=!dark;
  document.body.classList.toggle('dark',dark);
  localStorage.setItem('cinto_dark',dark);
  document.getElementById('btn-dark').textContent=dark?t().light:t().dark;
  var mb=document.getElementById('mob-btn-dark');
  if(mb) mb.textContent=dark?'☀️':'🌙';
}
function toggleLang(){
  lang=lang==='pt'?'en':'pt';
  localStorage.setItem('cinto_lang',lang);
  var ml=document.getElementById('mob-btn-lang');
  if(ml) ml.textContent=TXT[lang].lang;
  renderAll();
}
function toggleType(tp){
  if(activeTypes.includes(tp)){
    if(activeTypes.length>1) activeTypes=activeTypes.filter(x=>x!==tp);
  } else {
    activeTypes=[...activeTypes,tp];
  }
  renderFilters();renderList();
}

// ── RESIZE ───────────────────────────────────────────────
(function(){
  const rz=document.getElementById('det-rz');
  rz.addEventListener('mousedown',function(e){
    e.preventDefault();
    rz.classList.add('drag');
    const startX=e.clientX, startW=detWidth;
    function onMove(ev){
      const delta=startX-ev.clientX;
      detWidth=Math.min(600,Math.max(240,startW+delta));
      document.getElementById('det').style.width=detWidth+'px';
    }
    function onUp(){rz.classList.remove('drag');document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);}
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });
})();

// ── RENDER ───────────────────────────────────────────────
function renderAll(){
  // App name
  document.getElementById('app-name').textContent=t().app;
  document.getElementById('app-sub').textContent=t().sub;
  document.getElementById('btn-dark').textContent=dark?t().light:t().dark;
  document.getElementById('btn-lang').textContent=t().lang;
  document.getElementById('search').placeholder=t().search;
  document.getElementById('click-hint').textContent=t().click;
  document.getElementById('add-btn')||0;
  renderNav();renderFilters();renderList();renderDetail();
}

function renderNav(){
  const nav=document.getElementById('nav');
  let html=`<div class="nl">${t().cat||'Categorias'}</div>`;
  html+=navItem('all','📦',t().all,tools.length);
  CO.forEach(c=>{const n=tools.filter(x=>x.category===c).length;if(n) html+=navItem(c,CI[c],t().CL[c],n);});
  html+=`<div class="nd"></div>`;
  html+=navItem('fav','⭐',t().fav,favs.length);
  html+=navItem('rec','🕐',t().rec,'');
  html+=`<div class="nd"></div>`;
  html+=`<div class="ni${activeCat==='models'?' on':''}" onclick="setCat('models')">📋 Modelos<span class="nb">${FORMS_DATA.length}</span></div>`;
  nav.innerHTML=html;
}
function navItem(id,icon,label,count){
  const on=activeCat===id?' on':'';
  return`<div class="ni${on}" onclick="setCat('${id}')">${icon} ${label}<span class="nb">${count}</span></div>`;
}
function setCat(id){
  activeCat=id;
  document.getElementById('deep-tool').style.display='none';
  document.getElementById('deep-ex').style.display='none';
  var isModels=id==='models';
  document.getElementById('list').style.display=isModels?'none':'';
  if(!isModels){
    document.getElementById('det').style.display='';
  } else {
    document.getElementById('det').style.display='none';
  }
  // On mobile, also ensure det doesn't float above models
  if(isMobile()){
    var det=document.getElementById('det');
    if(isModels){
      det.classList.remove('mob-open');
    }
  }
  var mv=document.getElementById('models-view');
  if(mv){mv.style.display=isModels?'flex':'';}
  if(isModels){renderModels();}
  renderNav();
  if(!isModels) renderList();
  var label=id==='all'?t().all:id==='fav'?t().fav:id==='rec'?t().rec:id==='models'?'Modelos':t().CL[id]||id;
  document.getElementById('top-title').textContent=label;
  var mt=document.getElementById('mob-top-title');
  if(mt) mt.textContent=label;
  closeSidebar();
}

function renderFilters(){
  const fts=document.getElementById('filters');
  const types=['metodologia','metodo','ferramenta','artefato','tecnica'];
  fts.innerHTML=types.map(tp=>{
    const on=activeTypes.includes(tp);
    const style=on?`background:${TB()[tp]};color:${TC[tp]};border-color:${TC[tp]}`:'';
    return`<button class="fc" onclick="toggleType('${tp}')" style="${style}">${t().TL[tp]}</button>`;
  }).join('');
}

function renderList(){
  const filtered=getFiltered();
  const grouped=getGrouped(filtered);
  const list=document.getElementById('list');
  document.getElementById('top-count').textContent=filtered.length+' '+t().cnt;
  
  if(!filtered.length){
    list.innerHTML=`<div class="emp">🔍 ${t().noR||'Nenhuma ferramenta encontrada.'}</div>`;
    return;
  }
  let html='';
  CO.filter(c=>grouped[c]?.length).forEach(c=>{
    html+=`<div class="ch">${CI[c]} ${t().CL[c]}</div><div class="cards">`;
    grouped[c].forEach(tool=>{
      const sel=selId===tool.id?' sel':'';
      const fav=favs.includes(tool.id)?'<span class="fd">⭐</span>':'';
      html+=`<div class="card${sel}" onclick="selectTool('${tool.id}')">
        ${fav}
        <div class="cn">${tool.name[lang]}</div>
        <div class="co2">${(tool.origin||'').split(' — ')[0]}</div>
        <span class="tag" style="background:${TB()[tool.type]};color:${TC[tool.type]}">${t().TL[tool.type]}</span>
      </div>`;
    });
    html+='</div>';
  });
  list.innerHTML=html;
}

function selectTool(id){
  selId=id;
  addingEx=false;
  recent=[id,...recent.filter(x=>x!==id)].slice(0,10);
  saveRecent();
  // Ensure models-view is hidden
  var mv=document.getElementById('models-view');
  if(mv) mv.style.display='none';
  document.getElementById('list').style.display='';
  document.getElementById('det').style.display='';
  renderList();
  renderDetail();
  openMobDetail();
}

function renderDetail(){
  const det=document.getElementById('det');
  const tool=getSelected();
  if(!tool){
    det.innerHTML=`<div class="mob-det-back mob-det-back-hide" onclick="closeMobDetail()">← Voltar</div><div class="det-rz" id="det-rz" title="Arraste para redimensionar"></div><div class="de"><div class="dei">👆</div><div class="det2">${t().click}</div></div>`;
    initResize();return;
  }
  const dc=DEEP_CONTENT[tool.id];
  const dex=DEEP_EXAMPLES[tool.id];
  const isFav=favs.includes(tool.id);
  const stepItems=(tool.steps[lang]||[]).map((s,i)=>`<div class="step"><div class="sn">${i+1}</div><div class="st">${s}</div></div>`).join('');
  const exItems=(tool.examples||[]).map(function(ex,i){
    var dx=dex&&dex[i];
    var btn=dx?'<button class="ex-deep-btn" data-tid="'+tool.id+'" data-idx="'+i+'">Saiba mais</button>':'';
    return'<div class="exi"><div class="exn">Exemplo '+(i+1)+'</div><div class="ext">'+escHtml(ex)+'</div>'+btn+'</div>';
  }).join('');;
  const whoChips=(tool.who||[]).map(w=>`<span class="wc">${w}</span>`).join('');
  
  det.innerHTML=`
    <div class="mob-det-back" onclick="closeMobDetail()">← Voltar para lista</div>
    <div class="det-rz" id="det-rz" title="Arraste para redimensionar"></div>
    <div class="db">
      <span class="dtag" style="background:${TB()[tool.type]};color:${TC[tool.type]}">${t().TL[tool.type]}</span>
      <div class="dn">${tool.name[lang]}</div>
      <div class="dor">📍 ${tool.origin||''}</div>
      <div class="dds">${tool.desc[lang]||''}</div>
      ${dc?`<button class="btn bl" style="margin-bottom:12px" onclick="openDeepTool('${tool.id}')">${t().learnT}</button>`:''}
      <div class="dsec"><div class="dst">${t().who}</div><div class="wl">${whoChips}</div></div>
      <div class="dsec"><div class="dst">${t().steps}</div>${stepItems}</div>
      <div class="dsec">
        <div class="dst">${t().exs}</div>
        ${exItems}
        ${addingEx?`
          <div class="aef">
            <textarea id="ex-input" placeholder="${t().FL.ph}"></textarea>
            <div class="ebr">
              <button class="btn bp" style="flex:1" onclick="saveEx()">Salvar</button>
              <button class="btn bg2" style="flex:1" onclick="cancelEx()">Cancelar</button>
            </div>
          </div>
        `:`<button class="aet" onclick="startAddEx()">${t().addEx}</button>`}
      </div>
      ${selId==='entrevista-profundidade'?`
      <div class="dsec">
        <div class="dst">📋 MODELOS PARA USAR EM CAMPO</div>
        ${renderModelsAccordion()}
      </div>`:''}
      ${selId==='shadowing'?`
      <div class="dsec">
        <div class="dst">🎯 CANVAS DE SHADOWING</div>
        ${renderShadowingCanvas()}
      </div>`:''}
      <div class="da">
        <button class="btn ba" onclick="openClaude('${tool.id}')">${t().claude}</button>
        <button class="btn bf${isFav?' on':''}" onclick="toggleFav('${tool.id}')">${isFav?'⭐ '+t().saved:'☆ '+t().saveFav}</button>
      </div>
    </div>`;
  initResize();
}

function initResize(){
  const rz=document.getElementById('det-rz');
  if(!rz)return;
  rz.addEventListener('mousedown',function(e){
    e.preventDefault();rz.classList.add('drag');
    const startX=e.clientX,startW=detWidth;
    function onMove(ev){detWidth=Math.min(600,Math.max(240,startW+(startX-ev.clientX)));document.getElementById('det').style.width=detWidth+'px';}
    function onUp(){rz.classList.remove('drag');document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);}
    document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
  });
}

// ── DEEP TOOL VIEW ───────────────────────────────────────
function openDeepTool(id){
  const tool=tools.find(x=>x.id===id);
  const dc=DEEP_CONTENT[id];
  if(!tool||!dc)return;
  const sectionsHtml=dc.sections.map(s=>`
    <div class="dsec2"><div class="dstl">${s.title}</div><div class="dsb">${escHtml(s.body)}</div></div>
  `).join('');
  const toolNotes=notes[id]||[];
  const notesHtml=toolNotes.map((n,i)=>`
    <div class="note-card">
      <div class="note-card-top">
        ${n.title?`<div class="note-title">${escHtml(n.title)}</div>`:'<div style="flex:1"></div>'}
        <div class="note-date">${n.createdAt}</div>
        <button class="note-del" onclick="deleteNote('${id}',${n.id})">🗑</button>
      </div>
      ${n.text?`<div class="note-text">${escHtml(n.text)}</div>`:''}
      ${n.img?`<img class="note-img" src="${n.img}" alt="${n.imgName||''}"/><div class="note-img-name">${n.imgName||''}</div>`:''}
    </div>
  `).join('');
  
  const dv=document.getElementById('deep-tool');
  dv.innerHTML=`
    <div class="dh">
      <button class="dbk" onclick="closeDeep('deep-tool')">${t().back}</button>
      <span class="dtag" style="background:${TB()[tool.type]};color:${TC[tool.type]}">${t().TL[tool.type]}</span>
      <span class="dti">${tool.name[lang]}</span>
    </div>
    <div class="dbody">
      <div class="di">${escHtml(dc.intro)}</div>
      ${sectionsHtml.replace('__MODELS_ACCORDION__', renderModelsAccordion())}
      <div class="notes-section">
        <div class="notes-header">
          <span class="notes-title">✏️ ${t().notes}</span>
          <span class="notes-count" id="notes-count-${id}">${toolNotes.length} nota${toolNotes.length!==1?'s':''}</span>
        </div>
        <div id="notes-list-${id}">${notesHtml}</div>
        <div id="note-form-area-${id}">
          <button class="note-add-btn" onclick="showNoteForm('${id}')">${t().noteAdd}</button>
        </div>
      </div>
    </div>`;
  dv.style.display='flex';
  dv.style.flexDirection='column';
  dv.scrollTop=0;
}

function showNoteForm(id){
  noteImg=null;noteImgName='';
  document.getElementById('note-form-area-'+id).innerHTML=`
    <div class="note-form">
      <input class="note-input" id="nf-title-${id}" placeholder="${t().noteTitle}"/>
      <textarea class="note-textarea" id="nf-text-${id}" placeholder="${t().noteText}"></textarea>
      <div class="note-img-upload">
        <label class="note-img-label" for="nf-img-${id}">🖼 <span id="nf-img-lbl-${id}">${t().noteImg}</span></label>
        <input type="file" id="nf-img-${id}" accept="image/*" style="display:none" onchange="handleNoteImg('${id}',this)"/>
        <span id="nf-img-rm-${id}"></span>
      </div>
      <img id="nf-preview-${id}" style="display:none;max-width:100%;max-height:200px;border-radius:8px;margin-top:6px"/>
      <div class="note-btns">
        <button class="note-save" onclick="saveNote('${id}')">${t().noteSave}</button>
        <button class="note-cancel" onclick="cancelNote('${id}')">${t().noteCancel}</button>
      </div>
    </div>`;
}

function handleNoteImg(id,input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    noteImg=ev.target.result;noteImgName=file.name;
    document.getElementById('nf-img-lbl-'+id).textContent='✓ '+file.name;
    const prev=document.getElementById('nf-preview-'+id);
    prev.src=noteImg;prev.style.display='block';
    document.getElementById('nf-img-rm-'+id).innerHTML=`<span style="font-size:11px;color:#DC2626;cursor:pointer" onclick="removeNoteImg('${id}')">✕ remover</span>`;
  };reader.readAsDataURL(file);
}
function removeNoteImg(id){noteImg=null;noteImgName='';document.getElementById('nf-img-lbl-'+id).textContent=t().noteImg;document.getElementById('nf-preview-'+id).style.display='none';document.getElementById('nf-img-rm-'+id).innerHTML='';}

function saveNote(id){
  const title=document.getElementById('nf-title-'+id)?.value.trim()||'';
  const text=document.getElementById('nf-text-'+id)?.value.trim()||'';
  if(!text&&!noteImg)return;
  const note={id:Date.now(),title,text,img:noteImg,imgName:noteImgName,createdAt:formatDate()};
  if(!notes[id])notes[id]=[];
  notes[id].push(note);
  saveNotes();
  // Re-open to refresh
  openDeepTool(id);
}
function deleteNote(toolId,noteId){
  if(!notes[toolId])return;
  notes[toolId]=notes[toolId].filter(n=>n.id!==parseInt(noteId));
  saveNotes();
  openDeepTool(toolId);
}
function cancelNote(id){
  noteImg=null;noteImgName='';
  document.getElementById('note-form-area-'+id).innerHTML=`<button class="note-add-btn" onclick="showNoteForm('${id}')">${t().noteAdd}</button>`;
}

// ── DEEP EXAMPLE VIEW ────────────────────────────────────
function openDeepEx(toolId,exIdx){
  const tool=tools.find(x=>x.id===toolId);
  const dex=DEEP_EXAMPLES[toolId];
  if(!tool||!dex||!dex[exIdx])return;
  const ex=dex[exIdx];
  const fields=[
    {k:'ctx',icon:'📍',text:ex.context},
    {k:'prob',icon:'🔴',text:ex.problem},
    {k:'proc',icon:'🔬',text:ex.process},
    {k:'sol',icon:'💡',text:ex.solution},
    {k:'res',icon:'📊',text:ex.result},
    {k:'learn',icon:'🎯',text:ex.learning}
  ];
  const dv=document.getElementById('deep-ex');
  dv.innerHTML=`
    <div class="dh">
      <button class="dbk" onclick="closeDeep('deep-ex')">${t().back}</button>
      <span style="font-size:12px;color:var(--mu)">${tool.name[lang]} →</span>
      <span class="dti" style="font-size:13px">${ex.title}</span>
    </div>
    <div class="exdb">
      <div class="exds">${escHtml(ex.summary)}</div>
      ${fields.map(f=>`<div class="exb"><div class="exbt"><span>${f.icon}</span>${t()[f.k]}</div><div class="exbb">${escHtml(f.text)}</div></div>`).join('')}
      <div class="exb exlrn"><div class="exbt"><span>🎯</span>${t().lrn}</div><div class="exbb">${escHtml(ex.learning)}</div></div>
    </div>`;
  dv.style.display='flex';dv.style.flexDirection='column';dv.scrollTop=0;
  // On mobile, also scroll deep view to top and ensure it's visible
  if(isMobile()){
    dv.scrollTop=0;
    // make sure the detail panel doesn't show through
    document.getElementById('det').style.zIndex='140';
  }
}

function closeDeep(id){
  document.getElementById(id).style.display='none';
  // Restore det z-index on mobile
  if(isMobile()){
    document.getElementById('det').style.zIndex='150';
  }
}

// ── ACTIONS ──────────────────────────────────────────────
function startAddEx(){addingEx=true;renderDetail();}
function cancelEx(){addingEx=false;renderDetail();}
function saveEx(){
  const val=document.getElementById('ex-input')?.value.trim();
  if(!val||!selId)return;
  const tool=getSelected();
  if(tool){
    tool.examples=[...tool.examples,val];
    saveCustom();
    addingEx=false;
    renderDetail();
  }
}
function toggleFav(id){
  favs=favs.includes(id)?favs.filter(f=>f!==id):[...favs,id];
  saveFavs();
  renderNav();renderDetail();
}
function openClaude(id){
  const tool=tools.find(x=>x.id===id);
  if(!tool)return;
  const q=encodeURIComponent('Me dê uma aula completa sobre '+tool.name[lang]+' com exemplos reais, passo a passo detalhado e casos práticos');
  // In electron, open external browser
  if(window.require){
    const {shell}=window.require('electron');
    shell.openExternal('https://claude.ai/new?q='+q);
  } else {
    window.open('https://claude.ai/new?q='+q,'_blank');
  }
}

// ── MODAL ────────────────────────────────────────────────
function openModal(){document.getElementById('modal').classList.add('show');}
function closeModal(){document.getElementById('modal').classList.remove('show');}
function saveNewTool(){
  const name=document.getElementById('nt-name').value.trim();
  if(!name)return;
  const id='custom-'+Date.now();
  const stepsRaw=document.getElementById('nt-steps').value;
  const tool={
    id,custom:true,
    type:document.getElementById('nt-type').value,
    category:document.getElementById('nt-cat').value,
    name:{pt:name,en:name},
    origin:document.getElementById('nt-origin').value,
    desc:{pt:document.getElementById('nt-desc').value,en:document.getElementById('nt-desc').value},
    steps:{pt:stepsRaw.split('\n').filter(Boolean),en:stepsRaw.split('\n').filter(Boolean)},
    examples:document.getElementById('nt-example').value?[document.getElementById('nt-example').value]:[],
    who:document.getElementById('nt-who').value.split(',').map(s=>s.trim()).filter(Boolean)
  };
  tools=[...tools,tool];
  saveCustom();
  closeModal();
  selId=id;
  renderAll();
}

function renderModels(){
  const q=(document.getElementById('models-search').value||'').toLowerCase();
  let total=0;
  const fmap={};
  FORMS_DATA.forEach(f=>{fmap[f.num]=f;});

  let html='';
  let anyCatVisible=false;

  FORMS_CATS.forEach(cat=>{
    const filtered=cat.forms
      .map(n=>fmap[n])
      .filter(f=>f && (!q || f.title.toLowerCase().includes(q) || f.desc.toLowerCase().includes(q)));
    if(!filtered.length) return;
    total+=filtered.length;
    anyCatVisible=true;
    const isOpen=q || cat.id===openCat;
    html+=`<div class="cat-accordion" id="acc-${cat.id}">
      <div class="cat-accordion-hd" onclick="toggleCat('${cat.id}')">
        <span class="cat-accordion-icon">${cat.icon}</span>
        <span class="cat-accordion-label">${cat.label}</span>
        <span class="cat-accordion-count">${filtered.length}</span>
        <span class="cat-accordion-arrow${isOpen?' open':''}">▶</span>
      </div>
      <div class="cat-accordion-body${isOpen?' open':''}">
        <div class="form-cards">
          ${filtered.map(f=>`
            <div class="form-card">
              <div class="form-card-num">FORMULÁRIO ${f.num}</div>
              <div class="form-card-title">${f.title}</div>
              <div class="form-card-desc">${f.desc}</div>
              <div class="form-card-meta">${f.meta}</div>
              <a class="form-card-btn" href="${f.url}" target="_blank">Abrir no Google Forms ↗</a>
            </div>`).join('')}
        </div>
      </div>
    </div>`;
  });

  if(!anyCatVisible){
    html='<div class="models-empty"><span style="font-size:28px">🔍</span>Nenhum formulário encontrado.</div>';
  }

  document.getElementById('models-body').innerHTML=html;
  document.getElementById('models-count').textContent=total+' formulários';
}

let openCat='ux';
function toggleCat(id){
  if(openCat===id){openCat='';}else{openCat=id;}
  renderModels();
}


function renderModelsAccordion(){
  const fmap={};
  FORMS_DATA.forEach(f=>{fmap[f.num]=f;});
  let out='<div class="ma-wrap">';
  FORMS_CATS.forEach((cat,ci)=>{
    const forms=cat.forms.map(n=>fmap[n]).filter(Boolean);
    if(!forms.length) return;
    const isFirst=ci===0;
    out+=`<div class="ma-cat" id="mac-${cat.id}">
      <div class="ma-cat-hd" onclick="toggleMaCat('${cat.id}')">
        <span>${cat.icon}</span>
        <span class="ma-cat-label">${cat.label}</span>
        <span class="ma-cat-badge">${forms.length} modelo${forms.length>1?'s':''}</span>
        <span class="ma-cat-arrow${isFirst?' open':''}" id="maa-${cat.id}">▶</span>
      </div>
      <div class="ma-cat-body${isFirst?' open':''}" id="mab-${cat.id}">
        <div class="ma-cards">
          ${forms.map(f=>`
            <div class="ma-card">
              <div class="ma-card-num">FORMULÁRIO ${f.num}</div>
              <div class="ma-card-title">${f.title}</div>
              <div class="ma-card-desc">${f.desc}</div>
              <div class="ma-card-meta">${f.meta}</div>
              <a class="ma-card-btn" href="${f.url}" target="_blank">Abrir no Google Forms ↗</a>
            </div>`).join('')}
        </div>
      </div>
    </div>`;
  });
  out+='</div>';
  return out;
}

function toggleMaCat(id){
  const body=document.getElementById('mab-'+id);
  const arrow=document.getElementById('maa-'+id);
  if(!body) return;
  const isOpen=body.classList.contains('open');
  // close all
  document.querySelectorAll('.ma-cat-body').forEach(el=>el.classList.remove('open'));
  document.querySelectorAll('.ma-cat-arrow').forEach(el=>el.classList.remove('open'));
  if(!isOpen){body.classList.add('open');arrow.classList.add('open');}
}


// ── SHADOWING CANVAS ────────────────────────────────────────
const SH_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1PxwYaE2UQHln-lSPDvRuAkAZ8687OheCWPzS-z84-V0/edit';

function shGetSessions(){
  try{return JSON.parse(localStorage.getItem('sh_sessions')||'[]');}catch{return[];}
}
function shSaveSessions(s){localStorage.setItem('sh_sessions',JSON.stringify(s));}

function renderShadowingCanvas(){
  const sessions=shGetSessions();
  const recent=sessions.slice(-3).reverse();

  const recentHtml=recent.length>0?
    '<div class="sh-sessions">'+
    '<div class="sh-sessions-title">Últimas sessões salvas</div>'+
    recent.map(function(s){
      return '<div class="sh-session-item" onclick="shLoadSession(&quot;'+s.id+'&quot;)">'+
        '<span class="sh-session-dot'+(s.status==='Rascunho'?' draft':'')+'"></span>'+
        '<span style="flex:1"><strong>'+(s.projeto||'Sem projeto')+'</strong> · '+(s.participante||'?')+' · '+s.data+'</span>'+
        '<span style="color:var(--mu)">'+s.status+'</span>'+
        '</div>';
    }).join('')+
    '</div>'
    :'';

  return '<div class="sh-canvas">'+
    '<div class="sh-canvas-header">'+
      '<span class="sh-canvas-title">Preencha durante ou após a observação</span>'+
      '<a class="sh-btn-sheet" href="'+SH_SHEET_URL+'" target="_blank">📊 Ver planilha ↗</a>'+
    '</div>'+
    '<div class="sh-meta">'+
      '<div class="sh-meta-field"><label class="sh-meta-label">Projeto</label><input class="sh-meta-input" id="sh-projeto" placeholder="Ex: Portal Discente UEMA"/></div>'+
      '<div class="sh-meta-field"><label class="sh-meta-label">Pesquisador</label><input class="sh-meta-input" id="sh-pesquisador" placeholder="Seu nome"/></div>'+
      '<div class="sh-meta-field"><label class="sh-meta-label">Código do Participante</label><input class="sh-meta-input" id="sh-participante" placeholder="Ex: P01"/></div>'+
      '<div class="sh-meta-field"><label class="sh-meta-label">Cargo / Função</label><input class="sh-meta-input" id="sh-cargo" placeholder="Ex: Técnico Administrativo"/></div>'+
      '<div class="sh-meta-field"><label class="sh-meta-label">Local</label><input class="sh-meta-input" id="sh-local" placeholder="Ex: CTIC — sala de suporte"/></div>'+
      '<div class="sh-meta-field"><label class="sh-meta-label">Duração (min)</label><input class="sh-meta-input" id="sh-duracao" type="number" placeholder="45"/></div>'+
    '</div>'+
    '<div class="sh-blocks">'+
      '<div class="sh-block"><div class="sh-block-hd"><span class="sh-block-icon">📍</span><span class="sh-block-label">01 · Contexto</span></div>'+
        '<textarea class="sh-block-ta" id="sh-b01" placeholder="Ambiente, equipamentos visíveis, quem mais está presente, hora do dia..."></textarea></div>'+
      '<div class="sh-block"><div class="sh-block-hd"><span class="sh-block-icon">🔄</span><span class="sh-block-label">02 · Sequência de Ações</span></div>'+
        '<textarea class="sh-block-ta" id="sh-b02" placeholder="O que a pessoa fez, em que ordem, quanto tempo cada etapa, quais ferramentas usou..."></textarea></div>'+
      '<div class="sh-block"><div class="sh-block-hd"><span class="sh-block-icon">⚡</span><span class="sh-block-label">03 · Momentos Críticos</span></div>'+
        '<textarea class="sh-block-ta" id="sh-b03" placeholder="Onde hesitou, pediu ajuda, desviou do processo oficial, usou gambiarras..."></textarea></div>'+
      '<div class="sh-block"><div class="sh-block-hd"><span class="sh-block-icon">💬</span><span class="sh-block-label">04 · Citações Relevantes</span></div>'+
        '<textarea class="sh-block-ta" id="sh-b04" placeholder="O que disse em voz alta, reações emocionais observadas..."></textarea></div>'+
      '<div class="sh-block"><div class="sh-block-hd"><span class="sh-block-icon">🔀</span><span class="sh-block-label">05 · Gaps (Dito vs Feito)</span></div>'+
        '<textarea class="sh-block-ta" id="sh-b05" placeholder="O que disse que faria vs o que realmente fez. Contradições observadas..."></textarea></div>'+
      '<div class="sh-block"><div class="sh-block-hd"><span class="sh-block-icon">💡</span><span class="sh-block-label">06 · Insights e Próximos Passos</span></div>'+
        '<textarea class="sh-block-ta" id="sh-b06" placeholder="O que surpreendeu, hipóteses levantadas, o que investigar mais..."></textarea></div>'+
    '</div>'+
    '<div class="sh-actions">'+
      '<button class="sh-btn-save" id="sh-btn-save" onclick="shSaveSession()">💾 Salvar sessão</button>'+
      '<button class="sh-btn-new" onclick="shNewSession()">+ Nova</button>'+
    '</div>'+

    recentHtml+
    '</div>';
}

function shNewSession(){
  ['sh-projeto','sh-pesquisador','sh-participante','sh-cargo','sh-local','sh-duracao',
   'sh-b01','sh-b02','sh-b03','sh-b04','sh-b05','sh-b06'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.value='';
  });
  var fb=document.getElementById('sh-feedback');
  if(fb) fb.innerHTML='';
}

function shLoadSession(id){
  var sessions=shGetSessions();
  var s=sessions.find(function(x){return x.id===id;});
  if(!s)return;
  var map={
    'sh-projeto':s.projeto,'sh-pesquisador':s.pesquisador,
    'sh-participante':s.participante,'sh-cargo':s.cargo,
    'sh-local':s.local,'sh-duracao':s.duracao,
    'sh-b01':s.contexto,'sh-b02':s.acoes,'sh-b03':s.momentos,
    'sh-b04':s.citacoes,'sh-b05':s.gaps,'sh-b06':s.insights
  };
  Object.keys(map).forEach(function(k){
    var el=document.getElementById(k);
    if(el) el.value=map[k]||'';
  });
}

async function shSaveSession(){
  var btn=document.getElementById('sh-btn-save');
  var fb=document.getElementById('sh-feedback');
  if(btn){btn.disabled=true;btn.textContent='Salvando...';}

  var now=new Date();
  var data=now.toLocaleDateString('pt-BR');
  var hora=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  var id='SH-'+Date.now();

  var session={
    id:id, data:data,
    projeto: (document.getElementById('sh-projeto')||{}).value||'',
    pesquisador: (document.getElementById('sh-pesquisador')||{}).value||'',
    participante: (document.getElementById('sh-participante')||{}).value||'',
    cargo: (document.getElementById('sh-cargo')||{}).value||'',
    local: (document.getElementById('sh-local')||{}).value||'',
    duracao: (document.getElementById('sh-duracao')||{}).value||'',
    contexto: (document.getElementById('sh-b01')||{}).value||'',
    acoes: (document.getElementById('sh-b02')||{}).value||'',
    momentos: (document.getElementById('sh-b03')||{}).value||'',
    citacoes: (document.getElementById('sh-b04')||{}).value||'',
    gaps: (document.getElementById('sh-b05')||{}).value||'',
    insights: (document.getElementById('sh-b06')||{}).value||'',
    status:'Completo', criadoEm:data+' '+hora
  };

  var sessions=shGetSessions();
  sessions.push(session);
  shSaveSessions(sessions);

  var row=[
    session.id,session.data,session.projeto,session.pesquisador,
    session.participante,session.cargo,session.local,session.duracao,
    session.contexto,session.acoes,session.momentos,session.citacoes,
    session.gaps,session.insights,session.status,session.criadoEm
  ].map(function(v){return (v||'').replace(/\t/g,' ').replace(/\n/g,' | ');});

  var tsv=row.join('\t');
  var copied=false;
  try{await navigator.clipboard.writeText(tsv);copied=true;}catch(e){}

  if(fb){
    fb.className='sh-feedback ok';
    fb.innerHTML=copied
      ? '✅ Sessão salva! Dados copiados — cole na <a href="'+SH_SHEET_URL+'" target="_blank" style="color:#059669">planilha ↗</a> na próxima linha.'
      : '✅ Sessão salva localmente. <a href="'+SH_SHEET_URL+'" target="_blank" style="color:#059669">Abrir planilha ↗</a>';
  }

  if(btn){btn.disabled=false;btn.textContent='💾 Salvar sessão';}
  setTimeout(function(){renderDetail();},800);
}

document.addEventListener('click',function(e){
  var btn=e.target.closest?e.target.closest('.ex-deep-btn'):null;
  if(!btn && e.target.classList.contains('ex-deep-btn')) btn=e.target;
  if(btn){openDeepEx(btn.getAttribute('data-tid'),parseInt(btn.getAttribute('data-idx')));}
