  "entrevista-profundidade": {
    intro: `A entrevista em profundidade é o método de pesquisa mais poderoso do arsenal do designer — e o mais frequentemente mal executado. A diferença entre uma boa e uma ruim entrevista não está nas perguntas que você faz. Está no que você faz com o silêncio, com as contradições, com o que a pessoa NÃO disse mas claramente pensa.

O objetivo de uma entrevista em profundidade não é coletar opiniões. É entender o mundo como o entrevistado o vê — com suas lógicas, seus medos, suas soluções improvisadas, suas frustrações que ele nem sabe nomear. É etnografia aplicada ao design.

5 usuários bem entrevistados revelam mais que 500 respostas de questionário. Não porque o número seja mágico — mas porque a profundidade do insight qualitativo tem uma natureza diferente do dado quantitativo. Um dado diz "30% dos usuários abandonam na etapa 3". Uma boa entrevista explica POR QUÊ.`,
    sections: [
      { title: "A estrutura de uma boa entrevista",
        body: `ANTES (preparação)
1. Defina as questões de pesquisa — o que você precisa entender, não as perguntas que vai fazer
2. Crie um roteiro com 5 a 8 temas, não 20 perguntas fechadas
3. Comece com perguntas de contexto e abertura (fale sobre sua rotina...)
4. Reserve as perguntas mais sensíveis para o meio/fim da entrevista
5. Sempre termine com "tem algo que você gostaria de me perguntar ou adicionar?"

DURANTE (execução)
→ Gravação com permissão explícita
→ Dois pesquisadores quando possível (um conduz, outro anota)
→ Silêncio é seu aliado — não preencha toda pausa
→ "Pode me contar mais sobre isso?" é a pergunta mais valiosa
→ Nunca valide ou invalide o que o entrevistado diz

DEPOIS (análise)
→ Transcreva ou anote os pontos principais nas primeiras 2 horas após a entrevista
→ Identifique citações-chave que captura o sentimento ou insight central
→ Procure contradições entre o que a pessoa disse e o que descreveu que faz
→ Após 5-8 entrevistas, analise os padrões em grupo (affinity mapping)` },
      { title: "As armadilhas da pergunta direta",
        body: `"O que você quer que o nosso produto faça?"
Parece uma pergunta óbvia. É uma armadilha.

As pessoas não sabem o que querem até experimentar. Pedem "cavalos mais rápidos" quando precisam de carros. Pedem "botão de busca melhorada" quando o problema real é que não entendem como o conteúdo está organizado.

Perguntas que você deve evitar:
→ Perguntas fechadas (sim/não) — "Você usa o app todos os dias?"
→ Perguntas hipotéticas — "O que você faria se...?"
→ Perguntas que sugestionam a resposta — "Você concorda que a interface é confusa?"
→ Perguntas sobre o futuro — "O que você gostaria que o produto fizesse?"

Perguntas que revelam comportamento real:
→ "Me conta a última vez que você usou [serviço/produto]."
→ "O que aconteceu antes de você decidir [ação]?"
→ "Você pode me mostrar como você normalmente faz isso?"
→ "Teve algum momento em que ficou frustrado? Me conta."` },
      { title: "Quantas entrevistas são suficientes?",
        body: `A resposta canônica de Jakob Nielsen é 5 — cinco usuários revelam 85% dos problemas de usabilidade. Mas isso é para testes de usabilidade, não para entrevistas exploratórias.

Para pesquisa qualitativa de design, a resposta real é: até a saturação.

Saturação acontece quando você começa a ouvir as mesmas histórias, os mesmos problemas, as mesmas soluções improvisadas. Quando a décima entrevista não acrescenta nenhum dado novo, você chegou à saturação.

Na prática:
→ 5-8 entrevistas por persona ou segmento de usuário
→ Mais se você tem múltiplos segmentos com características muito diferentes
→ Menos se as primeiras entrevistas forem muito homogêneas e você atingir saturação rápido

O que nunca fazer: fazer 1 ou 2 entrevistas e tratar como representativas.` },
      { title: "Erros mais comuns",
        body: `ERRO 1 — Transformar em questionário oral
Criar 20 perguntas fechadas e ler uma por uma. O resultado é um questionário com voz, não uma entrevista.

ERRO 2 — Não deixar o entrevistado conduzir
A conversa deve seguir o que é relevante para o entrevistado, não a sequência do roteiro. O roteiro é uma âncora, não um trilho.

ERRO 3 — Confirmar hipóteses em vez de questionar
Entrar na entrevista com uma conclusão já formada e usar as perguntas para confirmá-la. Uma boa entrevista deveria poder desfazer suas hipóteses iniciais.

ERRO 4 — Não gravar (ou não transcrever)
A memória é seletiva. Você vai lembrar do que confirmou suas crenças, não do que as desafiou. Grave sempre que possível, com permissão.

ERRO 5 — Entrevistar no ambiente errado
Uma entrevista sobre uso de app feita em sala de reunião é diferente de uma feita com a pessoa usando o app no contexto real. O ambiente importa.` }
    ,{ title: "📌 EXEMPLO 1 — IDEO e o carrinho de supermercado: a entrevista revelou o que o questionário nunca revelaria",
        body: `Em 1999, a IDEO usou entrevistas em profundidade com compradores e funcionários de supermercado para redesenhar o carrinho — e descobriu que o problema real não estava onde ninguém estava olhando.

CONTEXTO
A equipe da IDEO precisava entender profundamente como as pessoas usam carrinhos de supermercado antes de propor qualquer redesign. Em vez de aplicar um questionário de satisfação, foram a campo para entrevistar e observar.

O QUE AS ENTREVISTAS REVELARAM
Pergunta de questionário típica: "Você está satisfeito com o carrinho de supermercado?" Resposta previsível: "Sim, funciona."

O que as entrevistas em profundidade revelaram:
— Pais com filhos pequenos passavam a compra inteira gerenciando a segurança das crianças, não focados nas compras
— Funcionários empurravam 20 a 30 carrinhos ao mesmo tempo nos corredores, causando acidentes
— Compradores frequentemente perdiam itens no fundo do cesto único e só descobriam no caixa
— Ninguém havia sido perguntado sobre esses problemas antes — eles eram vistos como "parte do processo"

COMO A ENTREVISTA FOI CONDUZIDA
A equipe não perguntou "o que você acha do carrinho?" Perguntou: "Me conta como foi sua última compra com seu filho." "O que você fez quando chegou no caixa e o item não estava lá?" "Mostre-me como você normalmente organiza o que vai colocar no carrinho."

Perguntas abertas, centradas em comportamento real e passado — não em opiniões ou hipóteses.

RESULTADO DA PESQUISA
Os insights levaram ao conceito de cestas modulares removíveis, área para crianças, scanner acoplado. Nenhuma dessas soluções teria surgido de um questionário de satisfação.

APLICAÇÃO PARA A CTIC/UEMA
Antes de reformular o sistema de chamados, o portal do estudante ou o processo de matrícula, as perguntas não são "você está satisfeito?" mas sim: "Me conta o que aconteceu na última vez que você precisou abrir um chamado. O que você fez primeiro? O que travou? O que você fez para contornar?" As respostas revelarão problemas que nenhum formulário de satisfação captura.` },
      { title: "📌 EXEMPLO 2 — Airbnb: entrevistas que salvaram a empresa",
        body: `Em 2009, o Airbnb estava prestes a falhar. Paul Graham do Y Combinator sugeriu que os fundadores parassem de olhar para dados e fossem conversar com os usuários. O que descobriram mudou tudo.

CONTEXTO
O Airbnb tinha usuários cadastrados em Nova York, mas as reservas eram baixíssimas. Os fundadores olhavam para os números e não entendiam o problema. Os dados diziam que havia oferta e demanda — mas as conversões não aconteciam.

A ENTREVISTA QUE MUDOU TUDO
Os fundadores foram pessoalmente a Nova York e entrevistaram os anfitriões — as pessoas que listavam propriedades para aluguel. Não enviaram questionário. Foram bater na porta e conversar.

O que descobriram: as fotos das propriedades eram horríveis. Tiradas com câmeras de celular ruim, mal iluminadas, mal enquadradas. Os hóspedes em potencial viam as fotos e não confiavam o suficiente para reservar.

A solução foi tão simples quanto contraintuitiva: os próprios fundadores pegaram uma câmera profissional emprestada e foram fotografar os apartamentos listados em Nova York.

RESULTADO
Em uma semana, as reservas em Nova York dobraram. Nenhuma análise de dados teria revelado isso. Só a conversa direta com os usuários — perguntando sobre o processo real de decisão de reserva — tornou o problema visível.

O Airbnb depois escalou isso criando um serviço profissional de fotografia para anfitriões. Mas o insight original veio de duas pessoas batendo em portas e fazendo perguntas.

APLICAÇÃO PARA A CTIC/UEMA
Quando um serviço digital da universidade não está sendo usado como esperado, antes de redesenhar a interface ou trocar o sistema, a pergunta mais valiosa é: "O que acontece na sua cabeça quando você vai usar este serviço? O que te impede de avançar?" A resposta pode estar em um detalhe invisible nos dados.` },
      { title: "📌 EXEMPLO 3 — Spotify: entrevistas que moldaram o Discover Weekly",
        body: `O Discover Weekly — a playlist personalizada mais famosa do Spotify — não foi inventado por um algoritmo. Foi inventado por uma pesquisadora que fez a pergunta certa para os usuários certos.

CONTEXTO
O Spotify tinha capacidade técnica para criar playlists personalizadas há anos. O que faltava era entender qual problema emocional o usuário queria resolver com isso.

AS ENTREVISTAS
A equipe de pesquisa conduziu entrevistas em profundidade com usuários que tinham comportamentos atípicos de escuta — pessoas que criavam muitas playlists manuais e as atualizavam frequentemente.

As perguntas não eram sobre funcionalidades: eram sobre a relação emocional com a música. "Me conta como você descobre músicas novas." "O que acontece quando você encontra uma música que parece feita para você?" "Como você se sente quando um amigo indica uma música perfeita?"

O QUE EMERGIU
Os usuários descreveram uma experiência específica e emocional: a sensação de que alguém que te conhece profundamente escolheu músicas especificamente para você. Não "músicas populares que você pode gostar" — mas "músicas que parecem que foram escolhidas por um amigo que te conhece há anos."

Esse insight emocional definiu não só o que o Discover Weekly deveria entregar, mas como deveria ser apresentado: atualização semanal (cria antecipação), nome que evoca curadoria humana, não "recomendações" mas "sua playlist da semana".

RESULTADO
O Discover Weekly tornou-se o produto mais viral da história do Spotify, com 40 milhões de usuários na primeira semana após o lançamento. O algoritmo foi refinado depois — mas a direção nasceu de entrevistas.

APLICAÇÃO PARA A CTIC/UEMA
Ao pesquisar como os estudantes se relacionam com os serviços digitais da universidade, as perguntas sobre experiência emocional revelam mais que as perguntas sobre funcionalidades. "Como você se sente quando precisa resolver algo com a universidade?" tem mais poder diagnóstico que "você está satisfeito com o nosso portal?"`}

  "shadowing": {
    intro: `O shadowing é o método mais honesto da pesquisa de design. Enquanto entrevistas capturam o que as pessoas dizem, e questionários capturam o que as pessoas reportam, o shadowing captura o que as pessoas fazem — com todas as contradições, gambiarras e soluções improvisadas que isso implica.

O nome vem da ideia de seguir alguém como uma sombra — presente, observando, sem alterar o comportamento. O pesquisador não pergunta o que a pessoa faria em determinada situação. Ele observa o que ela faz quando a situação acontece de verdade.

Esta diferença entre o dito e o feito é uma das descobertas mais consistentes da pesquisa de comportamento humano: as pessoas frequentemente não sabem (ou não conseguem articular) o que realmente fazem. Não é desonestidade — é que boa parte do comportamento humano é automática, pré-consciente, e invisível para quem o pratica.`,
    sections: [
      { title: "Tipos de shadowing",
        body: `SHADOWING PURO (não participante)
O pesquisador observa sem interagir. Anota o que vê, fotografa quando permitido, registra tempos e sequências. O usuário age como se o pesquisador não estivesse ali — ou tenta.

Melhor para: entender processos naturais sem interferência. Risco: o efeito do observador — as pessoas mudam o comportamento quando sabem que estão sendo observadas.

SHADOWING COM NARRAÇÃO (contextual inquiry)
O usuário narra o que está fazendo enquanto faz. "Agora estou abrindo o app... estou procurando o botão de pedido... não estou encontrando onde fica..."

Melhor para: entender o processo mental por trás das ações. Combina o que a pessoa faz com o que ela pensa enquanto faz.

SHADOWING COM ENTREVISTA INTEGRADA
O pesquisador interrompe nos momentos críticos para perguntar sobre o que acabou de acontecer. "Por que você clicou aqui? O que você esperava que acontecesse?"

Melhor para: aprofundar os momentos de atrito ou de solução criativa identificados durante a observação.

WORK-ALONG
Pesquisador "trabalha junto" com o usuário/funcionário por um período — de algumas horas a dias. Mais imersivo que o shadowing clássico, mais próximo da etnografia participante.

Melhor para: entender culturas organizacionais, processos complexos, o conhecimento tácito de especialistas.` },
      { title: "O que observar e como registrar",
        body: `O QUE OBSERVAR
→ O que a pessoa faz (ações concretas e sequências)
→ O que ela não faz (o passo que pula, a funcionalidade que ignora)
→ As gambiarras (quando ela contorna o sistema para resolver um problema)
→ As pausas e hesitações (onde trava, onde pensa antes de agir)
→ O ambiente físico e social (quem mais está presente? o que está ao redor?)
→ As emoções visíveis (frustração, alívio, confusão, satisfação)

COMO REGISTRAR
→ Caderno de campo: notas rápidas durante a observação
→ Fotografia: com permissão explícita. Captura o ambiente e os artefatos físicos
→ Vídeo: mais rico, mais invasivo. Use quando o comportamento é muito rápido para anotar
→ Mapa de movimento: esboço do espaço com as rotas que o usuário percorreu
→ Timeline: cronologia das ações com horários

SEPARAR OBSERVAÇÃO DE INTERPRETAÇÃO
Uma nota de campo bem feita distingue: "a usuária olhou três vezes para a tela antes de clicar" (observação) vs. "a usuária estava confusa sobre onde clicar" (interpretação). Ambas são válidas — mas não devem se misturar no registro.` },
      { title: "Desafios éticos e práticos",
        body: `CONSENTIMENTO
Sempre necessário. Explique o objetivo da pesquisa, o que vai ser registrado, como os dados serão usados e que a pessoa pode interromper quando quiser. Em ambientes organizacionais, pode ser necessário consentimento da instituição além do individual.

O EFEITO DO OBSERVADOR
As pessoas mudam o comportamento quando sabem que estão sendo observadas — tendem a seguir mais os procedimentos formais, cometer menos "infrações" e ser mais cuidadosas. Este efeito diminui com o tempo: depois de 30-60 minutos, a maioria das pessoas começa a agir naturalmente de novo. Sessões mais longas são mais ricas.

AMBIENTES SENSÍVEIS
Hospitais, escolas, repartições públicas e ambientes corporativos têm considerações específicas de privacidade. Pode ser necessário aprovação formal além do consentimento individual (CETIC, IRB, comitê de ética).

ANÁLISE DOS DADOS
O shadowing gera muito dado qualitativo e pouco estruturado. A análise exige tempo: revisão das notas, categorização de comportamentos, identificação de padrões. Nunca subestime o tempo de análise — é frequentemente maior que o tempo de campo.` }
    ,{ title: "📌 EXEMPLO 1 — Bank of America: shadowing de clientes em agências",
        body: `O Bank of America observou clientes usando agências bancárias em tempo real — e descobriu que o problema não estava onde os gerentes pensavam.

CONTEXTO
O Bank of America queria redesenhar a experiência nas agências físicas para reduzir o tempo de espera. A hipótese inicial da gestão: o problema eram as filas. A solução proposta: adicionar mais caixas.

O QUE O SHADOWING REVELOU
Uma equipe de pesquisadores passou dias acompanhando clientes desde o momento em que chegavam na agência até saírem. Não entrevistaram. Não aplicaram questionários. Observaram.

Descoberta 1: a maior parte do tempo de espera não era na fila do caixa — era no momento em que o cliente chegava no guichê sem saber exatamente o que precisava ou sem ter os documentos corretos. O atendente parava, explicava, o cliente saía, voltava.

Descoberta 2: clientes que usavam o ATM antes de falar com um atendente completavam o atendimento 40% mais rápido — mas quase ninguém fazia isso porque não sabia que poderia.

Descoberta 3: o pior momento emocional do cliente não era a espera — era não saber quanto tempo faltava.

SOLUÇÃO
Redesenho do fluxo de entrada: um "greeter" na porta para direcionar clientes, sinalização clara sobre o que cada canal resolve, monitor com tempo de espera estimado. A solução custou 10% do que adicionaria um novo caixa — e reduziu o tempo médio de atendimento em 20%.

APLICAÇÃO PARA A CTIC/UEMA
Antes de propor soluções para o suporte de TI da universidade, acompanhe um técnico durante um dia inteiro de trabalho. Observe: onde ele para, o que consulta, o que improvisa, quando frustra. O que você verá em campo será diferente do que qualquer relatório ou conversa revelaria.` },
      { title: "📌 EXEMPLO 2 — Microsoft: shadowing de trabalhadores do conhecimento",
        body: `A Microsoft usou shadowing extensivo para entender como trabalhadores reais usavam o Office — e as descobertas contrariaram completamente as suposições da equipe de produto.

CONTEXTO
A equipe de produto do Microsoft Office queria entender quais funcionalidades adicionar ao Word e ao Excel. A abordagem inicial: analisar quais botões eram mais clicados nos logs de uso.

O QUE OS DADOS NÃO MOSTRAVAM
Os logs de uso mostravam quais funções eram usadas. O shadowing mostrou como e por quê — e revelou padrões completamente invisíveis nos dados.

Descoberta 1 — O problema das 11 versões
Pesquisadores acompanharam profissionais de marketing durante uma semana. Descobriram que as pessoas salvavam versões do mesmo documento com nomes como "proposta_final", "proposta_final2", "proposta_FINAL_versao3_revisada". Havia uma necessidade enorme e não atendida de controle de versão — que nenhum log de cliques revelaria.

Descoberta 2 — O Excel como banco de dados
Muitas equipes usavam planilhas Excel como substitutos de bancos de dados para gerenciar projetos, clientes e processos. O Excel não foi projetado para isso, mas era o que as pessoas tinham disponível. Essa observação influenciou diretamente o desenvolvimento do SharePoint e depois do Teams.

Descoberta 3 — O tempo gasto formatando
Pesquisadores cronometraram quanto tempo profissionais passavam formatando documentos que depois seriam impressos e nunca mais abertos. A resposta levou a uma revisão completa dos estilos e templates padrão.

RESULTADO
As observações de campo influenciaram diretamente o roadmap do Office por anos. Funcionalidades como co-autoria em tempo real, histórico de versões e comentários vieram diretamente de necessidades observadas em campo — não de pesquisas de opinião.

APLICAÇÃO PARA A CTIC/UEMA
Acompanhe um servidor técnico-administrativo durante meio período. Observe quais sistemas ele usa, em qual ordem, onde copia e cola informações entre sistemas, onde anota algo no papel porque o sistema não guarda. Cada uma dessas gambiarras é uma oportunidade de melhoria.` },
      { title: "📌 EXEMPLO 3 — IDEO: shadowing em salas de emergência",
        body: `A IDEO acompanhou médicos, enfermeiros e pacientes em salas de emergência para redesenhar o fluxo de atendimento — e descobriu que o problema crítico acontecia em um momento que ninguém havia identificado antes.

CONTEXTO
Um sistema de saúde contratou a IDEO para melhorar a experiência de atendimento nas UPAs. O briefing inicial focava em tecnologia: melhorar o sistema de triagem eletrônica.

O QUE O SHADOWING REVELOU
Pesquisadores passaram dias em salas de emergência, acompanhando cada pessoa: paciente ao chegar, durante a triagem, na espera, no atendimento médico, ao sair.

Momento crítico 1 — A transição triagem-espera
O momento mais angustiante para o paciente não era a dor. Era o silêncio depois da triagem: ninguém explicava o que aconteceria a seguir, quanto tempo levaria, ou o que significava a cor que tinham recebido. Pacientes e acompanhantes ficavam em silêncio absoluto, sem saber se haviam sido esquecidos.

Momento crítico 2 — O handoff médico-enfermeiro
Quando o médico terminava de avaliar e passava o caso para o enfermeiro executar, informações críticas se perdiam. O enfermeiro não sabia o nível de dor atual do paciente, não sabia quais perguntas o médico havia feito, não tinha contexto sobre o histórico do dia.

Momento crítico 3 — A saída sem orientação
Pacientes saíam sem entender claramente o que deviam fazer em casa. Quando retornavam 2 dias depois com o mesmo problema, o ciclo recomeçava.

SOLUÇÕES
Sinalização verbal obrigatória após a triagem explicando os próximos passos. Formulário padronizado de handoff médico-enfermeiro. Folha de saída simplificada com instruções em linguagem não técnica.

APLICAÇÃO PARA A CTIC/UEMA
O equivalente na universidade é acompanhar um estudante tentando resolver um problema pela primeira vez — seja emitir um histórico, abrir um chamado de TI, ou solicitar uma bolsa. Observe onde ele para, o que busca no Google, quem ele liga para pedir ajuda. Cada parada é um problema de design.`}

  "card-sorting": {
    intro: `O Card Sorting é uma das técnicas mais simples e mais reveladoras da pesquisa de UX. A premissa é direta: você escreve os conteúdos, funcionalidades ou categorias do seu produto em cartões — físicos ou digitais — e pede para usuários organizá-los da forma que fizer mais sentido para eles.

O que torna o Card Sorting poderoso é exatamente o que parece ser sua fraqueza: você não diz para o usuário como organizar. Você observa como ele naturalmente categoriza o mundo. E frequentemente descobre que a forma como os usuários agrupam informação é radicalmente diferente da forma como sua equipe imaginou que eles fariam.

A técnica foi popularizada no campo de Arquitetura de Informação nos anos 1990, quando a explosão da web trouxe o desafio de organizar grandes volumes de conteúdo de forma que usuários pudessem encontrar o que procuravam. Ela permanece relevante porque o problema central não mudou: como estruturar informação para que faça sentido para quem a usa, não para quem a cria.`,
    sections: [
      { title: "Tipos de Card Sorting",
        body: `CARD SORTING ABERTO
Usuários agrupam os cartões livremente E criam os nomes para cada grupo.

Quando usar: quando você ainda não tem uma estrutura de navegação e quer descobrir como os usuários naturalmente categorizam o conteúdo. Ideal para projetos novos ou redesenhos completos.

O que revela: os modelos mentais dos usuários — como eles pensam sobre o conteúdo, que vocabulário usam, quais itens consideram relacionados.

CARD SORTING FECHADO
Os grupos já estão definidos. Os usuários apenas alocam os cartões nas categorias existentes.

Quando usar: quando você já tem uma estrutura de navegação proposta e quer validar se os usuários conseguem encontrar itens nos lugares esperados. Ideal para validação antes do lançamento.

O que revela: se sua estrutura atual faz sentido para os usuários, ou onde existem discrepâncias.

CARD SORTING HÍBRIDO
Os grupos principais estão definidos, mas os usuários podem criar novos grupos se precisarem.

Quando usar: quando você tem uma estrutura parcial mas quer permitir que os usuários a expandam. Equilibra validação com descoberta.` },
      { title: "Como planejar e executar",
        body: `PLANEJAMENTO
→ Selecione 30-40 itens (mais que isso cansa o usuário; menos pode não ser representativo)
→ Use linguagem dos usuários, não jargão interno da organização
→ Inclua itens de diferentes níveis de hierarquia para ver como os usuários os relacionam
→ Teste seus cartões com 1-2 pessoas antes para garantir que os itens são compreensíveis

EXECUÇÃO PRESENCIAL
→ Imprima os itens em cartões físicos (index cards funcionam bem)
→ Dê os cartões embaralhados ao usuário
→ Peça que agrupe como fizer sentido e nomeie os grupos
→ Anote em voz alta: "pode pensar em voz alta enquanto organiza?"
→ Ao final, faça perguntas sobre as escolhas mais interessantes

EXECUÇÃO DIGITAL
Ferramentas como Maze, Optimal Workshop (OptimalSort) e UXtweak permitem Card Sorting remoto. Vantagem: acesso a mais participantes, análise automática de dados. Desvantagem: perde o contexto da verbalização.

RECRUTAMENTO
→ 15-20 participantes para Card Sorting aberto (variabilidade alta, precisa de mais para identificar padrões)
→ 20-30 para Card Sorting fechado (análise estatística mais robusta)
→ Sempre recrute do público-alvo real — não use colegas de trabalho` },
      { title: "Análise dos resultados",
        body: `A análise de Card Sorting é onde a maioria das equipes se perde — porque os dados são complexos e a tentação de ver o que quer ver é grande.

MATRIZ DE SIMILARIDADE
A principal ferramenta analítica. Mostra com que frequência cada par de itens foi colocado no mesmo grupo. Itens com alta similaridade devem provavelmente estar juntos na navegação.

DENDROGRAMA
Representação visual hierárquica dos agrupamentos — mostra quais itens "gravitam" juntos. Ferramentas como OptimalSort geram automaticamente.

ANÁLISE QUALITATIVA DOS NOMES
Os nomes que os usuários deram para os grupos são tão importantes quanto os agrupamentos. Se 80% dos usuários chamou um grupo de "Minha conta" e sua navegação atual diz "Perfil", considere mudar.

ITENS PROBLEMÁTICOS
Itens que foram colocados em grupos muito diferentes por diferentes usuários revelam ambiguidade — o item pode ter múltiplos significados, ou pertencer a múltiplos contextos. Estes itens merecem atenção especial no design.` }
    ,{ title: "📌 EXEMPLO 1 — GOV.UK: Card Sorting para reorganizar serviços públicos",
        body: `O Government Digital Service do Reino Unido usou Card Sorting com milhares de cidadãos para reorganizar a arquitetura de informação do portal do governo — e os resultados contrariaram completamente a lógica organizacional interna.

CONTEXTO
O portal do governo britânico tinha sua estrutura de navegação organizada da forma que faz sentido para quem trabalha no governo: por departamento, por ministério, por órgão. "Serviços do Ministério da Saúde", "Serviços do DVLA", "Serviços do HMRC".

O problema: os cidadãos não pensam em termos de departamentos. Pensam em termos de tarefas e situações de vida.

O PROCESSO DE CARD SORTING
A equipe criou cards com todos os serviços disponíveis e pediu para cidadãos — não funcionários públicos — agrupá-los da forma que fizesse sentido para eles.

O que os cidadãos fizeram:
— Agruparam "renovar carteira de motorista", "pagar multa de trânsito" e "registrar um veículo" juntos — não importava que fossem de agências diferentes
— Agruparam "declarar imposto de renda", "solicitar benefício social" e "registrar nascimento" como "coisas que você faz em momentos importantes da vida"
— Separaram completamente serviços que internamente eram do mesmo departamento

RESULTADO
A nova arquitetura do GOV.UK foi organizada em torno de tarefas e situações de vida, não de departamentos. Isso reduziu o tempo médio para o cidadão encontrar o que precisava de 4 minutos para menos de 1 minuto. O site tornou-se referência mundial de design de informação governamental.

APLICAÇÃO PARA A CTIC/UEMA
O portal da UEMA provavelmente está organizado da forma que faz sentido para quem trabalha na universidade: por setor, por departamento, por pró-reitoria. Mas o estudante pensa em tarefas: "quero pegar meu histórico", "preciso trancar uma matéria", "quero saber sobre bolsas". Card Sorting com estudantes revelaria como reorganizar a navegação em torno de como eles pensam.` },
      { title: "📌 EXEMPLO 2 — Spotify: Card Sorting para organizar categorias musicais",
        body: `O Spotify usou Card Sorting para entender como usuários categorizam mentalmente a música — e descobriu que a taxonomia interna da indústria fonográfica era completamente diferente da forma como as pessoas realmente pensam em gêneros.

CONTEXTO
O Spotify precisava organizar sua biblioteca de mais de 50 milhões de músicas de forma que os usuários encontrassem o que queriam. A estrutura existente era herdada da indústria fonográfica: gêneros como "Rock Alternativo", "Pop Contemporâneo", "R&B Urbano".

O PROCESSO
Card Sorting com centenas de usuários: cada card tinha o nome de uma música ou artista. Os participantes agrupavam por qualquer critério que fizesse sentido para eles — e nomeavam os grupos.

O que emergiu:
— Usuários raramente agrupavam por gênero técnico. Agrupavam por humor/momento: "músicas para academia", "músicas para trabalhar focado", "músicas para quando estou triste"
— "Drake" e "The Weeknd" iam para o mesmo grupo em quase todas as sessões — mesmo sendo tecnicamente gêneros diferentes
— Usuários criavam categorias como "músicas que não me envergonho de ouvir na frente dos outros" — completamente invisível na taxonomia tradicional

RESULTADO
Isso influenciou diretamente o desenvolvimento das playlists contextuais (Chill, Focus, Workout) e do sistema de "moods" do Spotify — que hoje é um dos principais mecanismos de descoberta musical.

APLICAÇÃO PARA A CTIC/UEMA
O Card Sorting é particularmente valioso para reorganizar menus de sistemas internos. Se o sistema de chamados da CTIC tem categorias como "Infraestrutura", "Suporte", "Redes" — que fazem sentido para quem é de TI — um Card Sorting com usuários revelaria que eles pensam em termos de "meu computador não liga", "não consigo acessar o sistema", "minha senha não funciona".` },
      { title: "📌 EXEMPLO 3 — Nielsen Norman Group: Card Sorting em e-commerce",
        body: `Um estudo clássico do Nielsen Norman Group demonstrou como o Card Sorting revelou que usuários pensam sobre produtos de formas completamente diferentes de como os varejistas os organizam.

CONTEXTO
Um grande varejista online organizava seus produtos da forma tradicional do varejo: por categoria de produto. "Eletrônicos", "Eletrodomésticos", "Informática". Cada produto tinha seu lugar fixo na hierarquia.

O PROBLEMA
As taxas de conversão no site eram baixas e o search interno era muito usado — sinal claro de que as pessoas não conseguiam navegar pela estrutura existente.

O PROCESSO
Card Sorting aberto com 50 usuários. Cada card tinha o nome e uma pequena descrição de um produto. Os usuários criaram seus próprios grupos e nomes.

DESCOBERTAS INESPERADAS
— Uma cafeteira elétrica foi categorizada como "cozinha" por alguns, "eletrodomésticos" por outros e "presentes para casa" por um terceiro grupo — três jornadas de compra completamente diferentes para o mesmo produto
— Produtos de "segurança doméstica" foram agrupados tanto com "tecnologia" quanto com "família" — revelando dois perfis de comprador com motivações opostas
— Itens de decoração foram agrupados com móveis por uns e com "estilo de vida" por outros

RESULTADO
A reorganização baseada nos dados do Card Sorting aumentou as conversões em 18% e reduziu o uso do search interno em 32% — usuários passaram a navegar em vez de pesquisar, indicando que a estrutura começou a fazer sentido para eles.

APLICAÇÃO PARA A CTIC/UEMA
Se você for redesenhar o portal de serviços da UEMA, comece com um Card Sorting. Crie cards com todos os serviços disponíveis e peça para estudantes, servidores e professores agruparem da forma que faz sentido para eles. O resultado será a base para uma arquitetura de informação que reflete como os usuários pensam — não como a universidade se organiza internamente.`}
    ]
  },

  "persona": {
    intro: `A Persona é um dos artefatos mais utilizados e mais mal compreendidos do design centrado no usuário. Criada por Alan Cooper nos anos 1990 como parte de sua metodologia Goal-Directed Design, a persona é frequentemente reduzida a um cartão bonito com foto de stock e dados demográficos — e nessa redução perde quase toda a sua utilidade.

Uma persona real não é uma descrição demográfica. É um modelo comportamental: um arquétipo de usuário construído a partir de padrões identificados em pesquisa qualitativa real. A diferença entre "mulher, 35 anos, renda B, mora em São Paulo" e uma persona útil de design é a diferença entre uma ficha cadastral e um retrato humano.

O nome vem do latim persona — a máscara usada pelos atores no teatro grego. Uma persona de design é uma "máscara" que representa um grupo de usuários reais, permitindo que a equipe tome decisões de design em nome dessas pessoas mesmo quando elas não estão presentes.`,
    sections: [
      { title: "Persona vs. Proto-persona vs. Segmento de marketing",
        body: `SEGMENTO DE MARKETING
Baseado em dados demográficos e psicográficos. "Mulheres de 25-40 anos, classe B/C, interessadas em saúde e bem-estar." Útil para decisões de mídia e comunicação. Inútil para decisões de design — não diz nada sobre comportamentos, objetivos ou frustrações específicas.

PROTO-PERSONA
Criada internamente, sem pesquisa de campo. A equipe reúne o que "sabe" sobre os usuários e cria um perfil hipotético. Útil para alinhar suposições da equipe antes da pesquisa. Perigosa se tratada como persona real — é um chute organizado, não um dado.

PERSONA (REAL)
Baseada em pesquisa qualitativa com usuários reais. Os comportamentos, objetivos, frustrações e contextos descritos na persona vêm de dados de campo. Quando alguém questiona uma decisão de design, você pode dizer "a pesquisa mostrou que a Maria faz isso" — não "a gente acha que a Maria faz isso".

A distinção é crítica. Uma proto-persona que é tratada como persona real pode ser mais prejudicial que não ter persona nenhuma — cria falsa sensação de que o design é baseado em dados quando na verdade é baseado em suposições formalmente documentadas.` },
      { title: "Como construir uma persona real",
        body: `FASE 1 — COLETA DE DADOS
Realize 10-20 entrevistas em profundidade com usuários reais. Explore: rotinas, objetivos, frustrações, contextos de uso, soluções que já tentaram, vocabulário que usam. Complemente com shadowing quando possível.

FASE 2 — IDENTIFICAÇÃO DE PADRÕES
Analise as entrevistas buscando padrões de comportamento — não de demografia. Agrupe os comportamentos semelhantes. Exemplo: "pessoas que usam o serviço em momentos de crise" vs. "pessoas que usam como prevenção" — independente da idade ou renda.

FASE 3 — CRIAÇÃO DOS PERFIS
Para cada cluster comportamental, crie um perfil. Inclua:
→ Nome e foto (humaniza o arquétipo)
→ Contexto de vida relevante para o produto
→ Objetivos principais (o que ela quer alcançar)
→ Frustrações específicas (o que a impede)
→ Comportamentos relevantes (como ela age no contexto do produto)
→ Uma citação representativa (direto de uma das entrevistas)

FASE 4 — VALIDAÇÃO
Compartilhe os perfis com os usuários entrevistados. "Você se reconhece nessa descrição?" Se não, o que está errado? Ajuste.

FASE 5 — INCORPORAÇÃO NO PROCESSO
A persona só tem valor se for usada. Cole na parede do escritório. Use como critério em decisões: "A Maria usaria isso? Como a Maria encontraria essa funcionalidade?"` },
      { title: "Quantas personas criar?",
        body: `A resposta depende da complexidade do produto e da diversidade dos usuários — mas a regra geral é: menos é mais.

1-2 personas: adequado para a maioria dos produtos focados. Força a equipe a priorizar o usuário principal.

3-4 personas: aceitável quando o produto serve segmentos muito distintos com objetivos diferentes.

5+ personas: quase sempre um sinal de que a equipe não conseguiu sintetizar — está criando personas para cada entrevistado em vez de identificar padrões.

Uma persona primária (o usuário mais importante, aquele para quem você otimiza) e uma ou duas secundárias (que não podem ser completamente ignoradas) é uma estrutura que funciona bem para a maioria dos projetos.

Atenção especial: personas negativas. Às vezes é útil criar uma persona de quem NÃO é seu usuário — para evitar que a equipe comece a otimizar para todos e não otimize bem para ninguém.` },
      { title: "Erros mais comuns",
        body: `ERRO 1 — Criar sem pesquisa
O erro mais comum e mais grave. Personas criadas em workshop interno são proto-personas, não personas. Úteis para alinhar hipóteses, perigosas se tratadas como dados reais.

ERRO 2 — Foco em demografia em vez de comportamento
"Tem 35 anos, mora em São Paulo, usa iPhone" não guia nenhuma decisão de design. "Toma decisões de compra rapidamente sem pesquisar muito" guia muitas.

ERRO 3 — Criar e guardar numa gaveta
Personas que não são usadas ativamente no processo de design são desperdício de pesquisa. Elas devem ser consultadas em reuniões de produto, em sessões de ideação, em revisões de design.

ERRO 4 — Não atualizar
O comportamento dos usuários muda. Personas criadas há mais de 2 anos sem revisão podem estar desatualizadas — especialmente em mercados que mudam rápido.

ERRO 5 — Criar uma persona para cada stakeholder feliz
"Marketing quer a persona A, o CEO quer a persona B, TI quer a persona C." Personas que existem para fazer todo mundo feliz internamente não servem para guiar o design. Priorize.` }
      ,{ title: "📌 EXEMPLO 1 — Airbnb: anfitriões ansiosos vs. experientes",
        body: `A pesquisa de personas do Airbnb revelou que tratar todo anfitrião como um único usuário genérico estava fazendo a plataforma perder pessoas logo na primeira experiência de hospedagem.

CONTEXTO
O Airbnb crescia rapidamente e precisava aumentar o número de anfitriões ativos na plataforma. A equipe de produto tratava "anfitrião" como um único tipo de usuário, com uma única jornada de onboarding.

PROBLEMA IDENTIFICADO
A taxa de abandono era alta logo nas primeiras semanas após o cadastro. A hipótese inicial era que o processo de cadastro tinha muitas etapas — mas os dados de uso não confirmavam isso sozinho.

PROCESSO
A equipe conduziu entrevistas em profundidade com dezenas de anfitriões em diferentes estágios. Ao analisar os padrões, não por demografia, mas por comportamento e estado emocional, dois clusters muito distintos emergiram: anfitriões ansiosos (na primeira hospedagem, cheios de dúvidas sobre segurança, preço e o que fazer se algo desse errado) e anfitriões experientes (já confiantes, buscando otimizar ganhos e automatizar tarefas).

Essas duas personas tinham necessidades quase opostas na mesma etapa do produto: um precisava de tranquilização e suporte passo a passo; o outro precisava de ferramentas avançadas e menos fricção.

SOLUÇÃO DESENVOLVIDA
Onboarding diferenciado por perfil comportamental: para o anfitrião ansioso, mensagens de apoio, checklist de segurança e contato facilitado com suporte; para o experiente, atalhos, precificação dinâmica e menos telas de confirmação.

RESULTADO
Ao desenhar para as duas personas separadamente em vez de uma média genérica entre elas, o Airbnb conseguiu reduzir o abandono na primeira experiência de hospedagem, sem comprometer a eficiência para quem já sabia usar a plataforma.

APLICAÇÃO PARA A CTIC/UEMA
Um servidor recém-contratado usando um sistema institucional pela primeira vez tem necessidades muito diferentes de um servidor veterano. Um único fluxo de onboarding "médio" para os dois normalmente não serve bem a nenhum dos dois.` }
      ,{ title: "📌 EXEMPLO 2 — Hospital: a mãe com filho com febre às 3h",
        body: `Uma única persona, construída a partir de entrevistas reais, revelou que o problema de um sistema de agendamento hospitalar não era falta de horários — era incerteza emocional.

CONTEXTO
Um hospital investia em um sistema de agendamento de consultas pediátricas, mas a central de emergência continuava recebendo ligações de pais para casos que não eram emergências reais.

PROBLEMA IDENTIFICADO
A equipe de produto assumia que o problema era falta de horários disponíveis no sistema de agendamento online.

PROCESSO
Entrevistas com pais que haviam ligado recentemente para a emergência revelaram um padrão comportamental muito específico, sintetizado na persona "mãe com filho com febre às 3h da manhã": ela não estava procurando um horário de consulta — estava procurando alguém que dissesse se aquilo era grave ou não, naquele exato momento.

A persona deixou claro: o objetivo dela não era "agendar uma consulta". Era "reduzir a incerteza imediatamente".

SOLUÇÃO DESENVOLVIDA
Um canal de triagem rápida por chat, disponível 24h, com respostas orientativas simples ("procure a emergência agora" ou "pode aguardar a consulta de amanhã"), separado do fluxo normal de agendamento.

RESULTADO
Redução de ligações desnecessárias à central de emergência, porque o novo canal resolvia a real necessidade por trás do comportamento — incerteza, não falta de agenda.

APLICAÇÃO PARA A CTIC/UEMA
Quando um servidor abre um chamado urgente fora do prazo normal, ele muitas vezes não quer "abrir um chamado" — quer saber se aquilo é grave e o que fazer agora. A persona ajuda a enxergar essa diferença.` }
      ,{ title: "📌 EXEMPLO 3 — GOV.UK: o menor denominador de habilidade digital",
        body: `O time de design do governo digital britânico adota uma persona deliberadamente exigente: aquela com menos familiaridade com tecnologia — e desenha para ela primeiro.

CONTEXTO
O GOV.UK atende toda a população do Reino Unido, de jovens muito familiarizados com tecnologia a idosos que usam a internet apenas ocasionalmente.

PROBLEMA IDENTIFICADO
Um serviço público não pode se dar ao luxo de excluir quem tem menos familiaridade digital — diferente de um app de consumo, onde é aceitável focar só no usuário "médio" ou avançado.

PROCESSO
A equipe formalizou como princípio de design construir a persona do usuário com menor letramento digital e testar cada novo serviço com pessoas reais desse perfil antes do lançamento — não depois.

SOLUÇÃO DESENVOLVIDA
Linguagem simples obrigatória em todos os serviços, sem jargão técnico ou administrativo, fluxos lineares sem decisões ambíguas, e testes de usabilidade recorrentes com esse grupo específico como critério de aprovação do serviço.

RESULTADO
Serviços que funcionam bem para o usuário menos experiente tendem a funcionar bem para todos os outros também — o oposto raramente é verdade.

APLICAÇÃO PARA A CTIC/UEMA
Sistemas institucionais atendem desde estudantes recém-chegados até servidores próximos da aposentadoria. Desenhar pensando primeiro em quem tem menos familiaridade com tecnologia tende a criar sistemas mais robustos para todo mundo.` }
      ,{ title: "📌 EXEMPLO 4 — Netflix: personas de humor, não de pessoa",
        body: `A Netflix descobriu que a mesma pessoa se comporta como "personas" diferentes dependendo do momento do dia — e passou a desenhar para estados, não apenas para indivíduos fixos.

CONTEXTO
A recomendação de conteúdo da Netflix inicialmente tentava prever o que "aquele usuário" gostaria de assistir, com base no histórico acumulado da pessoa.

PROBLEMA IDENTIFICADO
Recomendações baseadas apenas no histórico geral do usuário frequentemente erravam o alvo — a mesma pessoa que assistia documentários sérios às 19h assistia comédias leves às 22h.

PROCESSO
Em vez de tratar cada usuário como uma persona fixa e única, a equipe passou a considerar "personas de humor": diferentes estados de disposição que a mesma pessoa assume em momentos diferentes do dia e da semana.

SOLUÇÃO DESENVOLVIDA
Sistema de recomendação sensível ao contexto (horário, dia da semana, padrão recente de sessões curtas ou longas), sugerindo conteúdos compatíveis com o estado provável da pessoa naquele momento, não apenas com seu perfil histórico geral.

RESULTADO
Recomendações mais relevantes percebidas pelos usuários, e maior tempo de engajamento por sessão.

APLICAÇÃO PARA A CTIC/UEMA
Um mesmo servidor pode usar o sistema de chamados de forma muito diferente às 8h de uma segunda-feira (planejando a semana) e às 17h de uma sexta-feira (resolvendo algo urgente antes de sair). Vale considerar que o "estado" do usuário muda, não só o perfil dele.` }
      ,{ title: "📌 EXEMPLO 5 — CTIC/UEMA: servidor técnico vs. usuário externo",
        body: `Ao construir personas internas, a CTIC descobriu que tratava dois grupos com necessidades opostas como se fossem o mesmo tipo de usuário.

CONTEXTO
A CTIC desenvolvia interfaces de sistemas internos pensando em um único perfil de usuário — geralmente alguém com familiaridade técnica razoável, próximo do próprio time de TI.

PROBLEMA IDENTIFICADO
Sistemas usados tanto por servidores técnicos (de outras áreas de TI da universidade) quanto por usuários externos (docentes, estudantes, terceirizados) recebiam reclamações opostas: uns achavam o sistema "básico demais", outros achavam "confuso e cheio de termos técnicos".

PROCESSO
Entrevistas curtas com os dois grupos revelaram personas com objetivos e vocabulário completamente diferentes: o servidor técnico queria eficiência e atalhos, e já entendia termos como "ticket", "SLA" e "chamado"; o usuário externo queria clareza passo a passo e não reconhecia nenhum desses termos — para ele, era só "pedir ajuda".

SOLUÇÃO DESENVOLVIDA
Dois modos de interface para sistemas de maior uso externo: uma visão simplificada, em linguagem cotidiana, para o usuário externo, e uma visão avançada, com mais controle e vocabulário técnico, para o servidor de TI.

RESULTADO
Redução de reclamações dos dois lados, porque cada grupo passou a interagir com uma versão pensada para o vocabulário e objetivo dele, em vez de uma média desconfortável para ambos.

APLICAÇÃO PARA A CTIC/UEMA
Antes de desenhar qualquer tela de sistema institucional, vale perguntar: este sistema serve times técnicos e usuários externos ao mesmo tempo? Se sim, provavelmente precisa de mais de uma persona — e possivelmente mais de uma interface.` }

  "mapa-empatia": {
    intro: `O Mapa de Empatia é uma ferramenta de síntese criada por Dave Gray e popularizada pelo Strategyzer (os criadores do Business Model Canvas). Ele parte de um pressuposto simples: para projetar algo útil para uma pessoa, você precisa entender não apenas o que ela faz, mas o que ela pensa, sente, vê e ouve.

A ferramenta organiza o que você sabe sobre um usuário em quatro quadrantes — PENSA E SENTE, VÊ, OUVE, DIZ E FAZ — mais dois elementos na parte inferior: DORES (o que a frustra, o que a impede) e GANHOS (o que a motiva, o que ela deseja alcançar).

O Mapa de Empatia é mais rápido que uma persona completa e mais profundo que um segmento demográfico. É especialmente útil como ferramenta de síntese após entrevistas — uma forma de organizar o que você aprendeu antes de partir para a definição do problema.`,
    sections: [
      { title: "Os 4 quadrantes em detalhe",
        body: `PENSA E SENTE (o que está na mente)
O mundo interior do usuário. Preocupações que não verbaliza, aspirações que tem mas não admite, medos que influenciam suas decisões. Esta dimensão captura o que está "por baixo" do comportamento visível.

Perguntas para preencher: O que realmente importa para ela? O que a mantém acordada à noite? Quais são seus sonhos e aspirações? O que ela sente mas não diz?

VÊ (o que percebe ao redor)
O ambiente visual e social do usuário. O que ela observa ao redor? Que experiências ela testemunha? Quem está à sua volta? Como é o seu ambiente de trabalho, sua cidade, sua casa?

Esta dimensão ajuda a entender o contexto — o que ela está experienciando no mundo ao redor que influencia suas decisões.

OUVE (influências externas)
Quem influencia o usuário? O que ela escuta de amigos, família, colegas? Que mídia consome? Que vozes têm autoridade na sua vida? O que as pessoas ao seu redor dizem sobre o tema relevante?

Esta dimensão captura as influências sociais e de mídia que moldam percepções e decisões.

DIZ E FAZ (comportamento visível)
O que ela diz em público? Como ela age? O que você observaria se passasse um dia com ela? Esta é a dimensão mais verificável — o comportamento visível que pode ser observado diretamente.

Atenção crucial: o quadrante DIZ E FAZ frequentemente está em contradição com o quadrante PENSA E SENTE. Pessoas dizem "estou bem" quando estão preocupadas. Dizem "vou começar na semana que vem" quando não vão. Essas contradições são os insights mais valiosos.` },
      { title: "Dores e Ganhos",
        body: `DORES (parte inferior esquerda)
As dores são obstáculos, frustrações, medos e riscos que o usuário enfrenta. Elas respondem à pergunta: "O que a impede de alcançar o que deseja?"

Tipos de dores:
→ Funcionais: a ferramenta não funciona como esperado
→ Sociais: preocupação com como os outros a veem
→ Emocionais: ansiedade, frustração, medo
→ Colaterais: consequências negativas que ela teme

GANHOS (parte inferior direita)
Os ganhos são resultados desejados, benefícios esperados e aspirações. Elas respondem à pergunta: "O que ela realmente quer alcançar?"

Tipos de ganhos:
→ Funcionais: uma tarefa que precisa ser feita
→ Sociais: como ela quer ser vista pelos outros
→ Emocionais: como ela quer se sentir
→ Econômicos: o que ela quer poupar ou ganhar

A relação entre Dores e Ganhos é o coração da proposta de valor: uma boa solução alivia dores significativas e cria ganhos desejados.` },
      { title: "Quando usar o Mapa de Empatia",
        body: `MELHOR USO
→ Síntese rápida após 3-5 entrevistas (1-2 horas de workshop)
→ Alinhamento de equipe sobre quem é o usuário antes de idear
→ Quando você não tem tempo para construir uma persona completa
→ Como complemento à persona — o mapa aprofunda a dimensão emocional

EM COMPARAÇÃO COM A PERSONA
A persona é mais completa e inclui mais contexto. O mapa de empatia é mais rápido e vai mais fundo na dimensão emocional. Os dois se complementam — o mapa pode alimentar a criação da persona, ou a persona pode ser enriquecida com um mapa para cada perfil.

COMO FERRAMENTA DE WORKSHOP
É excelente para workshops com stakeholders não-designers. Ao contrário da persona (que parece "técnica"), o Mapa de Empatia é intuitivo e convida qualquer pessoa a contribuir. Usar post-its, uma sessão de 60 minutos, resulta num artefato que toda a equipe sente que ajudou a criar.

ATENÇÃO
Um Mapa de Empatia criado sem pesquisa de campo é um mapa de suposições — não de empatia. Sempre deixe claro o que vem de dados reais e o que são hipóteses a validar.` }
      ,{ title: "📌 EXEMPLO 1 — Startup de saúde mental: 'não se sentir sozinho'",
        body: `O Mapa de Empatia revelou que o vocabulário de marketing da própria startup ("terapia", "tratamento") afastava exatamente as pessoas que ela tentava ajudar.

CONTEXTO
Uma startup de saúde mental via baixa conversão em sua campanha de aquisição, mesmo com alto volume de acessos à página inicial vindos de anúncios pagos.

PROBLEMA IDENTIFICADO
A equipe de marketing assumia que o problema era o preço do serviço ou a falta de confiança na marca, ainda pouco conhecida.

PROCESSO
Um Mapa de Empatia construído a partir de entrevistas com usuários reais que haviam abandonado o cadastro revelou, no quadrante DIZ E FAZ, que muitos evitavam ativamente a palavra "terapia" ao descrever o que procuravam — diziam coisas como "só queria alguém pra conversar" ou "não queria me sentir tão sozinho". No quadrante PENSA E SENTE, apareceu vergonha e medo de rótulo, não falta de dinheiro.

SOLUÇÃO DESENVOLVIDA
Reformulação de toda a comunicação da página inicial e dos anúncios, trocando linguagem clínica ("tratamento", "terapia") por linguagem emocional mais próxima do que os próprios usuários diziam sentir ("você não precisa passar por isso sozinho").

RESULTADO
Aumento na taxa de conversão da página inicial, sem qualquer mudança no preço ou no produto em si — apenas na linguagem, alinhada ao que o Mapa de Empatia havia revelado.

APLICAÇÃO PARA A CTIC/UEMA
Comunicações institucionais que usam termos técnicos internos ("ticket", "protocolo", "SLA") podem afastar servidores que só querem "ajuda com um problema". Vale mapear o vocabulário real que as pessoas usam, não o vocabulário interno da equipe de TI.` }
      ,{ title: "📌 EXEMPLO 2 — App de transporte: o medo não era o preço",
        body: `Um Mapa de Empatia construído com passageiras revelou que a maior barreira de uso não era financeira, mas a insegurança sobre a identidade do motorista.

CONTEXTO
Um aplicativo de transporte por aplicativo investigava por que uma parcela significativa de usuárias cadastradas usava o serviço raramente, mesmo com preços competitivos.

PROBLEMA IDENTIFICADO
A hipótese inicial da equipe comercial era sensibilidade a preço — a solução cogitada era criar mais promoções e descontos.

PROCESSO
Entrevistas mapeadas em um Mapa de Empatia mostraram, no quadrante PENSA E SENTE, um padrão recorrente de ansiedade: "será que é seguro entrar no carro de um estranho à noite?". No quadrante VÊ, muitas relataram checar repetidamente placa, modelo do carro e foto do motorista antes de embarcar, mesmo já tendo essas informações no app.

O medo real não era o preço da corrida — era não se sentir segura o suficiente para confiar na informação exibida.

SOLUÇÃO DESENVOLVIDA
Reforço visual da verificação de identidade do motorista (selo mais visível de "documento verificado"), opção de compartilhar a corrida em tempo real com um contato de confiança, e botão de emergência mais acessível na tela principal durante a viagem.

RESULTADO
Aumento no uso recorrente entre o público que antes evitava o serviço à noite, sem qualquer alteração de preço.

APLICAÇÃO PARA A CTIC/UEMA
Ao investigar baixa adesão a um sistema institucional, vale checar se a barreira real é prática (preço, tempo) ou emocional (medo de errar, vergonha de pedir ajuda, insegurança) — o Mapa de Empatia é a ferramenta certa para essa distinção.` }
      ,{ title: "📌 EXEMPLO 3 — EAD: abandono não era falta de tempo",
        body: `O Mapa de Empatia revelou que a principal causa de evasão em um curso EAD era vergonha de não entender o conteúdo sem poder perguntar — não falta de tempo, como o discurso dos próprios alunos sugeria.

CONTEXTO
Uma instituição de ensino a distância enfrentava alta taxa de evasão em cursos online, mesmo com conteúdo considerado de boa qualidade pela equipe pedagógica.

PROBLEMA IDENTIFICADO
Pesquisas de saída (survey simples ao cancelar) mostravam consistentemente "falta de tempo" como motivo mais citado — e a instituição já vinha tentando resolver isso com lembretes e flexibilização de prazos, sem sucesso.

PROCESSO
Um Mapa de Empatia construído a partir de entrevistas mais profundas com ex-alunos revelou uma camada abaixo da resposta superficial: no quadrante OUVE, apareciam comentários de colegas de turma presencial sobre "não entender nada de EAD"; no quadrante PENSA E SENTE, vergonha de fazer perguntas "básicas" num fórum público onde a resposta ficaria visível para todos.

"Falta de tempo" era, na prática, uma resposta socialmente mais aceitável do que admitir "fiquei perdido e tive vergonha de perguntar".

SOLUÇÃO DESENVOLVIDA
Canal de dúvidas privado e assíncrono entre aluno e tutor, sem exposição pública, além de pequenos vídeos de reforço opcionais para os pontos mais citados como confusos, sem que o aluno precisasse admitir publicamente a dificuldade.

RESULTADO
Redução na taxa de evasão nos módulos onde o canal privado foi testado, mesmo sem qualquer mudança nos prazos ou na carga horária do curso.

APLICAÇÃO PARA A CTIC/UEMA
Quando servidores ou estudantes dizem "não tive tempo" para usar um sistema ou seguir um tutorial, vale investigar com mais profundidade — pode haver vergonha ou insegurança escondida atrás dessa resposta mais confortável de dar.` }
      ,{ title: "📌 EXEMPLO 4 — Banco: animado com a possibilidade vs. frustrado com a burocracia",
        body: `Um único fluxo de abertura de conta gerava emoções opostas dependendo do momento da jornada — e o Mapa de Empatia tornou essa contradição visível.

CONTEXTO
Um banco digital investigava por que clientes elogiavam a proposta do produto nas pesquisas de marca, mas reclamavam do processo de abertura de conta nas avaliações de app.

PROBLEMA IDENTIFICADO
A equipe de produto via essas duas percepções como contraditórias e não sabia qual delas representava o cliente "de verdade".

PROCESSO
Um Mapa de Empatia dividido por etapa da jornada revelou que não havia contradição — havia uma emoção diferente em cada momento. No início do cadastro (quadrante PENSA E SENTE), o cliente estava animado com a possibilidade de ter mais controle financeiro. Na etapa de envio de documentos e validação, a mesma pessoa relatava frustração com a burocracia — pedidos repetidos de documentos já enviados, mensagens de erro pouco claras.

SOLUÇÃO DESENVOLVIDA
Redesenho apenas da etapa de validação de documentos, mantendo a comunicação animada e simples do início da jornada, com barra de progresso clara e mensagens de erro específicas (dizendo exatamente o que estava errado, não apenas "documento inválido").

RESULTADO
Melhora na avaliação do app nas lojas de aplicativo, mesmo sem alterar a etapa inicial de cadastro que já era bem avaliada.

APLICAÇÃO PARA A CTIC/UEMA
A mesma pessoa pode estar satisfeita com um sistema institucional em geral e, ainda assim, frustrada com uma etapa específica dele. Mapear a emoção por etapa da jornada, não a experiência como um todo, ajuda a mirar a correção no lugar certo.` }
      ,{ title: "📌 EXEMPLO 5 — CTIC/UEMA: a sensação de não ter suporte",
        body: `Um Mapa de Empatia interno revelou que servidores não reclamavam da tecnologia em si, mas da sensação de estarem sozinhos ao lidar com um problema técnico.

CONTEXTO
A CTIC recebia avaliações medianas em pesquisas de satisfação sobre seus sistemas internos, mesmo em sistemas que a equipe técnica considerava estáveis e sem bugs relevantes.

PROBLEMA IDENTIFICADO
A equipe de TI interpretava as notas medianas como indicativo de que os sistemas precisavam de mais funcionalidades ou uma interface mais moderna.

PROCESSO
Um Mapa de Empatia construído a partir de entrevistas curtas com servidores de diferentes setores revelou, no quadrante PENSA E SENTE, um padrão recorrente: não era o sistema em si que incomodava, mas a sensação de estar sozinho quando algo dava errado — não saber se o chamado havia sido visto, nem quando seria resolvido. No quadrante DIZ E FAZ, muitos relatavam abrir o mesmo chamado duas vezes "para garantir que alguém viu".

SOLUÇÃO DESENVOLVIDA
Notificações automáticas confirmando o recebimento do chamado e cada mudança de status, sem exigir nenhuma mudança técnica nos sistemas que geravam as reclamações originalmente.

RESULTADO
Melhora na percepção de suporte reportada em pesquisas seguintes, mesmo com os mesmos sistemas técnicos e os mesmos prazos reais de resolução de antes.

APLICAÇÃO PARA A CTIC/UEMA
Antes de investir em reescrever ou modernizar um sistema por conta de avaliações medianas, vale mapear se o problema é técnico mesmo ou se é a sensação de estar desacompanhado durante o processo — são soluções muito diferentes.` }
    ]
  },

  "jornada-usuario": {
    intro: `O Mapa de Jornada do Usuário (User Journey Map) é a ferramenta que transforma dados de pesquisa em uma narrativa visual da experiência do cliente ao longo do tempo. Ao contrário do Blueprint de Serviço — que mapeia tanto o que o cliente vive quanto o que acontece nos bastidores — a Jornada foca exclusivamente na perspectiva do usuário: o que ele faz, o que pensa e o que sente em cada momento da sua experiência.

A ferramenta existe porque as organizações tendem a ver suas interações com os clientes de forma fragmentada — cada departamento cuida do seu pedaço. A Jornada torna visível que o cliente não vive pedaços: ele vive uma experiência contínua que atravessa todos os departamentos, e cada ponto de contato influencia o próximo.

Uma jornada bem mapeada responde a uma pergunta simples e poderosa: "Como é ser você, tentando fazer isso, no mundo real?"`,
    sections: [
      { title: "Anatomia de um Mapa de Jornada",
        body: `Um mapa de jornada completo tem múltiplas camadas:

PERSONA
Quem está vivendo essa jornada? Qual das suas personas este mapa representa? Uma jornada por persona — uma jornada que tenta representar "todos os usuários" não representa ninguém bem.

CENÁRIO
Qual é a situação específica? "Novo cliente comprando pela primeira vez" é diferente de "cliente recorrente com problema no pedido". Defina o cenário antes de mapear.

FASES
Os grandes momentos da jornada (ex: Descoberta → Consideração → Compra → Uso → Suporte → Renovação). Quantas fases dependem do serviço — podem ser 3 ou 10.

AÇÕES
O que o usuário faz em cada fase. Concreto, observável. "Pesquisa no Google", "compara preços", "liga para o suporte", "desinstala o app".

PENSAMENTOS
O que passa pela cabeça do usuário em cada momento. Frequentemente revelado em entrevistas: "Será que esse site é confiável?", "Por que isso está demorando tanto?"

EMOÇÕES
A curva emocional da jornada. Geralmente representada como uma linha que sobe e desce. Os momentos de baixa emoção são os pontos de atrito — as oportunidades de design.

PONTOS DE CONTATO
Os canais e interfaces onde o usuário interage com o serviço. App, site, email, telefone, loja física, entregador.

OPORTUNIDADES
Insights de melhoria identificados a partir dos pontos de atrito.` },
      { title: "Jornada As-Is vs. To-Be",
        body: `AS-IS (SITUAÇÃO ATUAL)
Mapeia a jornada como ela é hoje — com todos os problemas, frustrações e momentos de baixa emoção. É o ponto de partida honesto. Deve ser construída com dados de pesquisa real, não com o que a equipe imagina que seja a experiência.

Uma jornada as-is bem construída é frequentemente desconfortável para as equipes — porque torna visível a diferença entre como a organização acredita que seus clientes são atendidos e como eles realmente são.

TO-BE (SITUAÇÃO FUTURA DESEJADA)
Mapeia como a jornada deveria ser após as melhorias. É o norte do projeto de design. Deve ser construída de forma realista — considerando as restrições operacionais, tecnológicas e financeiras da organização.

A distância entre o as-is e o to-be é o espaço do design. Os momentos de maior diferença entre as duas jornadas são as prioridades de intervenção.

COMO USAR AS DUAS JUNTAS
1. Construa a jornada as-is com dados de pesquisa
2. Identifique os momentos críticos de baixa emoção (os vales da curva)
3. Explore soluções para cada momento crítico (ideação)
4. Construa a jornada to-be com as soluções incorporadas
5. Valide a jornada to-be com usuários antes de implementar` },
      { title: "Erros mais comuns",
        body: `ERRO 1 — Criar sem pesquisa
A jornada construída em workshop interno reflete o que a equipe IMAGINA que o usuário vive. É um ponto de partida para hipóteses, nunca uma representação da realidade. Sempre valide com usuários reais.

ERRO 2 — Ser genérico demais
"O usuário" não existe. "A Maria, 38 anos, gerente de RH que usa o sistema para aprovação de férias" existe. Sempre construa para uma persona específica em um cenário específico.

ERRO 3 — Focar só nos pontos de contato diretos
A jornada começa antes do primeiro contato com o serviço e termina depois do último. O que acontece quando o usuário DECIDE que precisa do serviço? O que acontece dias depois que ele usou? Esses momentos frequentemente são os mais reveladores.

ERRO 4 — Não mapear a curva emocional
Sem a dimensão emocional, a jornada é apenas um fluxograma. A emoção é o que transforma dados em insight de design.

ERRO 5 — Criar e não usar
A jornada deve ser referência ativa durante todo o projeto. Cole na parede, atualize quando aprender algo novo, consulte em decisões de produto.` }
    ]
  },

  "mapa-stakeholders": {
    intro: `O Mapa de Stakeholders é a ferramenta que torna visível o ecossistema humano ao redor de um serviço. Todo serviço envolve muito mais pessoas do que os "usuários diretos" — há fornecedores, reguladores, parceiros, funcionários em diferentes níveis, comunidades afetadas indiretamente, e uma série de outros atores cujas ações e interesses moldam a experiência final.

Ignorar stakeholders é uma das causas mais comuns de fracasso em projetos de design. Um novo processo de atendimento que o usuário ama mas que os funcionários odeiam não é sustentável. Uma funcionalidade que o cliente deseja mas que viola regulações do setor não pode ser lançada. Um serviço que beneficia um grupo mas prejudica outro não é eticamente defensável.

O mapa de stakeholders não resolve esses conflitos — mas os torna visíveis, que é o primeiro passo para lidar com eles.`,
    sections: [
      { title: "Tipos de stakeholders e como mapeá-los",
        body: `STAKEHOLDERS PRIMÁRIOS
Diretamente afetados pelo serviço — recebem ou entregam valor diretamente. Incluem: usuários finais (clientes), funcionários da linha de frente, gestores operacionais.

STAKEHOLDERS SECUNDÁRIOS
Indiretamente afetados — não interagem diretamente com o serviço mas são impactados por seus resultados. Incluem: famílias dos usuários, comunidades próximas, outras organizações do setor.

STAKEHOLDERS TERCIÁRIOS
Têm interesse no serviço mas não são diretamente afetados — reguladores, governo, mídia, associações do setor.

COMO POSICIONAR NO MAPA
Existem várias formas. A mais comum usa dois eixos:
→ Eixo horizontal: influência sobre o projeto (baixa → alta)
→ Eixo vertical: interesse no projeto (baixo → alto)

Os quadrantes resultantes revelam estratégias diferentes:
→ Alta influência + Alto interesse: parceiros críticos — envolva ativamente
→ Alta influência + Baixo interesse: gestores a manter satisfeitos
→ Baixa influência + Alto interesse: usuários a manter informados
→ Baixa influência + Baixo interesse: monitore com menos frequência` },
      { title: "Mapeando relações e conflitos",
        body: `O mapa de stakeholders não é apenas uma lista — é um mapa de RELAÇÕES. O que torna a ferramenta poderosa é visualizar:

FLUXOS DE VALOR
O que cada stakeholder dá e recebe? Dinheiro, informação, serviço, autorização, reputação? Tornar os fluxos visíveis frequentemente revela dependências não percebidas.

CONFLITOS DE INTERESSE
Quais stakeholders têm objetivos que se contradizem? O usuário quer processo mais simples, a área jurídica quer mais documentação. O funcionário quer menos etapas, o auditor quer mais registros. Esses conflitos precisam ser reconhecidos e endereçados no design.

STAKEHOLDERS INVISÍVEIS
Quem é afetado pelo serviço mas não está sendo incluído na conversa? Os entregadores no sistema de delivery. Os técnicos que mantêm o sistema rodando. As comunidades que recebem os impactos indiretos. Torná-los visíveis no mapa é o primeiro passo para considerá-los no design.

ALIADOS E OPOSITORES
Quem vai defender o projeto? Quem pode resistir à mudança? Mapear isso ajuda no plano de implementação — com quem construir aliança? Quem precisa ser envolvido mais cedo para reduzir resistência?` },
      { title: "Da análise à ação",
        body: `O mapa de stakeholders é uma ferramenta de análise — mas seu valor está no que você faz com ele.

DECISÕES DE PESQUISA
Com quem você precisa falar na fase de pesquisa? O mapa revela quais stakeholders você pode estar ignorando. Frequentemente, as perspectivas mais valiosas vêm de stakeholders periféricos que nunca foram consultados.

DECISÕES DE CODESIGN
Quem deve estar nas sessões de cocriação? O mapa ajuda a montar grupos de trabalho que representem a diversidade real de perspectivas — não apenas os mais vocais ou os mais próximos da liderança.

PLANO DE COMUNICAÇÃO
Diferentes stakeholders precisam de comunicações diferentes sobre o projeto. O mapa informa: quem precisa ser informado sobre o quê, com que frequência, em qual formato.

GERENCIAMENTO DE RESISTÊNCIA
Onde há potencial de resistência à mudança? O mapa ajuda a identificar stakeholders que precisam ser envolvidos cedo — porque se sentirem excluídos do processo, podem criar obstáculos na implementação.` }
    ]
  },

  "hmw": {
    intro: `O "Como nós poderíamos?" (HMW — How Might We?) é uma técnica de reformulação de problemas que parece simples e é transformadora. Ela transforma problemas e insights de pesquisa em convites para a criação.

A técnica foi desenvolvida na Procter & Gamble nos anos 1970 e popularizada pelo IDEO e pela d.school de Stanford como parte do processo de Design Thinking. Tornou-se um elemento central dos Design Sprints do Google e é hoje usada em organizações de todo tipo mundo afora.

O poder do HMW não está nas palavras em si — está no que elas fazem com o estado mental de quem resolve o problema. "Temos um problema com o processo de cancelamento" fecha o pensamento. "Como nós poderíamos tornar o cancelamento uma experiência que aumenta a confiança no serviço?" abre possibilidades.`,
    sections: [
      { title: "Anatomia de uma boa HMW",
        body: `Cada palavra do "Como nós poderíamos?" foi escolhida com intenção:

"COMO" — sugere que a solução existe, só ainda não foi encontrada. Transforma um problema em uma pergunta com resposta possível.

"NÓS" — é coletivo. Convida a colaboração. A solução não é responsabilidade de uma pessoa ou departamento — é do grupo.

"PODERÍAMOS" — é permissivo, não prescritivo. Não diz "devemos" ou "vamos". Abre espaço para exploração sem comprometimento prematuro.

UMA BOA HMW:
→ Não contém a solução embutida ("Como nós poderíamos usar o app para...")
→ Não é tão ampla que qualquer ideia se encaixa ("Como nós poderíamos melhorar o mundo?")
→ Não é tão estreita que limita as possibilidades ("Como nós poderíamos mudar o texto do botão de cancelamento?")
→ Parte de um insight real de pesquisa
→ É específica o suficiente para guiar a ideação mas aberta o suficiente para gerar surpresas` },
      { title: "O exercício das 3 escalas",
        body: `Uma técnica poderosa para encontrar a melhor HMW é criar versões em três escalas a partir de um mesmo insight:

MUITO AMPLA (nível estratégico)
"Como nós poderíamos fazer cada cliente se sentir valorizado em cada interação com a empresa?"
Verdadeira mas difícil de idear — qualquer coisa se encaixa.

NA MEDIDA CERTA (nível tático)
"Como nós poderíamos tornar o processo de cancelamento uma experiência que reforce a confiança do cliente?"
Específica o suficiente para guiar a ideação, aberta o suficiente para gerar ideias variadas.

MUITO ESTREITA (nível operacional)
"Como nós poderíamos reduzir o número de etapas no formulário de cancelamento de 7 para 2?"
Já sugere a solução — não convida ideação criativa.

O objetivo é encontrar a pergunta "na medida certa" — específica o suficiente para guiar, ampla o suficiente para surpreender.` },
      { title: "HMW em sessões de ideação",
        body: `O HMW é especialmente poderoso quando usado para abrir sessões de ideação. O processo:

1. PARTIR DE DADOS
As melhores HMWs nascem de insights de pesquisa — não de suposições da equipe. "A Maria disse que sente culpa quando precisa cancelar" → "Como nós poderíamos tornar o cancelamento uma decisão empoderada, não culposa?"

2. GERAR MÚLTIPLAS HMWs
Em sessões de análise de pesquisa, é comum gerar 20-30 HMWs. Escreva cada uma em um post-it separado.

3. VOTAR NAS MAIS PROMISSORAS
A equipe vota nas HMWs mais relevantes e promissoras. As 3-5 mais votadas guiam a sessão de ideação.

4. USAR COMO PROMPT
Na sessão de brainstorming ou Crazy 8's, cada HMW é o ponto de partida para um cluster de ideias. Ao final, cada ideia pode ser conectada à HMW que a gerou — mostrando que a ideação tem raiz em dados reais.` }
    ]
  },

  "crazy-8": {
    intro: `O Crazy 8's é uma técnica de ideação rápida criada pelo Google Ventures como parte do Design Sprint. A premissa é direta e radical: 8 esboços em 8 minutos. Um esboço por minuto.

A velocidade não é arbitrária — é o coração da técnica. Quando você tem apenas 60 segundos para cada ideia, o cérebro não tem tempo para autocensura. As ideias "óbvias" saem nos primeiros 3 quadrantes. As ideias "selvagens" começam a aparecer nos quadrantes 4, 5, 6. Os quadrantes 7 e 8 frequentemente produzem as ideias mais originais — quando a pressão do tempo força conexões que a reflexão controlada nunca produziria.

O Crazy 8's parte de um insight fundamental sobre criatividade: a primeira ideia raramente é a melhor. Mas a maioria das equipes para na primeira ideia porque parece boa o suficiente. Crazy 8's força o volume antes da qualidade.`,
    sections: [
      { title: "Como facilitar um Crazy 8's",
        body: `PREPARAÇÃO (5 minutos)
→ Cada participante recebe uma folha A4 ou A3
→ Dobre em 8 partes: 2 dobras na vertical, 1 dobra na horizontal (como um mini-livro)
→ Desdobre: você terá 8 retângulos iguais para desenhar
→ Defina o desafio: qual HMW ou problema guia os esboços?

EXECUÇÃO (8 minutos — 1 por quadrante)
→ Timer visível para todos (projete um cronômetro regressivo)
→ SILÊNCIO total durante os 8 minutos
→ Esboços simples — caixas, setas, texto curto
→ Não precisa ser bonito — precisa ser legível pelo criador
→ Ao sinal do timer: próximo quadrante, nova ideia
→ Regra de ouro: variações mínimas da mesma ideia não valem

APRESENTAÇÃO (24 minutos — 3 min por pessoa)
→ Cole os Crazy 8's na parede ou compartilhe na tela
→ Cada pessoa apresenta em 3 minutos (não 3 minutos por quadrante — 3 minutos para os 8)
→ Sem julgamento durante as apresentações
→ Perguntas de clareza permitidas, debates depois

VOTAÇÃO (5-10 minutos)
→ Cada participante recebe 2-3 pontos adesivos (ou votos)
→ Vota nos esboços que mais gostou — pode concentrar em um ou distribuir
→ As ideias mais votadas avançam para a próxima fase (sketching detalhado ou prototipagem)` },
      { title: "Crazy 8's individual vs. em grupo",
        body: `INDIVIDUAL (o original do Design Sprint)
Cada pessoa faz seus próprios 8 esboços individualmente e em silêncio. Depois apresenta para o grupo.

Vantagem: evita o "groupthink" — cada pessoa contribui com perspectiva autêntica sem ser influenciada pelas ideias dos outros antes de ter as suas. As diferenças entre os esboços revelam a diversidade real de perspectivas da equipe.

EM GRUPO (variação colaborativa)
O grupo trabalha junto em uma mesma superfície grande — cada pessoa contribui com esboços em tempo real, visíveis para todos.

Vantagem: construção colaborativa imediata, "yes and" visual. Desvantagem: as vozes mais fortes tendem a dominar; as perspectivas dos mais tímidos se perdem.

RECOMENDAÇÃO: use o modelo individual para a primeira rodada e, se quiser, use uma rodada colaborativa depois — onde cada pessoa pode adicionar elementos nos esboços dos colegas.` },
      { title: "Variações e adaptações",
        body: `10+10
Versão expandida: 10 ideias individuais (10 minutos) + 10 variações coletivas das melhores (10 minutos). Combina profundidade individual com síntese colaborativa.

CRAZY 8's DIGITAL
Em sessões remotas, use Miro, Figma ou papel + câmera. A velocidade é mais difícil de manter digitalmente — pessoas tendem a polir mais. Considere reduzir para 6 quadrantes em 6 minutos em versões remotas.

CRAZY 8's PARA TEXTO
Não precisa ser visual. Equipes que trabalham com conteúdo podem escrever 8 versões de um título, 8 abordagens para um email, 8 formas de comunicar uma ideia. A lógica é a mesma: volume antes de qualidade.

CRAZY 8's DE JORNADA
Em vez de esboçar telas ou soluções, esboce jornadas: 8 formas diferentes de o usuário chegar ao mesmo objetivo. Útil para ideação no nível de processo, não de interface.` }
    ]
  },

  "prototipo-papel": {
    intro: `A prototipagem em papel é frequentemente subestimada por parecer "primitiva" demais. Essa percepção é um erro. Um protótipo de papel feito em 20 minutos pode revelar problemas de fluxo e navegação que só seriam descobertos semanas depois em um protótipo digital — e a um custo de horas de desenvolvimento versus minutos de desenho.

O princípio fundamental da prototipagem em papel é a "descartabilidade intencional". Quando o protótipo é feito de papel, ninguém tem apego a ele. A equipe critica livremente. O usuário aponta problemas sem medo de ofender quem fez. As mudanças são imediatas — risca, redesenha, substitui um papel por outro.

Quando o mesmo protótipo está em Figma com animações e visual refinado, o apego é diferente. O feedback tende a ser mais superficial. A resistência a mudanças é maior. O custo percebido de errar é alto demais.`,
    sections: [
      { title: "Tipos de protótipos de papel",
        body: `WIREFRAME EM PAPEL (mais simples)
Esboço básico das telas principais com caixas e texto. Sem nenhum detalhe visual. Foca na estrutura: onde está cada elemento, qual é a hierarquia, como as informações se organizam.

Melhor para: validar arquitetura de informação e layout antes de qualquer investimento visual.

STORYBOARD EM PAPEL
Série de esboços que narram a jornada do usuário — como um quadrinho. Cada quadro representa um momento da interação. Mostra o fluxo completo, não apenas telas individuais.

Melhor para: comunicar a experiência completa para stakeholders, identificar onde a jornada quebra.

PAPER PROTOTYPE INTERATIVO
Telas desenhadas em papel separados + elementos móveis (botões, menus, modais) em cartões menores. Durante o teste, o facilitador "opera" o protótipo: quando o usuário toca em algo, o facilitador troca ou adiciona papéis para simular a resposta do sistema.

Melhor para: testes de usabilidade antes de qualquer desenvolvimento digital.

MAQUETE DE SERVIÇO
Para serviços físicos: objetos representando cada elemento do serviço (post-its, caixinhas, peças de jogos). Usado no Desktop Walkthrough para simular o serviço inteiro em uma mesa.

Melhor para: prototipagem de processos e serviços (não apenas interfaces digitais).` },
      { title: "Conduzindo um teste com protótipo de papel",
        body: `PREPARAÇÃO
→ Desenhe as telas principais (não precisa ser tudo — as telas do fluxo crítico)
→ Crie elementos separados para estados diferentes (menu aberto, modal de confirmação, tela de erro)
→ Defina 1-3 tarefas específicas para o usuário realizar
→ Prepare um roteiro de introdução (o que é o protótipo, o que você quer que faça)

INTRODUÇÃO AO USUÁRIO
"Vou te mostrar uma versão inicial de um produto que estamos desenvolvendo. Não está finalizada — é um rascunho em papel. Eu preciso que você tente realizar algumas tarefas como se fosse o produto real. Não existe resposta certa ou errada — estamos testando o produto, não você. Por favor, pense em voz alta enquanto navega."

DURANTE O TESTE
→ Um pesquisador opera o protótipo (troca os papéis)
→ Outro anota o que observa (não o que interpreta)
→ Não ajude — mesmo quando o usuário errar, observe
→ Faça perguntas apenas no final ou em momentos de hesitação prolongada

APÓS O TESTE
→ Revise as notas imediatamente (memória decai rápido)
→ Identifique os 3 maiores problemas
→ Faça as mudanças no protótipo antes do próximo teste
→ Repita até não aparecerem problemas novos` },
      { title: "A escada de fidelidade",
        body: `A prototipagem tem uma escada — e a sabedoria está em usar o degrau certo para o momento certo:

BAIXA FIDELIDADE (papel, post-it, esboço)
Custo: minutos. Apego: zero. Revelação: estrutura, fluxo, conceito.
Use quando: você ainda está explorando conceitos e quer falhar rápido.

MÉDIA FIDELIDADE (wireframe digital, mockup básico)
Custo: horas. Apego: moderado. Revelação: usabilidade, legibilidade, hierarquia.
Use quando: você tem o conceito validado e quer testar a usabilidade.

ALTA FIDELIDADE (protótipo interativo, design finalizado)
Custo: dias ou semanas. Apego: alto. Revelação: desejo, percepção de qualidade, detalhes de interação.
Use quando: você validou a usabilidade e quer testar a percepção antes do desenvolvimento.

A armadilha mais comum: pular direto para alta fidelidade. O custo de descobrir um problema de fluxo num protótipo de alta fidelidade é 10x maior que descobrir no papel. O custo emocional de descartar um protótipo de alta fidelidade é ainda maior — e frequentemente faz as equipes resistirem a mudanças necessárias.` }
