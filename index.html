    intro: `A prototipagem em papel é frequentemente subestimada por parecer "primitiva" demais. Essa percepção é um erro. Um protótipo de papel feito em 20 minutos pode revelar problemas de fluxo e navegação que só seriam descobertos semanas depois em um protótipo digital — e a um custo de horas de desenvolvimento versus minutos de desenho.

O princípio fundamental da prototipagem em papel é a "descartabilidade intencional". Quando o protótipo é feito de papel, ninguém tem apego a ele. A equipe critica livremente. O usuário aponta problemas sem medo de ofender quem fez. As mudanças são imediatas — risca, redesenha, substitui um papel por outro.

Quando o mesmo protótipo está em Figma com animações e visual refinado, o apego é diferente. O feedback tende a ser mais superficial. A resistência a mudanças é maior. O custo percebido de errar é alto demais.`,
    sections: [
      { title: "Tipos de protótipos de papel",
        body: `WIREFRAME EM PAPEL (mais simples)
Esboço básico das telas principais com caixas e texto. Sem nenhum detalhe visual. Foca na estrutura: onde está cada elemento, qual é a hierarquia, como as informações se organizam.

Melhor para: validar arquitetura de informação e layout antes de qualquer investimento visual.

STORYBOARD EM PAPEL
Série de esboços que narram a jornada do usuário — como um quadrinho. Cada quadro representa um momento da interação. Mostra o fluxo completo, não apenas telas individuais.

Melhor para: comunicar a experiência completa para stakeholders, identificar onde a jornada quebra.

PAPER PROTOTYPE INTERATIVO
Telas desenhadas em papel separados + elementos móveis (botões, menus, modais) em cartões menores. Durante o teste, o facilitador "opera" o protótipo: quando o usuário toca em algo, o facilitador troca ou adiciona papéis para simular a resposta do sistema.

Melhor para: testes de usabilidade antes de qualquer desenvolvimento digital.

MAQUETE DE SERVIÇO
Para serviços físicos: objetos representando cada elemento do serviço (post-its, caixinhas, peças de jogos). Usado no Desktop Walkthrough para simular o serviço inteiro em uma mesa.

Melhor para: prototipagem de processos e serviços (não apenas interfaces digitais).` },
      { title: "Conduzindo um teste com protótipo de papel",
        body: `PREPARAÇÃO
→ Desenhe as telas principais (não precisa ser tudo — as telas do fluxo crítico)
→ Crie elementos separados para estados diferentes (menu aberto, modal de confirmação, tela de erro)
→ Defina 1-3 tarefas específicas para o usuário realizar
→ Prepare um roteiro de introdução (o que é o protótipo, o que você quer que faça)

INTRODUÇÃO AO USUÁRIO
"Vou te mostrar uma versão inicial de um produto que estamos desenvolvendo. Não está finalizada — é um rascunho em papel. Eu preciso que você tente realizar algumas tarefas como se fosse o produto real. Não existe resposta certa ou errada — estamos testando o produto, não você. Por favor, pense em voz alta enquanto navega."

DURANTE O TESTE
→ Um pesquisador opera o protótipo (troca os papéis)
→ Outro anota o que observa (não o que interpreta)
→ Não ajude — mesmo quando o usuário errar, observe
→ Faça perguntas apenas no final ou em momentos de hesitação prolongada

APÓS O TESTE
→ Revise as notas imediatamente (memória decai rápido)
→ Identifique os 3 maiores problemas
→ Faça as mudanças no protótipo antes do próximo teste
→ Repita até não aparecerem problemas novos` },
      { title: "A escada de fidelidade",
        body: `A prototipagem tem uma escada — e a sabedoria está em usar o degrau certo para o momento certo:

BAIXA FIDELIDADE (papel, post-it, esboço)
Custo: minutos. Apego: zero. Revelação: estrutura, fluxo, conceito.
Use quando: você ainda está explorando conceitos e quer falhar rápido.

MÉDIA FIDELIDADE (wireframe digital, mockup básico)
Custo: horas. Apego: moderado. Revelação: usabilidade, legibilidade, hierarquia.
Use quando: você tem o conceito validado e quer testar a usabilidade.

ALTA FIDELIDADE (protótipo interativo, design finalizado)
Custo: dias ou semanas. Apego: alto. Revelação: desejo, percepção de qualidade, detalhes de interação.
Use quando: você validou a usabilidade e quer testar a percepção antes do desenvolvimento.

A armadilha mais comum: pular direto para alta fidelidade. O custo de descobrir um problema de fluxo num protótipo de alta fidelidade é 10x maior que descobrir no papel. O custo emocional de descartar um protótipo de alta fidelidade é ainda maior — e frequentemente faz as equipes resistirem a mudanças necessárias.` }
    ]
  },

  ,"desktop-walkthrough": {
    intro: `O Desktop Walkthrough é uma técnica de prototipagem de serviços que usa objetos físicos em uma mesa para simular todo o sistema de serviço em miniatura. Post-its representam clientes, cartões representam funcionários, caixinhas representam sistemas, e a mesa se torna um palco onde o serviço é encenado em câmera lenta.

O que parece infantil é na prática uma das técnicas mais reveladoras do arsenal do Design de Serviço. Isso porque ela transforma uma descrição abstrata de processo (que todo mundo entende diferentemente) em uma simulação física concreta (onde os problemas se tornam imediatamente visíveis).

Você pode descrever um processo de atendimento em um documento de 20 páginas e cada stakeholder vai imaginar algo diferente. Você simula o mesmo processo em 30 minutos com post-its numa mesa e todos veem a mesma coisa — incluindo os problemas que ninguém havia identificado.`,
    sections: [
      { title: "Como preparar e executar",
        body: `MATERIAIS
→ Post-its de cores diferentes (cada cor = um tipo de ator: cliente, funcionário, sistema)
→ Canetas para escrever nos post-its
→ Cartões ou caixinhas para representar sistemas e objetos físicos
→ Uma mesa grande o suficiente para a equipe trabalhar em volta
→ Câmera para registrar o que for criado

PREPARAÇÃO (30-60 minutos)
1. Identifique todos os atores do serviço (quem participa)
2. Crie representações físicas para cada ator
3. Identifique os pontos de contato e objetos físicos envolvidos
4. Defina o cenário específico a simular (qual jornada, qual persona)
5. Esboce o roteiro básico (sequência de etapas a simular)

EXECUÇÃO (45-90 minutos)
→ Comece do momento zero: o usuário "decide" que precisa do serviço
→ Mova os objetos pela mesa na sequência real das interações
→ Para em cada transição: "o que acontece agora?"
→ Verbalizo o que cada objeto "faz" ou "sente" naquele momento
→ Quando houver dúvida sobre como o processo funciona, pause e discuta
→ Marque os momentos problemáticos com uma nota vermelha

PÓS-SIMULAÇÃO (30 minutos)
→ Liste os problemas identificados em ordem de impacto
→ Para cada problema: qual camada é afetada? (linha de frente? bastidores? sistema?)
→ Priorize: o que precisa ser resolvido antes do lançamento?
→ Simule a versão "to-be" — como seria se esses problemas fossem resolvidos?` },
      { title: "Desktop Walkthrough vs. Role Play",
        body: `Ambas as técnicas simulam serviços — mas com abordagens diferentes.

DESKTOP WALKTHROUGH
→ Usa objetos físicos (post-its, cartões) representando os atores
→ Mais abstrato, mais rápido
→ Permite simular sistemas complexos com muitos atores
→ Mais fácil de modificar em tempo real
→ Melhor para: entender fluxos e dependências sistêmicas

ROLE PLAY
→ Pessoas reais interpretam os papéis (cliente, funcionário, sistema)
→ Mais concreto, mais emocional
→ Captura dimensões que objetos não capturam: tom de voz, timing, linguagem corporal
→ Mais difícil de modificar enquanto acontece
→ Melhor para: entender a qualidade da interação humana, treinar equipes, desenvolver protocolos de atendimento

NA PRÁTICA: use os dois em sequência. Desktop Walkthrough primeiro para entender o fluxo e identificar problemas sistêmicos. Role Play depois para refinar a qualidade das interações humanas no novo processo.` },
      { title: "Quando usar e quando não usar",
        body: `QUANDO O DESKTOP WALKTHROUGH BRILHA
→ Para serviços novos que ainda não existem — simular antes de construir
→ Para identificar dependências ocultas entre departamentos
→ Para comunicar a complexidade de um serviço para stakeholders que não o conhecem
→ Para encontrar pontos únicos de falha (onde se uma coisa falha, tudo falha)
→ Para facilitar a conversa entre equipes que raramente falam entre si

QUANDO NÃO É A FERRAMENTA CERTA
→ Para problemas de interface digital (use prototipagem digital)
→ Para serviços muito simples (fluxogramas são mais eficientes)
→ Quando você precisa de precisão técnica (a simulação física é uma aproximação)
→ Quando a equipe não está disposta a "brincar" — a técnica requer disposição para a descontração` }
    ]
  },

  ,"teste-usabilidade": {
    intro: `O teste de usabilidade é o método que fecha o ciclo entre design e realidade. Você projetou algo com base em pesquisa e suposições. O teste de usabilidade substitui as suposições por dados: você observa pessoas reais tentando usar o que você projetou, e vê — com precisão cirúrgica — onde funciona e onde falha.

Jakob Nielsen, o pesquisador que mais contribuiu para a formalização desta disciplina, identificou em 1993 que apenas 5 usuários revelam 85% dos problemas de usabilidade de um produto. Esta descoberta parece contraintuitiva — a maioria das equipes acha que precisa de dezenas ou centenas de testadores para ter dados confiáveis. Na prática, o retorno diminui rapidamente: o 6º usuário revela os mesmos problemas que os primeiros 5 já revelaram.

A consequência prática: você pode (e deve) testar frequentemente, com poucos usuários, em vez de esperar pelo teste perfeito com muitos usuários. Um teste imperfeito feito hoje vale mais que um teste perfeito feito em três meses.`,
    sections: [
      { title: "Moderado vs. não moderado",
        body: `TESTE MODERADO
Um facilitador conduz o teste presencialmente ou por videochamada. O usuário realiza as tarefas enquanto o facilitador observa, anota e pode fazer perguntas.

Vantagens: permite aprofundar quando algo interessante acontece ("por que você clicou aqui?"), captura contexto e nuances, constrói rapport com o usuário.

Desvantagens: escala limitada (você só consegue rodar alguns testes por dia), o facilitador pode influenciar o comportamento do usuário.

TESTE NÃO MODERADO
O usuário realiza as tarefas sozinho, frequentemente gravando a própria tela e voz. Plataformas como Maze, Lookback, UserTesting automatizam a distribuição e coleta.

Vantagens: escala (você pode rodar centenas de testes em paralelo), o usuário age mais naturalmente sem observador.

Desvantagens: não é possível aprofundar no momento; você perde o contexto do que o usuário estava pensando; problemas de conexão ou técnicos não são gerenciados.

QUANDO USAR CADA UM
→ Início do processo: moderado, poucos usuários, foco em descoberta
→ Validação em escala: não moderado, mais usuários, foco em confirmação quantitativa
→ Problemas complexos ou emocionais: sempre moderado (você precisa do contexto)
→ Testes de micro-interações ou copy: não moderado funciona bem` },
      { title: "O protocolo think-aloud",
        body: `O think-aloud (pensar em voz alta) é a instrução mais importante que você dá ao usuário antes de um teste. Sem ele, você vê O QUE o usuário faz mas não sabe POR QUÊ.

A instrução:
"Por favor, pense em voz alta enquanto realiza as tarefas. Não é necessário explicar tudo — apenas compartilhe o que está passando pela sua cabeça. Por exemplo: 'Agora estou procurando o botão de salvar... estou olhando aqui no canto... não estou encontrando...'"

Por que funciona: o processo de verbalizar o pensamento torna visível o modelo mental do usuário — como ele espera que o produto funcione. Quando o modelo mental do usuário difere do modelo que o designer implementou, é onde os problemas de usabilidade acontecem.

Dificuldades comuns:
→ Usuários param de verbalizar quando ficam focados em uma tarefa difícil — justamente quando a verbalização seria mais valiosa. Lembre gentilmente: "Continue pensando em voz alta."
→ Usuários que "ensinam" o produto em vez de usar: "Aqui eu clicaria em X porque imagino que..." Redirezione: "Faça o que você faria normalmente."` },
      { title: "Análise e priorização de problemas",
        body: `IDENTIFICAR PROBLEMAS
Após as sessões de teste, liste todos os problemas observados. Um problema = um momento em que o usuário não conseguiu realizar uma tarefa ou demonstrou confusão, frustração ou erro.

CATEGORIZAR POR SEVERIDADE
Nielsen propõe 4 níveis:
→ 0: Não é um problema de usabilidade
→ 1: Problema cosmético — baixa prioridade, corrija se houver tempo
→ 2: Problema menor — baixa frequência, mas deve ser corrigido
→ 3: Problema maior — alta frequência ou alto impacto, prioridade alta
→ 4: Catástrofe — impede o usuário de completar uma tarefa crítica, corrija antes de lançar

PRIORIZAR POR IMPACTO E ESFORÇO
Nem todo problema grave é fácil de corrigir. Use a matriz impacto × esforço:
→ Alto impacto + baixo esforço: corrija primeiro (quick wins)
→ Alto impacto + alto esforço: planeje para o próximo sprint
→ Baixo impacto + baixo esforço: faça se houver tempo
→ Baixo impacto + alto esforço: geralmente não vale o investimento

DOCUMENTAR E COMUNICAR
O relatório de teste de usabilidade não é um documento de 50 páginas. É uma lista priorizada de problemas com evidências (screenshots, citações, clips de vídeo) e recomendações claras. Comunicação simples gera ação.` }
    ]
  },

  ,"avaliacao-heuristica": {
    intro: `A avaliação heurística é um método de inspeção de usabilidade onde especialistas avaliam uma interface com base em princípios estabelecidos — as "heurísticas". O termo vem do grego heuriskein (descobrir) e da noção de que princípios gerais podem guiar a descoberta de problemas específicos.

Desenvolvida por Jakob Nielsen e Rolf Molich em 1990, a avaliação heurística tornou-se um dos métodos mais utilizados na prática de UX por uma razão simples: ela identifica problemas de usabilidade rapidamente, sem precisar de usuários, sem precisar de protótipos funcionais e a baixo custo.

Ela não substitui os testes com usuários — os problemas que ela encontra são diferentes. A avaliação heurística encontra problemas que violam princípios estabelecidos de design. Os testes com usuários encontram os problemas que afetam usuários reais em contextos reais. Os dois métodos juntos são mais poderosos que qualquer um sozinho.`,
    sections: [
      { title: "As 10 heurísticas de Nielsen",
        body: `1. VISIBILIDADE DO STATUS DO SISTEMA
O sistema deve sempre manter os usuários informados sobre o que está acontecendo, com feedback apropriado em tempo razoável.
Exemplos de violação: barra de progresso que não avança, upload sem indicação de conclusão, formulário enviado sem confirmação.

2. CORRESPONDÊNCIA ENTRE O SISTEMA E O MUNDO REAL
O sistema deve falar a linguagem dos usuários — palavras, frases e conceitos familiares, em vez de terminologia técnica interna.
Exemplos de violação: mensagens de erro em código técnico, jargão corporativo em interfaces de cliente.

3. CONTROLE E LIBERDADE DO USUÁRIO
Usuários frequentemente escolhem funções por engano e precisam de "saída de emergência" claramente marcada.
Exemplos de violação: sem botão "desfazer", sem como cancelar uma ação em progresso, sem como voltar.

4. CONSISTÊNCIA E PADRÕES
Usuários não deveriam ter que se perguntar se palavras, situações ou ações diferentes significam a mesma coisa.
Exemplos de violação: botão "Salvar" em algumas telas e "Confirmar" em outras para a mesma ação.

5. PREVENÇÃO DE ERROS
Melhor que boas mensagens de erro é um design cuidadoso que previne os erros de acontecerem.
Exemplos de violação: formulário que só valida ao enviar (em vez de em tempo real), ações destrutivas sem confirmação.

6. RECONHECIMENTO EM VEZ DE MEMORIZAÇÃO
Minimize a carga de memória do usuário tornando objetos, ações e opções visíveis.
Exemplos de violação: comandos de teclado não visíveis na interface, histórico de ações oculto.

7. FLEXIBILIDADE E EFICIÊNCIA DE USO
Aceleradores — invisíveis para o usuário novato — podem acelerar a interação para o usuário experiente.
Exemplos de violação: sem atalhos de teclado, sem personalização, sem formas rápidas para usuários avançados.

8. ESTÉTICA E DESIGN MINIMALISTA
Diálogos não devem conter informações irrelevantes ou raramente necessárias.
Exemplos de violação: telas sobrecarregadas, excesso de opções, informações não relacionadas à tarefa atual.

9. AJUDAR USUÁRIOS A RECONHECER, DIAGNOSTICAR E RECUPERAR ERROS
Mensagens de erro devem ser expressas em linguagem simples (sem códigos), indicar precisamente o problema e sugerir construtivamente uma solução.
Exemplos de violação: "Erro 404", "Falha na operação", mensagens sem solução sugerida.

10. AJUDA E DOCUMENTAÇÃO
Embora seja melhor que o sistema possa ser usado sem documentação, pode ser necessário fornecer ajuda.
Exemplos de violação: sem ajuda contextual, documentação inacessível, tutoriais em formato de PDF.` },
      { title: "Como executar uma avaliação heurística",
        body: `PREPARAÇÃO
→ Reúna 3-5 avaliadores (cada avaliador extra revela problemas adicionais — mas o retorno diminui após 5)
→ Defina o escopo: quais fluxos ou telas serão avaliados?
→ Prepare o material de referência das heurísticas
→ Defina a escala de severidade (geralmente 0-4)

EXECUÇÃO INDIVIDUAL
→ Cada avaliador percorre o sistema INDEPENDENTEMENTE
→ Percorra o sistema duas vezes: primeira para se familiarizar, segunda para avaliar
→ Para cada problema, anote: localização, heurística violada, descrição, severidade
→ Use screenshots para documentar

CONSOLIDAÇÃO
→ Reúna os avaliadores para consolidar os problemas em uma lista única
→ Discuta divergências de severidade — chegue a um consenso
→ Elimine duplicatas

ENTREGA
→ Lista priorizada de problemas com heurística violada, severidade e recomendação
→ Não precisa ser longa — clareza e acionabilidade são mais importantes que completude` }
    ]
  },

  ,"future-press-release": {
    intro: `O Future Press Release é um método desenvolvido internamente pela Amazon como parte da sua filosofia de inovação chamada "Working Backwards" (trabalhar de trás para frente). A ideia central é contraintuitiva: em vez de começar com uma ideia de produto e depois definir como comunicá-la, você começa pela comunicação — e usa ela para descobrir se a ideia vale a pena.

Antes de qualquer protótipo, antes de qualquer linha de código, antes de qualquer especificação técnica, a equipe da Amazon escreve a nota de imprensa que seria publicada no dia do lançamento do produto. Do ponto de vista do usuário. Em linguagem simples. Sem jargão. Respondendo à pergunta: "Por que alguém se importaria com isso?"

O efeito é imediato e revelador. Equipes que conseguem escrever um press release convincente geralmente têm um produto com valor claro. Equipes que não conseguem — que produzem textos vagos, cheios de jargão, sem benefício claro para o usuário — estão trabalhando num produto que não tem proposta de valor definida. Melhor descobrir isso em uma folha de papel do que após meses de desenvolvimento.`,
    sections: [
      { title: "A estrutura do Future Press Release",
        body: `Um Future Press Release típico tem 5 elementos:

1. TÍTULO
Uma frase que captura o benefício central do produto. Teste: alguém que nunca ouviu falar do produto entenderia o que ele faz e por que importa?

Mal: "Empresa X lança nova plataforma integrada de gestão de conhecimento organizacional"
Bem: "Qualquer funcionário encontra qualquer documento da empresa em menos de 10 segundos"

2. SUBTÍTULO
Uma frase expandindo o título — o segundo benefício mais importante.

3. PROBLEMA
Em 2-3 parágrafos: qual é o problema que o produto resolve? Para quem? Por que esse problema importa? Sem mencionar o produto ainda.

4. SOLUÇÃO
Como o produto resolve o problema. Em linguagem de usuário, não de engenheiro. Sem termos técnicos que o usuário não usaria.

5. CITAÇÃO DE USUÁRIO
Uma citação fictícia de um usuário satisfeito. Esta citação é poderosa porque força você a imaginar como um usuário real descreveria o valor do produto — em suas próprias palavras, não nas suas.

BÔNUS — FAQ
Algumas equipes adicionam uma seção de perguntas e respostas com as objeções mais prováveis. Isso força antecipar problemas e críticas antes do lançamento.` },
      { title: "Como usar no processo de design",
        body: `ANTES DE COMEÇAR O PROJETO
Escreva o press release como primeiro artefato do projeto. Se a equipe consegue escrever um press release convincente, o problema está bem definido. Se não consegue, o problema precisa de mais pesquisa.

COMO CRITÉRIO DE ALINHAMENTO
O press release é um documento de alinhamento poderoso. Quando stakeholders discordam sobre o que o produto deveria fazer, o press release força a conversa: "Qual é o benefício principal?" A resposta a essa pergunta toma decisões de produto.

COMO GUIA DE PRIORIZAÇÃO
Durante o desenvolvimento, funcionalidades são propostas constantemente. O press release é o filtro: "Esta funcionalidade está no press release?" Se não está, provavelmente não deveria ser prioridade.

COMO FERRAMENTA DE PESQUISA
O press release é uma hipótese sobre o que os usuários valorizam. Você pode validar essa hipótese levando o press release para usuários e perguntando: "Isto resolveria um problema real para você?"

ITERAÇÃO
O press release deve ser revisitado e revisado conforme a pesquisa e os protótipos revelam novos aprendizados. Um press release que não muda nunca é um sinal de que a equipe não está aprendendo.` },
      { title: "Por que começa pelo usuário, não pela tecnologia",
        body: `A maioria dos produtos falha não por problemas técnicos — falha por falta de clareza sobre o valor que entrega ao usuário. Equipes apaixonadas pela tecnologia constroem soluções elegantes para problemas que os usuários não têm, ou constroem soluções corretas mas comunicam o valor errado.

O Future Press Release força a inversão: você começa com o valor para o usuário e trabalha de trás para frente até os requisitos técnicos.

Esta inversão tem consequências profundas:
→ Funcionalidades que não aparecem no press release são questionadas
→ A linguagem do press release se torna a linguagem do produto
→ A equipe mantém o foco no benefício, não na feature
→ O lançamento é mais eficiente porque a comunicação já está preparada

A frase que resume o método: "Se você não consegue explicar o valor do produto em uma página, para um leigo, sem jargão — você não entendeu o produto ainda."` }
    ]
  },

  ,"job-story": {
    intro: `O Job Story é uma alternativa às User Stories criada por Alan Klement em 2013 como resposta a uma crítica fundamental: User Stories colocam o foco na persona e frequentemente resultam em soluções que atendem o perfil mas não a situação real.

A crítica é simples e precisa: o problema de design não é "quem é o usuário" — é "em que situação o usuário está". Uma mesma pessoa age de formas completamente diferentes em contextos diferentes. O CEO que toma decisões rápidas em reuniões de conselho pesquisa durante horas antes de comprar um sofá. A mesma pessoa, comportamentos opostos.

User Stories têm o formato: "Como [tipo de usuário], quero [ação], para [benefício]."
Job Stories têm o formato: "Quando [situação], quero [motivação], para [resultado esperado]."

A mudança de "tipo de usuário" para "situação" pode parecer pequena. Suas implicações para o design são enormes.`,
    sections: [
      { title: "Por que a situação importa mais que a persona",
        body: `Imagine que você está projetando um aplicativo de música para streaming. A User Story diria:
"Como um usuário jovem urbano, quero playlists curadas, para descobrir músicas novas."

O Job Story diria:
"Quando estou malhando e meu treino está perdendo intensidade, quero música que aumente meu ritmo automaticamente, para não precisar parar para mudar de música."

A diferença não é sutil. A User Story descreve um perfil demográfico e uma preferência genérica. O Job Story descreve uma situação específica, uma motivação real (manter a intensidade do treino) e um resultado desejado concreto (não precisar parar).

O Job Story leva a decisões de design diferentes:
→ A playlist deve responder ao BPM da atividade física do usuário
→ O controle de música deve ser acessível sem destravar o telefone
→ A música deve mudar gradualmente, não abruptamente
→ O modo treino deve ser ativável sem interrupção

Nenhuma dessas implicações de design emergiu da User Story genérica.` },
      { title: "Construindo bons Job Stories",
        body: `SITUAÇÃO (o quando)
Descreve o contexto específico que desencadeia a necessidade. Quanto mais específica, melhor. "Quando preciso de música" é vaga. "Quando estou malhando e meu treino está perdendo intensidade" é acionável.

Boas situações vêm de pesquisa — especificamente de entrevistas onde você explora contextos reais de uso. "Me conta a última vez que você usou [serviço/produto]" é a pergunta que revela as melhores situações.

MOTIVAÇÃO (o quero)
A motivação real por trás da ação — não a ação em si. "Quero playlists curadas" é uma solução embutida na motivação. "Quero música que acompanhe minha energia" é a motivação real que pode ter muitas soluções.

Pergunte "por que?" múltiplas vezes até chegar na motivação real. Por que quer playlists curadas? Para descobrir músicas novas. Por que quer descobrir músicas novas? Para que a minha rotina de exercícios não fique monótona. Essa é a motivação real.

RESULTADO ESPERADO (o para)
O que o usuário quer ter, sentir ou alcançar. Deve ser verificável — você deve conseguir medir se o resultado foi alcançado.

"Para me sentir bem" é vago. "Para completar o treino sem interrupções" é verificável.` },
      { title: "Job Stories vs. User Stories — quando usar cada um",
        body: `USE USER STORIES QUANDO:
→ Você precisa de rastreabilidade entre requisitos e implementação técnica
→ Você está em um processo de desenvolvimento bem estabelecido com backlog estruturado
→ O comportamento dos diferentes perfis de usuário é genuinamente diferente e relevante
→ Você está comunicando para um time técnico familiarizado com a linguagem

USE JOB STORIES QUANDO:
→ O comportamento situacional é mais determinante que o perfil demográfico
→ Você está na fase de descoberta — ainda entendendo o que construir
→ Você quer garantir que o design atende motivações reais, não apenas funcionalidades
→ A diversidade de usuários é alta e perfis demográficos não capturam a diversidade de contextos

A MELHOR ABORDAGEM
Frequentemente, os dois se complementam. Use Job Stories para a fase de descoberta e definição (garantindo que você está resolvendo motivações reais). Use User Stories para a fase de desenvolvimento (especificando o que construir tecnicamente).` }
    ]
  },

  ,"retrospectiva": {
    intro: `A Retrospectiva é a cerimônia mais subestimada do Scrum — e, quando bem facilitada, a mais transformadora. Enquanto o Sprint Review olha para o PRODUTO (o que foi entregue), a Retrospectiva olha para o PROCESSO (como o trabalho aconteceu). É o momento em que a equipe para e pergunta coletivamente: "Como podemos trabalhar melhor juntos?"

A Retrospectiva parte de um pressuposto fundamental do Scrum: equipes que refletem regularmente sobre como trabalham melhoram continuamente — não apenas quando um gestor aponta um problema, mas de forma autônoma, baseada na experiência real do time.

Quando mal facilitada, a Retrospectiva se torna um ritual vazio: 1 hora de reclamações sem resolução, ou 1 hora de "tá tudo bem" para não criar conflito. Quando bem facilitada, ela transforma equipes — revelando problemas ocultos, construindo confiança e gerando melhorias concretas que se acumulam sprint após sprint.`,
    sections: [
      { title: "As técnicas mais usadas",
        body: `START / STOP / CONTINUE
A mais simples e mais popular. Cada membro responde a 3 perguntas:
→ O que deveríamos COMEÇAR a fazer?
→ O que deveríamos PARAR de fazer?
→ O que deveríamos CONTINUAR fazendo?

Funciona bem para times novos ou quando a equipe não tem muito a discutir. Pode ser superficial em times mais maduros.

SAILBOAT (barco à vela)
Metáfora visual: um barco tentando chegar a um destino.
→ Vento (⛵): o que nos impulsiona? O que está funcionando bem?
→ Âncora (⚓): o que nos retarda? O que está nos impedendo?
→ Destino (🏝): para onde queremos ir? Qual é o nosso objetivo?
→ Pedras (🪨): quais são os riscos que vemos à frente?

Muito útil quando a equipe está travada e precisa de clareza sobre direção.

MAD / SAD / GLAD
Foco nas emoções do sprint:
→ O que me deixou com raiva (mad)?
→ O que me entristeceu ou decepcionou (sad)?
→ O que me deixou feliz ou orgulhoso (glad)?

Especialmente útil quando tensões emocionais precisam ser nomeadas. Requer um ambiente de segurança psicológica estabelecido.

4Ls (LIKED, LEARNED, LACKED, LONGED FOR)
→ O que gostamos?
→ O que aprendemos?
→ O que faltou?
→ O que desejamos que tivesse sido diferente?

Balanceia o positivo e o negativo, inclui aprendizados explicitamente.` },
      { title: "Facilitando uma retrospectiva eficaz",
        body: `ANTES
→ Varie as técnicas — a mesma técnica toda semana perde o impacto
→ Prepare o ambiente: físico ou virtual, deve ser um espaço seguro
→ Revise as ações da retrospectiva anterior — foram implementadas?
→ Defina o timeboxing (90 min para sprints de 2 semanas é padrão)

DURANTE — ESTRUTURA SUGERIDA
1. CHECK-IN (5 min): uma palavra ou emoji que descreve como cada um se sente
2. COLETA DE DADOS (20 min): cada um adiciona suas contribuições individualmente (sem discussão ainda)
3. GERAÇÃO DE INSIGHTS (20 min): identificar padrões e temas nos dados coletados
4. DECIDIR O QUE FAZER (20 min): priorizar 1-3 ações concretas
5. ENCERRAMENTO (5 min): cada um compartilha uma palavra sobre a retrospectiva
6. AÇÕES (10 min): documentar com responsável e prazo

REGRAS DE OURO
→ Prime Directive de Norm Kerth: "Independentemente do que descobrirmos, entendemos e acreditamos verdadeiramente que todos fizeram o melhor trabalho que podiam, dado o que sabiam na época, suas habilidades e recursos disponíveis."
→ 1-3 ações por retrospectiva. Mais que isso não se implementa.
→ Ações com responsável e prazo definidos — não são sugestões, são compromissos.
→ Começar a próxima retrospectiva revisando as ações da anterior.` },
      { title: "Quando a retrospectiva não funciona",
        body: `SINTOMAS DE RETROSPECTIVA DISFUNCIONAL
→ Sempre "tá tudo bem" — a equipe não se sente segura para ser honesta
→ As mesmas reclamações aparecem sprint após sprint — as ações não são implementadas
→ Participação muito baixa — as pessoas não veem valor no exercício
→ Discussões que nunca chegam a ações — muito diagnóstico, pouca solução
→ O mesmo problema sendo discutido de ângulos diferentes — falta de resolução real

CAUSAS COMUNS
→ Falta de segurança psicológica: as pessoas têm medo de repercussões ao ser honestas
→ Ações sem responsável: todos concordam com algo, ninguém se responsabiliza
→ Gerente participando e dominando: presença de hierarquia inibe honestidade
→ Técnica repetida sempre: perde o impacto, vira ritual vazio
→ Sem follow-up: as ações da retro anterior nunca são verificadas

COMO RECUPERAR UMA RETRO DISFUNCIONAL
→ Convide um facilitador externo para algumas sessões
→ Use técnicas anônimas (miro com post-its sem nome)
→ Peça que o gerente assista sem participar por 2-3 sprints
→ Reduza para retrospectivas quinzenais se as semanais perderam impacto
→ Comece pela pergunta: "O que precisaria ser diferente para que você se sentisse à vontade para ser honesto aqui?"` }
    ]
  },

  ,"lightning-talk": {
    intro: `O Lightning Talk é o formato de apresentação que respeita o tempo de todos. Em um mundo onde reuniões se multiplicam e atenção é escassa, a Lightning Talk estabelece um contrato claro: você tem 5 minutos para compartilhar algo valioso. Não 4 minutos e 50 segundos de preparação e 10 segundos de conteúdo. 5 minutos de conteúdo real, focado, acionável.

O formato nasceu nas conferências de tecnologia dos anos 1990, onde comunidades de desenvolvedores precisavam compartilhar muitas ideias rapidamente. Logo foi adotado por comunidades de design, startup e inovação pela mesma razão: é democrático (qualquer pessoa pode apresentar, não apenas experts), é eficiente (muito conteúdo em pouco tempo) e é inclusivo (curto o suficiente para que todos consigam acompanhar).

No contexto do Design de Serviço e UX, o Lightning Talk é especialmente valioso como ferramenta de aprendizado contínuo em equipes — um jeito de manter todos atualizados sobre referências, pesquisas e ferramentas sem transformar cada atualização em uma reunião de 1 hora.`,
    sections: [
      { title: "Como preparar uma Lightning Talk eficaz",
        body: `A preparação de 5 minutos requer mais cuidado que a preparação de 30. Com 30 minutos, você pode errar e corrigir no caminho. Com 5 minutos, cada segundo conta.

ESTRUTURA RECOMENDADA
→ 30 segundos: O que vou compartilhar e por que importa para vocês
→ 3 minutos: O conteúdo central (o insight, a ferramenta, o case)
→ 1 minuto: Uma implicação prática — o que você pode fazer com isso
→ 30 segundos: Uma pergunta para discussão ou reflexão

O QUE EVITAR
→ Histórico longo antes de chegar ao ponto
→ Slides com mais de 3 elementos por tela
→ Começar com "Desculpe, não tive muito tempo para preparar..."
→ Tentar cobrir 3 tópicos em vez de ir fundo em 1
→ Terminar com "Mais ou menos isso..." — termine com uma declaração clara

SOBRE OS SLIDES
Para 5 minutos: máximo 5 slides (1 por minuto) ou nenhum slide (apenas um quadro branco). Slides mais elaborados criam expectativa de mais tempo e complicam a apresentação.` },
      { title: "Lightning Talks no contexto de workshops",
        body: `O IDEO e o Google popularizaram o uso de Lightning Talks no início dos Design Sprints como forma de "carregar" a equipe com referências e inspiração antes da fase de ideação.

O formato típico é: 5 especialistas (internos ou externos) apresentam 5 Lightning Talks de 5 minutos cada sobre temas relacionados ao desafio do sprint. A equipe absorve 5 perspectivas diferentes em 25 minutos — impossível em qualquer outro formato.

QUEM APRESENTA EM UM SPRINT
→ Um especialista no domínio (médico num sprint sobre saúde, professor num sobre educação)
→ Um especialista em tecnologia relevante
→ Um especialista em negócios do setor
→ Um especialista em comportamento do usuário
→ Um "provocador" — alguém de um setor completamente diferente que pode trazer analogias inesperadas

COMO FACILITAR UMA SÉRIE DE LIGHTNING TALKS
→ Defina o tema central e comunique aos apresentadores com antecedência
→ Distribua 2-3 notas adesivas para os participantes durante cada apresentação
→ Após cada talk: 2 minutos para os participantes anotarem suas ideias/insights
→ Não deixe Q&A expandir para além de 2 minutos por talk — salve perguntas para depois` },
      { title: "Lightning Talks para aprendizado contínuo de equipes",
        body: `Uma das melhores aplicações das Lightning Talks é a criação de uma prática regular de aprendizado em equipes de design e produto.

MODELOS COMUNS
→ Weekly Design Talk: toda segunda-feira, 15 minutos, alguém da equipe apresenta uma ferramenta, caso ou referência. Rotatividade entre todos os membros.
→ Research Debrief Talk: após qualquer pesquisa de campo, o pesquisador apresenta os 3 insights principais em 5 minutos antes do debriefe completo.
→ Inspiration Friday: um ritual de encerramento da semana onde cada pessoa compartilha algo que a inspirou ou aprendeu nos últimos 5 dias.

BENEFÍCIOS ACUMULADOS
→ Toda a equipe desenvolve vocabulário comum sobre ferramentas e referências
→ Conhecimento que antes ficava em silos começa a circular
→ Membros mais tímidos encontram um formato seguro para contribuir
→ A equipe desenvolve o hábito de transformar aprendizados em conhecimento compartilhável

DOCUMENTAÇÃO
Grave ou documente as Lightning Talks regularmente. Em 6 meses, você terá uma biblioteca de conhecimento da equipe que nenhum onboarding consegue replicar.` }
    ]
  },

  ,"pixar-storytelling": {
    intro: `A estrutura de storytelling da Pixar é talvez o framework narrativo mais famoso do mundo — e ironicamente, um dos menos usados no design, onde mais faria diferença.

Emma Coats, ex-storyboard artist da Pixar, publicou em 2011 as "22 regras do storytelling da Pixar" no Twitter. A regra número 4 capturou a imaginação de designers, comunicadores e inovadores ao redor do mundo:

"Era uma vez _____. Todo dia, _____. Até que um dia _____. Por causa disso, _____. Por causa disso, _____. Até que finalmente _____. E desde então, _____."

Esta estrutura não é apenas para animação. É para qualquer situação onde você precisa fazer pessoas se importarem com um problema antes de apresentar uma solução. E em design — onde convencer stakeholders, comunicar pesquisa e apresentar soluções são atividades constantes — isso é quase sempre.`,
    sections: [
      { title: "Os 7 elementos da estrutura",
        body: `ERA UMA VEZ (personagem + contexto)
Apresente quem é o protagonista da história e em que mundo ele vive. No contexto de design: quem é o usuário e qual é o contexto de vida relevante para o problema que você está apresentando.

Evite: "Nosso usuário-alvo é..." (começo de relatório, não de história)
Experimente: "Era uma vez João, 42 anos, gerente regional que passa 3 dias por semana viajando..."

TODO DIA (rotina + status quo)
Descreva como é a vida normal do protagonista — antes do problema. Este elemento cria empatia e estabelece o que está em jogo.

"Todo dia, João acordava às 5h, verificava os relatórios no hotel antes das reuniões..."

ATÉ QUE UM DIA (o problema / a virada)
O momento em que algo muda — o incidente incitante. No design: o problema ou a necessidade não atendida que seu projeto vai resolver.

"Até que um dia, o sistema de relatórios travou durante uma apresentação para o cliente mais importante do trimestre..."

POR CAUSA DISSO (consequências em cadeia)
As consequências do problema se encadeiam. Cada "por causa disso" deve ser mais grave que o anterior, criando urgência crescente.

"Por causa disso, a reunião foi cancelada. Por causa disso, João perdeu o negócio. Por causa disso, não bateu a meta do trimestre..."

ATÉ QUE FINALMENTE (a resolução)
A solução. No contexto de design: o que seu projeto propõe como resposta ao problema.

E DESDE ENTÃO (o estado futuro)
Como a vida mudou após a solução. O benefício sustentado no tempo.` },
      { title: "Aplicações no design e apresentações",
        body: `APRESENTAÇÃO DE PESQUISA
O erro mais comum: apresentar dados sem narrativa. "70% dos usuários abandonam na etapa 3" não faz ninguém agir. "Era uma vez Maria, que precisava renovar sua CNH sem faltar ao trabalho..." faz.

Use a estrutura Pixar para transformar dados de pesquisa em histórias de usuário reais. Os dados ficam como evidências que suportam a história — não como o conteúdo principal.

PITCH DE PRODUTO OU PROJETO
A estrutura Pixar é um pitch framework. O investidor, o CEO ou o gestor que você precisa convencer são todos movidos por histórias — não por planilhas.

Era uma vez [usuário]. Todo dia [frustração]. Até que um dia [ponto de ruptura]. Por causa disso [consequência que importa para o negócio]. Até que finalmente [seu produto/projeto]. E desde então [a transformação].

COMUNICAÇÃO INTERNA DE REDESENHO
Quando você precisa comunicar por que um processo vai mudar, a estrutura Pixar reduz a resistência. Em vez de "o novo processo é X", você conta: "Era uma vez o técnico que passava 2 horas por dia inserindo dados manualmente..."

TREINAMENTO E ONBOARDING

Quando você conta uma história sobre um usuário específico vivendo aquele abandono — com nome, contexto, emoção, consequência — o cérebro ativa múltiplas áreas simultaneamente: processamento linguístico, emocional, motor (imaginando o movimento), sensorial. A experiência é mais imersiva, mais memorável, mais persuasiva.

  ,"golden-path": {
    intro: `O Golden Path (Caminho Dourado) é o conceito de produto que descreve o caminho mais direto e mais frequentemente percorrido por um usuário para alcançar o objetivo principal de um produto ou serviço.

O conceito é simples. A implicação para o design é profunda: tudo no produto deve servir ao Golden Path primeiro. Funcionalidades que adicionam complexidade ao Golden Path sem entregarem valor proporcional devem ser eliminadas, ocultadas ou movidas para posições secundárias.

O nome evoca a ideia de um caminho dourado em um labirinto: enquanto existem dezenas de rotas possíveis, há uma que é mais clara, mais eficiente e leva mais diretamente ao destino. O design do produto deve tornar esse caminho óbvio e sem fricção, enquanto os caminhos alternativos — para usuários com necessidades diferentes ou avançadas — existem mas não interferem no caminho principal.`,
    sections: [
      { title: "Como identificar o Golden Path",
        body: `PASSO 1 — DEFINA O OBJETIVO PRINCIPAL
O Golden Path começa com uma pergunta: "O que a maioria dos usuários vem fazer neste produto?"

Importante: deve ser UM objetivo, não uma lista. Se o produto serve múltiplos objetivos igualmente importantes, você tem múltiplos Golden Paths — e a decisão de priorizar um deles é uma decisão estratégica, não de design.

PASSO 2 — MAPEIE O FLUXO REAL
Com dados de analytics e/ou pesquisa com usuários, mapeie o caminho que a maioria dos usuários realmente percorre para atingir o objetivo principal. Não o caminho que você imaginou no design — o caminho que os dados mostram.

Frequentemente, o caminho real é diferente do caminho planejado. Usuários encontram atalhos, ignoram etapas, voltam para pontos anteriores. O Golden Path deve refletir o comportamento real, não o comportamento ideal projetado.

PASSO 3 — MEÇA A TAXA DE COMPLETUDE
Qual percentagem dos usuários que iniciam o Golden Path chega ao final? Esta é a métrica mais importante do produto. Se 50% abandonam no meio do caminho, você tem um problema de Golden Path.

PASSO 4 — IDENTIFIQUE OS PONTOS DE ABANDONO
Onde os usuários saem do caminho? Cada ponto de abandono é um problema de design — uma fricção que o Golden Path não deveria ter.

PASSO 5 — ELIMINE A FRICÇÃO
Para cada ponto de abandono: o que está causando o abandono? Informação insuficiente? Formulário longo demais? Etapa confusa? Elimine ou simplifique.` },
      { title: "Golden Path vs. funcionalidades avançadas",
        body: `Um produto bem projetado tem dois "modos" implícitos:

O GOLDEN PATH (para a maioria)
→ Visível, óbvio, sem fricção
→ Requer o mínimo de decisões do usuário
→ Sempre funciona para o caso de uso mais comum
→ Não expõe a complexidade do produto

AS TRILHAS SECUNDÁRIAS (para usuários avançados)
→ Existem, mas não interferem no Golden Path
→ Acessíveis para quem precisa, invisíveis para quem não precisa
→ Podem ser mais complexas — usuários avançados toleram complexidade em troca de controle

O PRINCÍPIO DE DESIGN
"Torne o caso mais comum o mais fácil possível, e torne o caso avançado possível."

O erro mais comum: tornar o caso avançado tão prominente no design que adiciona complexidade desnecessária ao Golden Path. Menus longos, opções que 90% dos usuários nunca usarão na tela principal, configurações que poderiam ser padrão mas são expostas como decisões.` },
      { title: "Golden Path como ferramenta de decisão",
        body: `O Golden Path é especialmente valioso como filtro de decisão de produto.

DECISÕES DE BACKLOG
Quando funcionalidades competem por espaço no backlog, uma pergunta útil: "Esta funcionalidade serve ao Golden Path ou a casos de uso secundários?" Funcionalidades que servem ao Golden Path devem ter prioridade.

DECISÕES DE INTERFACE
"Esta adição ao design torna o Golden Path mais fácil ou mais difícil?" Adicionar um botão que serve 5% dos usuários mas adiciona distração para os 95% que fazem o Golden Path é uma decisão de design ruim.

DECISÕES DE ONBOARDING
O onboarding ideal é uma experiência guiada pelo Golden Path. Quando o usuário completa o Golden Path pela primeira vez, ele entendeu o produto. Tudo mais pode vir depois.

DECISÕES DE COMUNICAÇÃO
A comunicação do produto (marketing, documentação, suporte) deve ser organizada em torno do Golden Path. Documentação que descreve funcionalidades avançadas antes do básico confunde mais que ajuda.

MÉTRICA CENTRAL
A taxa de completude do Golden Path (percentagem de usuários que chegam ao final do fluxo principal sem abandono) é frequentemente a métrica mais importante de um produto — mais que DAU, MAU ou NPS. Um produto com Golden Path fluido tende a ter boas métricas de retenção e satisfação.` }

  {id:"design-thinking",type:"metodologia",category:"metodologia",custom:false,name:{pt:"Design Thinking",en:"Design Thinking"},origin:"IDEO / d.school Stanford — 1990s",desc:{pt:"Abordagem de inovação centrada no ser humano com 5 fases iterativas: empatia, definição, ideação, prototipagem e teste com usuários reais.",en:"Human-centered innovation approach with 5 iterative phases: empathy, definition, ideation, prototyping and real-user testing."},steps:{pt:["Empatizar — pesquise com usuários reais no contexto deles","Definir — sintetize o problema real a partir dos achados","Idear — gere muitas ideias sem julgamento","Prototipar — construa versões rápidas e baratas","Testar — valide com usuários, documente e itere"],en:["Empathize — research with real users","Define — synthesize the real problem","Ideate — generate ideas without judgment","Prototype — build fast cheap versions","Test — validate, document and iterate"]},examples:["IDEO redesenhou o carrinho de supermercado em 5 dias — referência mundial de processo criativo.","Bank of America criou 'Keep the Change' após DT revelar que usuários arredondavam valores manualmente.","Kaiser Permanente aplicou DT na troca de turno de enfermeiros, reduzindo erros médicos.","Apple usou DT para criar o iPod — começando pela experiência, não pela tecnologia.","CTIC/UEMA aplicou DT para reorganizar serviços digitais partindo das dores reais."],who:["Designer","Inovador","Gestor de Produto","Qualquer profissional"]},
  {id:"service-design",type:"metodologia",category:"metodologia",custom:false,name:{pt:"Design de Serviço",en:"Service Design"},origin:"Lynn Shostack (1982) — HBR / live|work London (2001)",desc:{pt:"Metodologia para projetar serviços de ponta a ponta, considerando camadas visíveis e invisíveis — bastidores, sistemas e todos os stakeholders envolvidos.",en:"Methodology for designing end-to-end services considering all visible and invisible layers — backstage, systems and all stakeholders."},steps:{pt:["Pesquise com usuários, funcionários e stakeholders","Mapeie a jornada atual (como é hoje)","Crie o blueprint de serviço (visível + bastidores)","Identifique pontos de atrito e oportunidades","Prototipe o novo serviço e teste no contexto real","Implemente com plano de mudança organizacional"],en:["Research with users, employees and stakeholders","Map the current journey (as-is)","Create the service blueprint","Identify friction points and opportunities","Prototype and test in real context","Implement with organizational change plan"]},examples:["Mayo Clinic redesenhou o comportamento de atendimento — satisfação >90% vs média do setor de 70%.","Nubank projetou cancelamento em 1 minuto — facilidade de sair virou argumento para ficar.","KLM criou status de reembolso em tempo real via WhatsApp — transparência valeu mais que velocidade.","Cleveland Clinic redesenhou admissão a partir das emoções do paciente — satisfação +40%.","CTIC/UEMA construiu a primeira carta de serviços, tornando o invisible visible."],who:["Service Designer","UX Designer","Gestor de Operações","Consultor de Inovação"]},
  {id:"duplo-diamante",type:"metodologia",category:"metodologia",custom:false,name:{pt:"Duplo Diamante",en:"Double Diamond"},origin:"Design Council UK — 2005",desc:{pt:"Framework com 4 fases: Descobrir e Definir (o problema certo) → Desenvolver e Entregar (a solução certa). Alterna fases divergentes e convergentes.",en:"Framework with 4 phases: Discover and Define (right problem) → Develop and Deliver (right solution). Alternates divergent and convergent phases."},steps:{pt:["Descobrir — explore o problema amplamente com pesquisa aberta","Definir — foque no problema certo com base nos achados","Desenvolver — gere muitas ideias e protótipos diferentes","Entregar — refine, teste e lance a solução"],en:["Discover — broadly explore the problem","Define — focus on the right problem","Develop — generate ideas and prototypes","Deliver — refine, test and launch"]},examples:["NHS: problema não era tecnologia — era comunicação entre médicos e pacientes.","Governo UK redesenhou renovação de passaporte: de 6 semanas para 3 dias.","Empresa de mobilidade: o problema não era o app — era a percepção de segurança nas paradas.","Banco descobriu que o problema real era a exigência de documentos, não a interface.","Universidade: o maior problema da matrícula era o sistema não reservar a vaga em tempo real."],who:["Designer","Inovador","Gestor","Qualquer equipe"]},
  {id:"agile-scrum",type:"metodologia",category:"metodologia",custom:false,name:{pt:"Agile / Scrum",en:"Agile / Scrum"},origin:"Ken Schwaber & Jeff Sutherland — 1995 / Manifesto Ágil — 2001",desc:{pt:"Framework iterativo em sprints com entregas incrementais. Define papéis (PO, Scrum Master, Dev Team), cerimônias e artefatos para organizar o trabalho em ciclos de 1–4 semanas.",en:"Iterative framework in sprints with incremental deliveries. Defines roles, ceremonies and artifacts to organize work in 1–4 week cycles."},steps:{pt:["Crie o Product Backlog com histórias de usuário priorizadas","Sprint Planning — defina o que entra no sprint","Daily Standup de 15 min: fiz, farei, impedimentos","Sprint Review — demonstre o incremento entregue","Retrospectiva — reflita e defina melhorias","Repita incorporando os aprendizados"],en:["Create Product Backlog with prioritized user stories","Sprint Planning","Daily Standup 15 min","Sprint Review","Retrospective","Repeat with learnings"]},examples:["Detran-SP: abandono online de 67% para 19% após 4 sprints iterativos.","Spotify criou o modelo de Squads e Tribes baseado em Agile.","iFood usa sprints de 2 semanas para iterar continuamente no app.","UEMA usou Kanban para redesenhar sistemas sem paralisar os serviços.","Amazon usa 'Working Backwards' + sprints para priorizar o backlog."],who:["Product Owner","Scrum Master","Dev Team","UX Designer"]},
  {id:"entrevista-profundidade",type:"metodo",category:"pesquisa",custom:false,name:{pt:"Entrevista em profundidade",en:"In-depth interview"},origin:"Pesquisa Qualitativa — Ciências Sociais / Etnografia",desc:{pt:"Conversa individual semiestruturada para entender motivações, comportamentos e emoções. O objetivo não é coletar opiniões — é entender o contexto e a experiência real.",en:"Semi-structured individual conversation to understand motivations, behaviors and emotions. The goal is not to collect opinions — it's to understand the real context."},steps:{pt:["Defina as questões de pesquisa (o que precisa entender)","Crie um roteiro semiestruturado — não um questionário fechado","Recrute 5–8 participantes representativos por grupo","Conduza a entrevista no contexto do usuário quando possível","Grave com permissão, transcreva e codifique os dados","Analise padrões e desenvolva insights"],en:["Define research questions","Create a semi-structured guide","Recruit 5–8 participants","Conduct in user's context","Record, transcribe and code","Analyze patterns and develop insights"]},examples:["One Medical: médico lê histórico 24h antes — adquirida pela Amazon por US$ 3,9 bilhões.","Nubank descobriu que clientes queriam nunca precisar ligar para o banco.","IDEO: em aldeias da Índia revelou que bebês prematuros morriam sem acesso a hospitais.","Airbnb: o maior medo do anfitrião era não saber quem entrava em sua casa.","Recife: vacinação — o problema era acesso e horário, não falta de consciência."],who:["UX Researcher","Service Designer","Pesquisador","Antropólogo"]},
  {id:"shadowing",type:"metodo",category:"pesquisa",custom:false,name:{pt:"Shadowing",en:"Shadowing"},origin:"Etnografia / Pesquisa Participante — Ciências Sociais",desc:{pt:"Pesquisador acompanha o usuário como uma sombra no cotidiano para observar comportamentos reais. Revela gaps entre o que as pessoas dizem e o que realmente fazem.",en:"Researcher follows the user like a shadow to observe real behaviors. Reveals gaps between what people say and what they actually do."},steps:{pt:["Obtenha consentimento e defina o escopo","Defina a duração: 30 min a várias horas","Observe sem interferir — anote, fotografe","Faça perguntas nos momentos críticos ('por que fez isso?')","Registre diferenças entre comportamento e relato","Sintetize achados e identifique momentos de atrito invisíveis"],en:["Get consent and define scope","Define duration: 30 min to hours","Observe without interfering","Ask at critical moments","Note behavior vs report differences","Synthesize findings"]},examples:["IDEO: shadowing revelou que 80% dos bebês prematuros morriam em aldeias — gerando o Embrace Warmer de US$ 25.","Hospital: prontuário travava o médico — shadowing revelou isso, entrevista não.","Supermercado: clientes ignoravam completamente a sinalização de promoções.","Banco: clientes usavam caderninho de papel — app não tinha visão consolidada.","CTIC/UEMA: técnicos tinham processos informais não documentados sustentando serviços críticos."],who:["UX Researcher","Service Designer","Pesquisador","Etnógrafo"]},
  {id:"card-sorting",type:"tecnica",category:"pesquisa",custom:false,name:{pt:"Card Sorting",en:"Card Sorting"},origin:"Jakob Nielsen / Arquitetura de Informação — 1990s",desc:{pt:"Usuários organizam cartões com conteúdos em grupos que fazem sentido para eles. Valida ou cria a taxonomia e arquitetura de informação de sites, apps e sistemas.",en:"Users organize cards with content into groups that make sense to them. Validates or creates taxonomy and information architecture."},steps:{pt:["Identifique o conteúdo a organizar (10–40 itens)","Escreva cada item em um cartão físico ou digital","Recrute 5–15 participantes representativos","Peça para agruparem os cartões como fizer sentido","Peça para nomearem cada grupo criado","Analise padrões e use para estruturar a navegação"],en:["Identify content to organize (10–40 items)","Write each item on a card","Recruit 5–15 participants","Ask them to group cards","Ask them to name each group","Analyze patterns and structure navigation"]},examples:["GOV.UK: 800 sites em 1 portal — de 24 para 7 categorias baseadas no que cidadãos buscavam.","Spotify: usuários agrupavam música por 'momento' (trabalhar, malhar), não por 'gênero'.","CTIC/UEMA: usuários agrupavam serviços por 'o que preciso fazer', não por departamento.","Hospital: médicos buscavam por 'tipo de paciente', não por 'tipo de exame'.","Loja virtual: clientes agrupavam por 'ocasião de uso' em vez de categoria técnica."],who:["UX Researcher","IA Specialist","UX Designer","Product Manager"]},
  {id:"persona",type:"ferramenta",category:"sintese",custom:false,name:{pt:"Persona",en:"Persona"},origin:"Alan Cooper — 'The Inmates Are Running the Asylum' (1999)",desc:{pt:"Arquétipo de usuário baseado em pesquisa real representando um grupo com comportamentos semelhantes. Sempre baseada em dados reais — não em suposições ou estereótipos.",en:"User archetype based on real research representing a group with similar behaviors. Always based on real data — not assumptions or stereotypes."},steps:{pt:["Conduza pesquisa qualitativa com 10–20 usuários reais","Identifique padrões de comportamento, não de demografia","Agrupe usuários por comportamentos semelhantes","Crie 1–3 perfis: nome, contexto, objetivos, frustrações, motivações","Valide com dados de pesquisa — questione cada afirmação","Use para guiar decisões: 'a Maria faria isso?'"],en:["Conduct qualitative research with 10–20 real users","Identify behavioral patterns","Group users by similar behaviors","Create 1–3 profiles","Validate with research data","Use to guide decisions"]},examples:["Airbnb: 'anfitriões ansiosos' vs 'experientes' — duas experiências completamente diferentes no app.","Hospital: persona da 'mãe com filho com febre às 3h' revelou que o problema era incerteza, não espera.","GOV.UK garante que serviços funcionem para o menor denominador de habilidade digital.","Netflix: 'personas de humor' — a mesma pessoa quer experiências diferentes às 7h e às 22h.","CTIC/UEMA: servidores técnicos vs usuários externos tinham necessidades completamente diferentes."],who:["UX Designer","Product Designer","UX Researcher","Service Designer"]},
  {id:"mapa-empatia",type:"ferramenta",category:"sintese",custom:false,name:{pt:"Mapa de Empatia",en:"Empathy Map"},origin:"Dave Gray — XPLANE / Strategyzer — 2010",desc:{pt:"Ferramenta visual para sintetizar o que sabemos sobre um usuário em 4 dimensões: Pensa e Sente, Vê, Ouve, Diz e Faz. Constrói empatia profunda antes de idear soluções.",en:"Visual tool to synthesize what we know about a user in 4 dimensions: Thinks and Feels, Sees, Hears, Says and Does."},steps:{pt:["Defina o usuário e o contexto específico","Preencha 'Pensa e Sente': medos, aspirações, preocupações","Preencha 'Vê': o que observa no ambiente ao redor","Preencha 'Ouve': influências externas — amigos, mídia","Preencha 'Diz e Faz': comportamentos e atitudes visíveis","Identifique Dores e Ganhos a partir das 4 dimensões"],en:["Define user and specific context","Fill 'Thinks and Feels'","Fill 'Sees'","Fill 'Hears'","Fill 'Says and Does'","Identify Pains and Gains"]},examples:["Startup de saúde: usuários buscavam 'não se sentir sozinhos', não 'terapia'.","App de transporte: o medo real não era o preço — era não saber se o motorista era confiável.","EAD: abandono não era falta de tempo — era vergonha de não entender sem poder perguntar.","Banco: 'animado com a possibilidade' vs 'frustrado com a burocracia' ao abrir conta.","CTIC/UEMA: o problema com sistemas não era técnico — era a sensação de não ter suporte."],who:["UX Designer","Service Designer","Product Manager","Facilitador"]},
  {id:"blueprint",type:"artefato",category:"visualizacao",custom:false,name:{pt:"Blueprint de Serviço",en:"Service Blueprint"},origin:"G. Lynn Shostack — Harvard Business Review (1984)",desc:{pt:"Mapa visual que mostra a experiência do cliente + toda a operação interna em camadas: evidências físicas, ações do cliente, linha de frente, bastidores e sistemas de suporte. Revela onde os problemas realmente estão.",en:"Visual map showing customer experience + all internal operations in layers: physical evidence, customer actions, front stage, backstage and support systems. Reveals where problems really are."},steps:{pt:["Defina o serviço, o escopo e o usuário a mapear","Mapeie as evidências físicas (o que o cliente toca/vê)","Mapeie as ações do cliente passo a passo","Trace a Linha de Visibilidade (visível / invisível)","Mapeie ações da linha de frente (funcionários visíveis)","Mapeie bastidores, processos de suporte e sistemas"],en:["Define the service, scope and user to map","Map physical evidence","Map customer actions step by step","Draw the Line of Visibility","Map front stage actions","Map backstage and support systems"]},examples:["UPA: paciente reclama de espera — Blueprint revelou que o prontuário travava a triagem. Solução foi no sistema, não no treinamento.","INSS: 'atendente mal comunicativo' — Blueprint revelou que CNIS e Receita não conversavam em tempo real.","Starbucks: barista precisava de 6 sistemas diferentes para processar 1 pedido personalizado.","Matrícula escolar: o sistema online não reservava a vaga — apenas gerava um protocolo.","CTIC/UEMA: 40% dos serviços dependiam de conhecimento tácito de técnicos específicos."],who:["Service Designer","UX Designer","Gestor de Operações","Product Manager"]},
  {id:"jornada-usuario",type:"artefato",category:"visualizacao",custom:false,name:{pt:"Jornada do Usuário",en:"User Journey Map"},origin:"Experience Design — adaptado de Experiential Marketing / anos 1990–2000",desc:{pt:"Mapa sequencial das experiências, emoções e pontos de contato do usuário ao longo do tempo. Pode mostrar a situação atual (as-is) ou a experiência futura desejada (to-be).",en:"Sequential map of user experiences, emotions and touchpoints over time. Can show current (as-is) or desired future (to-be) experience."},steps:{pt:["Defina a persona e o cenário específico a mapear","Liste cada etapa que o usuário percorre da ponta à ponta","Registre o que ele pensa e sente em cada etapa","Identifique os pontos de contato (canais, interfaces, pessoas)","Marque pontos de atrito 🔴 e momentos de valor 🟢","Identifique oportunidades de melhoria em cada atrito"],en:["Define persona and specific scenario","List each step end-to-end","Record thoughts and feelings at each step","Identify touchpoints","Mark friction 🔴 and value 🟢 moments","Identify improvement opportunities"]},examples:["iFood: sequência intencional do 1º pedido — conversão para 2º pedido +23%.","Disney: arco dramático completo de cada visita — o último momento é sempre memorável.","Banco: o maior abandono era pedir RG e CPF separados — 2 palavras resolveram.","Plano de saúde: paciente fazia 5 ligações para autorizar um exame que deveria ser 1.","CTIC/UEMA: 70% dos chamados resolvidos na ligação inicial, mas registrados como se levassem dias."],who:["UX Designer","Service Designer","Product Designer","Pesquisador"]},
  {id:"mapa-stakeholders",type:"artefato",category:"visualizacao",custom:false,name:{pt:"Mapa de Stakeholders",en:"Stakeholder Map"},origin:"Gestão de Projetos / Service Design — adaptado para UX nos anos 2000",desc:{pt:"Visualização de todos os atores envolvidos em um serviço e seus relacionamentos. Revela quem influencia, quem é impactado e quem precisa estar no processo de design.",en:"Visualization of all actors involved in a service and their relationships. Reveals who influences, who is impacted and who needs to be in the design process."},steps:{pt:["Liste todos os atores: usuários, funcionários, parceiros, reguladores","Identifique nível de influência e impacto de cada um","Posicione no mapa: centro (maior influência) → periferia","Desenhe as conexões e o tipo de relação entre eles","Identifique stakeholders 'esquecidos' que afetam o serviço","Use para decidir quem incluir na pesquisa e codesign"],en:["List all actors","Identify influence and impact levels","Position: center (most influence) to periphery","Draw connections and relationship types","Identify 'forgotten' stakeholders","Use to decide who to include"]},examples:["Hospital: empresa de limpeza (stakeholder esquecido) impactava diretamente a experiência do paciente.","App de entrega: o restaurante (não o entregador) era o principal ponto de fricção.","INSS: problema não era interno — falta de integração com Receita Federal.","Startup B2B: usuário e comprador tinham necessidades opostas — o mapa tornou isso visual.","CTIC/UEMA: 3 departamentos com dados duplicados gerando inconsistências."],who:["Service Designer","UX Designer","Gestor de Projeto","Consultor"]},
  {id:"hmw",type:"tecnica",category:"ideacao",custom:false,name:{pt:"Como nós poderíamos? (HMW)",en:"How Might We? (HMW)"},origin:"Procter & Gamble (1970s) — popularizado pelo IDEO e d.school Stanford",desc:{pt:"Reformulação de problemas em perguntas de oportunidade abertas. 'Como' sugere possibilidade. 'Nós' convida à colaboração. 'Poderíamos' abre alternativas sem limitar a solução.",en:"Reformulation of problems into open opportunity questions. 'How' suggests possibility. 'We' invites collaboration. 'Might' opens alternatives."},steps:{pt:["Parta de um insight de pesquisa ou ponto de atrito","Reformule como 'Como nós poderíamos...' — sem solução embutida","Crie versões em 3 escalas: muito ampla, certa, muito estreita","Selecione a HMW mais equilibrada para iniciar a ideação","Poste as HMWs no mural como prompts para brainstorming","Conecte cada ideia gerada à HMW que a inspirou"],en:["Start from insight or friction point","Reformulate as 'How might we...'","Create 3 scale versions","Select most balanced HMW","Post on board as prompts","Connect each idea to the HMW"]},examples:["'Check-in lento' → 'Como tornar o check-in uma experiência de boas-vindas?' — soluções além de acelerar.","Google usa HMW nos Design Sprints para transformar cada dor em pergunta.","'Pacientes não tomam remédios' → 'Como fazer o horário fazer parte da rotina?' — além de alarmes.","'Portal difícil' → 'Como qualquer servidor encontra o serviço em menos de 30 segundos?'","Amazon usa HMW internamente antes de decidir qualquer solução técnica."],who:["Facilitador","UX Designer","Service Designer","Qualquer equipe"]},
  {id:"crazy-8",type:"tecnica",category:"ideacao",custom:false,name:{pt:"Crazy 8's",en:"Crazy 8's"},origin:"Google Ventures — Design Sprint (Jake Knapp, 2010)",desc:{pt:"Técnica de ideação rápida: 8 esboços em 8 minutos. Força volume de ideias diferentes antes de convergir. Elimina o bloqueio criativo de 'precisar ter a ideia certa'.",en:"Rapid ideation: 8 sketches in 8 minutes. Forces volume of different ideas before converging. Eliminates the creative block of 'needing the right idea'."},steps:{pt:["Dobre uma folha A4 em 8 partes iguais (3 dobras)","Configure um timer de 8 minutos (1 min por quadrante)","Esboce 8 ideias diferentes — qualidade não importa","Não repita a mesma ideia com pequena variação","Apresente para o grupo em 3 min (todos simultaneamente)","Vote nas ideias mais promissoras com pontos adesivos"],en:["Fold A4 sheet into 8 equal parts","Set 8-minute timer","Sketch 8 different ideas","Don't repeat with small variation","Present to group in 3 min","Vote on most promising ideas"]},examples:["Google usa Crazy 8's nos Design Sprints para evitar que uma ideia domine cedo demais.","Slack: barra lateral de canais gerada em um Crazy 8's — óbvia só depois de desenhada.","iFood explorou formas de comunicar status do pedido — de notificações push a animações de mapa.","CTIC/UEMA: 40+ ideias para a tela inicial do portal em 5 minutos de equipe.","Airbnb usa Crazy 8's para evitar que a primeira ideia (sempre a mais óbvia) seja a única."],who:["UX Designer","Product Designer","Facilitador","Qualquer equipe"]},
  {id:"prototipo-papel",type:"metodo",category:"prototipagem",custom:false,name:{pt:"Prototipagem em papel",en:"Paper prototyping"},origin:"Carolyn Snyder — 'Paper Prototyping' (2003)",desc:{pt:"Criação de protótipos de baixa fidelidade com papel, caneta e tesoura. Permite testar fluxos com usuários reais antes de qualquer código — rápido, barato e descartável.",en:"Low-fidelity prototypes with paper, pen and scissors. Tests flows with real users before any code — fast, cheap and disposable."},steps:{pt:["Esboce as telas principais à mão em folhas separadas","Crie elementos interativos em papel (botões, menus, cards)","Defina um usuário e uma tarefa específica para testar","Simule a interação: usuário aponta, você troca as 'telas'","Observe onde o usuário hesita, erra ou pergunta","Itere o protótipo imediatamente após cada teste"],en:["Sketch main screens by hand","Create interactive elements in paper","Define user and specific task","Simulate: user points, you swap screens","Observe where user hesitates or errs","Iterate immediately after each test"]},examples:["Google criou o primeiro protótipo do Maps em papel antes de qualquer desenvolvimento.","Dropbox testou sincronização — usuários não entendiam 'nuvem', mas entendiam 'cópia automática'.","CTIC/UEMA: protótipos em papel do portal economizaram semanas de retrabalho.","Hospital testou formulário de triagem — 3 campos nunca eram preenchidos, foram eliminados.","Startup testou 5 versões do fluxo de abertura de conta em papel em um único dia."],who:["UX Designer","Product Designer","Service Designer","Qualquer pessoa"]},
  {id:"desktop-walkthrough",type:"metodo",category:"prototipagem",custom:false,name:{pt:"Desktop Walkthrough",en:"Desktop Walkthrough"},origin:"Service Design — 'This is Service Design Doing' (Stickdorn et al.)",desc:{pt:"Simulação física do serviço com objetos em mesa representando cada elemento. Revela falhas que só ficam visíveis quando o processo é VIVIDO, não descrito.",en:"Physical simulation of the service with objects on a table. Reveals flaws that only become visible when the process is LIVED, not described."},steps:{pt:["Defina o serviço e o cenário a simular","Crie representações físicas de cada ator e ponto de contato","Atribua papéis a cada participante (cliente, funcionário, sistema)","Simule o processo em câmera lenta, etapa por etapa","Pause para discutir cada momento crítico","Documente os problemas encontrados e itere"],en:["Define service and scenario","Create physical representations","Assign roles to each participant","Simulate in slow motion","Pause to discuss critical moments","Document and iterate"]},examples:["Hospital: simulação revelou que o problema era a posição física da impressora de laudos.","Banco: CEO entendeu em 15 min o que relatórios descreviam há meses.","Logística: sistema de rastreamento atualizava 4 horas depois do entregador já ter saído.","CTIC/UEMA: 3 etapas redundantes no fluxo de suporte técnico reveladas e eliminadas.","Governo redesenhou fluxo de benefícios antes de atualizar o sistema — meses economizados."],who:["Service Designer","UX Designer","Facilitador","Gestor de Operações"]},
  {id:"teste-usabilidade",type:"metodo",category:"avaliacao",custom:false,name:{pt:"Teste de Usabilidade",en:"Usability Testing"},origin:"Jakob Nielsen & Tom Landauer — Nielsen Norman Group (1990s)",desc:{pt:"Usuários reais realizam tarefas específicas enquanto o pesquisador observa. 5 usuários revelam 85% dos problemas de usabilidade — mais que isso é desperdício.",en:"Real users perform specific tasks while the researcher observes. 5 users reveal 85% of usability problems — more than that is waste."},steps:{pt:["Defina as tarefas críticas a testar","Recrute 5 usuários representativos","Configure o ambiente: moderado ou não moderado","Apresente o protocolo think-aloud: 'pense em voz alta'","Observe sem interferir — não ajude mesmo quando errarem","Analise gravações e priorize problemas por severidade"],en:["Define critical tasks to test","Recruit 5 representative users","Set up moderated or unmoderated environment","Introduce think-aloud protocol","Observe without interfering","Analyze and prioritize by severity"]},examples:["Amazon: botão '1-Click' mal interpretado — ajuste no texto reduziu abandono em 18%.","Detran-SP: 3 pontos de abandono corrigidos em sprints separados — 67% → 19%.","Google Maps: 'Obter rotas' vs 'Calcular rota' — 2 palavras, impacto de milhões de usuários.","Portal CTIC: link de chamado nomeado como 'Central de Serviços' — ninguém encontrava.","Netflix testa todas as mudanças de interface antes de ir para 100% da base."],who:["UX Researcher","UX Designer","Product Manager","Desenvolvedor"]},
  {id:"avaliacao-heuristica",type:"metodo",category:"avaliacao",custom:false,name:{pt:"Avaliação Heurística",en:"Heuristic Evaluation"},origin:"Jakob Nielsen & Rolf Molich — 'Usability Inspection Methods' (1990)",desc:{pt:"Especialistas avaliam uma interface com base nas 10 heurísticas de Nielsen. Identifica problemas sem usuários — rápido, barato e eficaz para ciclos iniciais.",en:"Experts evaluate an interface based on Nielsen's 10 heuristics. Identifies problems without users — fast, cheap and effective for early cycles."},steps:{pt:["Reúna 3–5 avaliadores com conhecimento em usabilidade","Defina o escopo: quais fluxos ou telas serão avaliados","Cada avaliador percorre o sistema individualmente","Lista os problemas com severidade (1–4)","Consolide os problemas em uma lista única","Priorize por severidade para o backlog de melhorias"],en:["Gather 3–5 evaluators with usability knowledge","Define scope","Each evaluator goes through independently","List problems with severity (1–4)","Consolidate into one list","Prioritize by severity"]},examples:["CTIC/UEMA: 47 problemas encontrados sem nenhum usuário presente.","Governo federal: 80% dos portais violavam 'prevenção de erros' em formulários.","Startup: 7 de 10 heurísticas violadas — identificado antes de gastar em teste com usuários.","Hospital: sistema de agendamento não comunicava se a consulta foi confirmada.","Banco: problemas críticos encontrados em 2 dias, economizando semanas de retrabalho."],who:["UX Designer","UX Researcher","Product Designer","Desenvolvedor"]},

  {id:"job-story",type:"tecnica",category:"estrategia",custom:false,name:{pt:"Job Story",en:"Job Story"},origin:"Alan Klement — intercom.io (2013) / Jobs-to-be-Done (Clayton Christensen)",desc:{pt:"Alternativa às User Stories focada em contexto e motivação real. Formato: 'Quando [situação], quero [motivação], para [resultado].' Remove o foco na persona, coloca na circunstância.",en:"Alternative to User Stories focused on real context and motivation. Format: 'When [situation], I want [motivation], so that [result].' Removes focus from persona, places it on circumstance."},steps:{pt:["Identifique a situação específica que desencadeia a ação","Descreva a motivação real (o que o usuário quer, não o que faz)","Defina o resultado esperado (o 'trabalho' que precisa ser feito)","Escreva: 'Quando [situação], quero [motivação], para [resultado]'","Valide com pesquisa: essa situação realmente existe?","Use para guiar decisões — não como especificação técnica"],en:["Identify the specific triggering situation","Describe the real motivation","Define the expected outcome","Write: 'When [situation], I want [motivation], so that [result]'","Validate with research","Use to guide decisions"]},examples:["Spotify: 'Quando estou malhando, quero música que mantenha meu ritmo, para não perder motivação.'","iFood: 'Quando chego em casa cansado, quero pedir comida sem pensar, para comer algo bom sem esforço.'","Portal CTIC: 'Quando meu computador trava em reunião, quero abrir chamado rapidamente, para voltar ao trabalho.'","Nubank: 'Quando vejo cobrança estranha, quero entender sem ligar, para resolver sem perder tempo.'","App de saúde: 'Quando esqueço o remédio, quero ser lembrado gentilmente, para manter a rotina sem culpa.'"],who:["Product Manager","UX Designer","Service Designer","Desenvolvedor"]},
